,{id:'ct11',t:'C/T vs CZA',q:'¿Cuántos estudios y pacientes incluyó el metaanálisis de Li 2026?',o:['3 estudios, 200 pacientes','22 estudios con 3.361 pacientes: 10 cohortes de comparación directa y 12 ensayos para comparación indirecta','50 ensayos aleatorizados','Solo CACTUS'],a:1,e:'Las comparaciones indirectas usaron carbapenémicos como comparador común, en un metaanálisis en red.',r:'Li P, Int J Infect Dis 2026'}
,{id:'ct12',t:'C/T vs CZA',q:'¿Qué encontró el metaanálisis sobre mortalidad?',o:['Menor con ceftolozano-tazobactam','Sin diferencia con datos ajustados (OR 1,00), aunque los datos crudos favorecían a ceftazidima-avibactam','Mayor con ceftolozano-tazobactam en datos ajustados','No se analizó'],a:1,e:'La diferencia entre datos crudos y ajustados muestra el peso de la confusión en estudios observacionales: por eso el análisis principal usó datos ajustados.',r:'Li P, Int J Infect Dis 2026'}
,{id:'ct13',t:'C/T vs CZA',q:'¿En qué desenlace el metaanálisis encontró ventaja para ceftolozano-tazobactam?',o:['Mortalidad','Menor recurrencia de infección a 30–90 días (OR ajustado 0,46)','Menos daño renal','Menos resistencia'],a:1,e:'Respuesta clínica, erradicación, daño renal agudo y emergencia de resistencia no mostraron diferencias.',r:'Li P, Int J Infect Dis 2026'}
,{id:'ct14',t:'C/T vs CZA',q:'¿Cómo definió el metaanálisis la emergencia de resistencia in vivo?',o:['Cualquier cambio de CIM','Aumento ≥4 veces de la CIM dentro de 90 días, o CIM ≥8 mg/L en sobrevivientes después de 30 días','Solo genotipo','Resistencia basal'],a:1,e:'No hubo diferencia entre ambos fármacos (OR ajustado 1,17).',r:'Li P, Int J Infect Dis 2026'}
,{id:'ct15',t:'C/T vs CZA',q:'¿Qué certeza de evidencia asignó el metaanálisis a sus conclusiones?',o:['Alta','Moderada a muy baja (GRADE): los estudios son observacionales y no hay ensayos directos','Solo baja','No se evaluó'],a:1,e:'La conclusión práctica: eficacia comparable, con evidencia moderada de menor recurrencia con ceftolozano-tazobactam, sobre todo en neumonía.',r:'Li P, Int J Infect Dis 2026'}

,{id:'pr_1',t:'Prostatitis',q:'¿Cuál es el agente más frecuente en la prostatitis bacteriana aguda?',o:['Enterococcus faecalis','Escherichia coli (cerca de 2/3 de los casos)','Staphylococcus aureus','Chlamydia trachomatis'],a:1,e:'Le siguen otros Enterobacterales, Klebsiella y P. aeruginosa, esta última más frecuente en infecciones asociadas a la atención de salud.',r:'Kulkarni PA, Clin Infect Dis 2026; EAU 2025'}
,{id:'pr_2',t:'Prostatitis',q:'En la prostatitis bacteriana crónica, ¿qué agente gana importancia respecto de la aguda?',o:['Pseudomonas aeruginosa','Enterococcus spp.','Candida','Klebsiella'],a:1,e:'Enterococcus aparece en ~40% de los aislados en series de prostatitis crónica, aunque E. coli sigue siendo el gramnegativo más común. Los estafilococos coagulasa negativos pueden ser contaminantes.',r:'Kulkarni PA, Clin Infect Dis 2026; EAU 2025'}
,{id:'pr_3',t:'Prostatitis',q:'¿Por qué las fluoroquinolonas son el pilar en prostatitis, sobre todo en la crónica?',o:['Por su espectro antianaeróbico','Son liposolubles y atraviesan el endotelio capilar no fenestrado de la próstata, alcanzando buenas concentraciones','Porque se eliminan por bilis','Porque son bactericidas en anaerobiosis'],a:1,e:'En la crónica, con poca inflamación, la barrera está intacta y el pH de la secreción prostática también influye. Los betalactámicos y la nitrofurantoína penetran mal.',r:'Kulkarni PA, Clin Infect Dis 2026; EAU 2025'}
,{id:'pr_4',t:'Prostatitis',q:'Hombre con ITU febril y próstata dolorosa. ¿Es adecuada la nitrofurantoína?',o:['Sí, es de primera línea','No: logra concentraciones solo urinarias y penetra mal en la próstata','Sí, por 14 días','Solo si es BLEE'],a:1,e:'Tampoco sirve en pielonefritis ni bacteriemia. Su uso es la cistitis no complicada.',r:'Kulkarni PA, Clin Infect Dis 2026; EAU 2025'}
,{id:'pr_5',t:'Prostatitis',q:'Prostatitis aguda con fiebre y compromiso sistémico, sin cultivos aún. ¿Qué tratamiento empírico es razonable?',o:['Nitrofurantoína','Cefalosporina de 3ª generación, piperacilina-tazobactam o fluoroquinolona según riesgo y epidemiología local','Azitromicina','Amoxicilina oral'],a:1,e:'Considerar factores de riesgo de BLEE o Pseudomonas (manipulación urológica, uso previo de antibióticos) y ajustar con el cultivo.',r:'Kulkarni PA, Clin Infect Dis 2026; EAU 2025'}
,{id:'pr_6',t:'Prostatitis',q:'Prostatitis aguda tras biopsia transrectal en un paciente que recibió ciprofloxacino como profilaxis. ¿Qué agente preocupa?',o:['S. aureus','E. coli resistente a quinolonas y productora de BLEE','Chlamydia','Enterococcus faecium VRE'],a:1,e:'En una serie, ~43% de los E. coli de prostatitis post biopsia eran BLEE. En sepsis, conviene un carbapenémico empírico hasta tener el antibiograma.',r:'Kulkarni PA, Clin Infect Dis 2026; EAU 2025'}
,{id:'pr_7',t:'Prostatitis',q:'Prostatitis aguda afebril desde hace 48 h, E. coli sensible. ¿Qué opciones orales hay para completar el tratamiento?',o:['Amoxicilina-clavulánico o cefuroxima como primera opción','Fluoroquinolona o TMP-SMX','Nitrofurantoína o fosfomicina dosis única','Azitromicina'],a:1,e:'Son las opciones con mejor penetración prostática. Por ejemplo: ciprofloxacino 500–750 mg c/12 h, levofloxacino 500–750 mg/día o TMP-SMX 160/800 mg c/12 h.',r:'Kulkarni PA, Clin Infect Dis 2026; EAU 2025'}
,{id:'pr_8',t:'Prostatitis',q:'¿Cuánto dura el tratamiento de una prostatitis bacteriana aguda?',o:['5–7 días','Al menos 2 semanas','6 meses','Dosis única'],a:1,e:'En hombres con ITU febril, 7 días fueron inferiores a 14 (Lafaurie, CID 2023). Algunos casos justifican más tiempo.',r:'Kulkarni PA, Clin Infect Dis 2026; Lafaurie M, Clin Infect Dis 2023'}
,{id:'pr_9',t:'Prostatitis',q:'¿Cuánto dura el tratamiento de una prostatitis bacteriana crónica?',o:['7 días','4–6 semanas, con la mayor evidencia para fluoroquinolonas','2 semanas','12 meses'],a:1,e:'En casos refractarios se puede repetir el esquema, extender hasta 12 semanas o cambiar a otra familia.',r:'Kulkarni PA, Clin Infect Dis 2026; EAU 2025'}
,{id:'pr_10',t:'Prostatitis',q:'Prostatitis crónica en un paciente que no puede recibir fluoroquinolonas por una tendinitis de Aquiles previa. ¿Qué alternativa tiene más respaldo?',o:['Amoxicilina','TMP-SMX 160/800 mg c/12 h','Nitrofurantoína','Cefalexina'],a:1,e:'Es la principal alternativa a quinolonas si el aislado es sensible. Vigilar potasio y creatinina.',r:'Kulkarni PA, Clin Infect Dis 2026; EAU 2025'}
,{id:'pr_11',t:'Prostatitis',q:'Prostatitis crónica por E. coli BLEE resistente a quinolonas y TMP-SMX. ¿Qué opción oral se ha usado?',o:['Nitrofurantoína','Fosfomicina oral 3 g cada 24–48 h por varias semanas','Amoxicilina-clavulánico','Azitromicina'],a:1,e:'Hay series y un ensayo fase I-II con ~80% de curación microbiológica. Es una opción cuando no se pueden usar los fármacos de primera línea.',r:'Kulkarni PA, Clin Infect Dis 2026; EAU 2025'}
,{id:'pr_12',t:'Prostatitis',q:'Hombre joven, sexualmente activo, con prostatitis y cultivo convencional negativo. ¿Qué agentes considerar?',o:['Solo E. coli','Chlamydia trachomatis y Mycoplasma genitalium','Candida','Mycobacterium avium'],a:1,e:'Para Chlamydia, la doxiciclina tiene mejores resultados que la azitromicina en uretritis e infección rectal; en prostatitis no está claro.',r:'Kulkarni PA, Clin Infect Dis 2026; EAU 2025'}
,{id:'pr_13',t:'Prostatitis',q:'Aparece S. aureus en el cultivo de un absceso prostático. ¿Qué debes pensar?',o:['Contaminación','Siembra hematógena: buscar bacteriemia y otros focos metastásicos','Es lo esperable','Infección de transmisión sexual'],a:1,e:'S. aureus no es un uropatógeno habitual. Pide hemocultivos y maneja como una bacteriemia por S. aureus.',r:'Kulkarni PA, Clin Infect Dis 2026; EAU 2025'}
,{id:'pr_14',t:'Prostatitis',q:'¿Cuándo drenar un absceso prostático?',o:['Nunca','En general si mide >2 cm; manejo sin cirugía solo si es pequeño (≤1–2 cm), único, con buena respuesta y control por imagen','Siempre antes de iniciar antibióticos','Solo si hay S. aureus'],a:1,e:'Lo habitual es la aspiración o el drenaje guiado. Enviar el material a cultivo.',r:'Kulkarni PA, Clin Infect Dis 2026; EAU 2025'}
,{id:'pr_15',t:'Prostatitis',q:'¿Qué maniobra está contraindicada en la prostatitis aguda?',o:['Tacto rectal breve y suave','Masaje prostático','Toma de urocultivo','Ecografía'],a:1,e:'El tacto suave (<5 s) sirve para el diagnóstico (próstata dolorosa o fluctuante). El masaje se reserva para el test de Meares-Stamey en la crónica. Evitar el tacto en neutropenia.',r:'Kulkarni PA, Clin Infect Dis 2026; EAU 2025'}
,{id:'pr_16',t:'Prostatitis',q:'¿Cuándo es positivo el test de 2 vasos de Meares-Stamey?',o:['Con cualquier leucocito en orina','Cuando la orina post masaje tiene ≥10 veces más UFC que la previa, o crece un uropatógeno solo después del masaje','Con PSA elevado','Con hemocultivo positivo'],a:1,e:'Se hace sin antibióticos y no dentro de las 72 h posteriores a una eyaculación. El PSA no se recomienda para el diagnóstico.',r:'Kulkarni PA, Clin Infect Dis 2026; EAU 2025'}
,{id:'pr_17',t:'Prostatitis',q:'Prostatitis aguda con retención urinaria. ¿Qué manejo del drenaje vesical se asoció a menos evolución a prostatitis crónica?',o:['Sonda Foley uretral de rutina','Cistostomía suprapúbica, evitando la sonda uretral','No drenar','Masaje prostático'],a:1,e:'Si se necesita una sonda uretral, conviene una sonda Coudé puesta con cuidado.',r:'Kulkarni PA, Clin Infect Dis 2026; EAU 2025'}
,{id:'pr_18',t:'Prostatitis',q:'Prostatitis después de BCG intravesical. ¿Qué antituberculoso NO sirve?',o:['Isoniazida','Rifampicina','Pirazinamida','Etambutol'],a:2,e:'M. bovis BCG es intrínsecamente resistente a pirazinamida.',r:'Kulkarni PA, Clin Infect Dis 2026; EAU 2025'}

,{id:'mg1',t:'Meningitis',q:'En adultos con meningitis bacteriana adquirida en la comunidad, ¿cuáles son los dos agentes principales?',o:['E. coli y Klebsiella','S. pneumoniae (~70%) y N. meningitidis (~10%)','S. aureus y estreptococo grupo B','Listeria y H. influenzae'],a:1,e:'Listeria explica ~5% en mayores de 16 años, sobre todo sobre 50 años o con inmunidad celular alterada. En neonatos predominan estreptococo grupo B y E. coli, seguidos de Listeria.',r:'Hasbun R, JAMA 2022; IDSA 2004'}
,{id:'mg2',t:'Meningitis',q:'Adulto de 35 años inmunocompetente con sospecha de meningitis bacteriana. ¿Esquema empírico?',o:['Ceftriaxona sola','Vancomicina + ceftriaxona (o cefotaxima) + dexametasona','Ampicilina + gentamicina','Meropenem solo'],a:1,e:'La vancomicina se agrega donde la resistencia de neumococo a ceftriaxona supera el 1% (CIM ≥2). Si se confirma neumococo sensible, se suspende.',r:'Hasbun R, JAMA 2022; IDSA 2004'}
,{id:'mg3',t:'Meningitis',q:'Paciente de 72 años con meningitis. ¿Qué agregas al esquema de vancomicina + ceftriaxona?',o:['Metronidazol','Ampicilina, para cubrir Listeria','Gentamicina','Aciclovir siempre'],a:1,e:'Ampicilina también en inmunosuprimidos (sida, trasplante, corticoides crónicos), embarazadas y neonatos. Las cefalosporinas no cubren Listeria.',r:'Hasbun R, JAMA 2022; IDSA 2004'}
,{id:'mg4',t:'Meningitis',q:'¿Qué dosis de ceftriaxona se usa en meningitis en adultos?',o:['1 g c/24 h','2 g c/12 h','2 g c/24 h','500 mg c/12 h'],a:1,e:'Cefotaxima: 2 g c/4–6 h. Las dosis meníngeas son más altas porque la penetración al LCR es limitada.',r:'Hasbun R, JAMA 2022; IDSA 2004'}
,{id:'mg5',t:'Meningitis',q:'¿Qué dosis de ampicilina se usa en meningitis por Listeria en adultos?',o:['1 g c/8 h','2 g c/4 h (12 g/día)','500 mg c/6 h','2 g c/12 h'],a:1,e:'Penicilina G: 4 millones de UI c/4 h. En alergia a penicilina: TMP-SMX 5 mg/kg (de trimetoprim) c/8 h.',r:'Hasbun R, JAMA 2022; IDSA 2004'}
,{id:'mg6',t:'Meningitis',q:'¿Qué dosis de vancomicina se usa en meningitis?',o:['500 mg c/12 h','15–20 mg/kg c/8–12 h (sin superar 2 g por dosis ni 60 mg/kg/día), considerando una carga','1 g c/24 h','30 mg/kg c/24 h'],a:1,e:'La revisión menciona valles de 15–20 mg/L, pero hoy se prefiere el AUC con valle alto vigilando la nefrotoxicidad. La dexametasona reduce la inflamación meníngea y puede disminuir su penetración al LCR.',r:'Hasbun R, JAMA 2022; IDSA 2004'}
,{id:'mg7',t:'Meningitis',q:'Meningitis por Listeria confirmada. ¿Qué haces con la dexametasona y qué agregas?',o:['Mantener dexametasona y usar ceftriaxona','Suspender la dexametasona y tratar con ampicilina, considerando agregar gentamicina','Mantener todo igual','Cambiar a meropenem y mantener dexametasona'],a:1,e:'La dexametasona se asoció a más mortalidad en neurolisteriosis (MONALISA). Agregar gentamicina se asoció a menor mortalidad pese a su mala penetración al LCR.',r:'Hasbun R, JAMA 2022; IDSA 2004'}
,{id:'mg8',t:'Meningitis',q:'¿Cuál es la dosis y el momento de la dexametasona adyuvante en adultos?',o:['1 mg/kg/día por 14 días, después de los cultivos','0,15 mg/kg (10 mg) c/6 h por 4 días, antes o junto con la primera dosis de antibiótico','Solo si hay shock','Dosis única de 4 mg'],a:1,e:'Idealmente en los 20 minutos previos o junto con la primera dosis. Las guías europeas y del Reino Unido aceptan iniciarla hasta 4–12 h después.',r:'Hasbun R, JAMA 2022; IDSA 2004'}
,{id:'mg9',t:'Meningitis',q:'¿En qué etiología se demostró el mayor beneficio de la dexametasona en adultos?',o:['Meningococo','Neumococo: desenlaces desfavorables de 52% a 26%','Listeria','Meningitis viral'],a:1,e:'En niños de países de altos ingresos el beneficio fue menos hipoacusia por H. influenzae. En países de bajos ingresos no redujo la mortalidad.',r:'Hasbun R, JAMA 2022; IDSA 2004'}
,{id:'mg10',t:'Meningitis',q:'¿Qué pacientes necesitan TAC antes de la punción lumbar?',o:['Todos','Inmunosuprimidos, antecedente de enfermedad del SNC, convulsión nueva, papiledema, compromiso de conciencia o déficit focal','Solo mayores de 80 años','Nadie'],a:1,e:'Si se necesita TAC, NO se debe retrasar el tratamiento: tomar hemocultivos, dar dexametasona y antibióticos, y después hacer la imagen.',r:'Hasbun R, JAMA 2022; IDSA 2004'}
,{id:'mg11',t:'Meningitis',q:'¿Qué pasa con la mortalidad si el antibiótico se retrasa más de 6 horas?',o:['No cambia','Sube de ~6% a hasta ~45%','Baja','Solo aumentan las secuelas'],a:1,e:'Las secuelas neurológicas también aumentan. El antibiótico no debe esperar la TAC ni la punción si hay demora.',r:'Hasbun R, JAMA 2022; IDSA 2004'}
,{id:'mg12',t:'Meningitis',q:'¿Qué perfil de LCR es típico de la meningitis bacteriana?',o:['<100 células, linfocitos, glucosa normal','>1.000 leucocitos/µL con >50% neutrófilos, proteínas >100 mg/dL y glucosa <30 mg/dL','Solo proteínas altas','Glucosa alta y eosinófilos'],a:1,e:'Hasta 2% tiene <5 células/µL. El Gram tiene sensibilidad de 50–90%. El lactato en LCR (AUC ~0,98) ayuda, pero pierde sensibilidad si ya recibió antibióticos.',r:'Hasbun R, JAMA 2022; IDSA 2004'}
,{id:'mg13',t:'Meningitis',q:'Meningitis por N. meningitidis con CIM de penicilina 0,06 mg/L. ¿Qué tratamiento definitivo?',o:['Vancomicina','Penicilina G o ampicilina','Meropenem','Ciprofloxacino'],a:1,e:'Con CIM 0,1–1,0, ceftriaxona o cefotaxima. Duración habitual: 7 días.',r:'Hasbun R, JAMA 2022; IDSA 2004'}
,{id:'mg14',t:'Meningitis',q:'S. pneumoniae en el LCR con CIM de ceftriaxona ≥1 mg/L. ¿Qué tratamiento?',o:['Ceftriaxona sola','Vancomicina + ceftriaxona (alternativa: vancomicina + moxifloxacino)','Penicilina G','Ampicilina'],a:1,e:'Con CIM de penicilina ≤0,06: penicilina G o ampicilina. Con CIM de penicilina ≥0,12 y ceftriaxona <1: ceftriaxona sola. Duración habitual: 10–14 días.',r:'Hasbun R, JAMA 2022; IDSA 2004'}
,{id:'mg15',t:'Meningitis',q:'¿Por qué se evita el imipenem en meningitis y se prefiere el meropenem?',o:['Por espectro','Por el riesgo de convulsiones: <1% con meropenem vs 3–33% con imipenem','Por costo','Porque el imipenem no penetra el LCR'],a:1,e:'Meropenem en meningitis: 2 g c/8 h. Cefepime también puede dar encefalopatía, sobre todo en insuficiencia renal.',r:'Hasbun R, JAMA 2022; IDSA 2004'}
,{id:'mg16',t:'Meningitis',q:'Meningitis por S. aureus resistente a meticilina. ¿Cuál es el tratamiento de elección?',o:['Cefazolina','Vancomicina (alternativas: linezolid, TMP-SMX, daptomicina o ceftarolina)','Ceftriaxona','Clindamicina'],a:1,e:'En SAMS: nafcilina u oxacilina (o cloxacilina) 2 g c/4 h. El S. aureus en el LCR suele ser posquirúrgico o asociado a dispositivos.',r:'Hasbun R, JAMA 2022; IDSA 2004'}
,{id:'mg17',t:'Meningitis',q:'¿Qué duración se recomienda según el agente de la meningitis?',o:['7 días para todos','Meningococo y H. influenzae ~7 días; neumococo 10–14; estreptococo grupo B 14–21; bacilos gramnegativos y Listeria ≥21 días','21 días para todos','Hasta normalizar el LCR'],a:1,e:'Son recomendaciones de expertos (IDSA 2004) que se ajustan según la respuesta clínica y las complicaciones.',r:'Tunkel AR, Clin Infect Dis 2004 (IDSA)'}
,{id:'mg18',t:'Meningitis',q:'Meningitis por Enterobacterales en un paciente alérgico grave a betalactámicos. ¿Qué opciones penetran el SNC?',o:['Nitrofurantoína','Aztreonam, fluoroquinolonas o TMP-SMX según sensibilidad','Clindamicina','Daptomicina'],a:1,e:'El tratamiento de elección es ceftriaxona o cefotaxima (meropenem si es BLEE). TMP-SMX tiene excelente penetración al LCR.',r:'Hasbun R, JAMA 2022; IDSA 2004'}
,{id:'mg19',t:'Meningitis',q:'Paciente con LCR inflamatorio, Gram negativo y panel PCR multiplex positivo para enterovirus, clínicamente estable. ¿Qué haces?',o:['Mantener 14 días de antibióticos','Se pueden suspender los antibióticos si no hay otra indicación','Agregar aciclovir siempre','Repetir la punción'],a:1,e:'El PCR multiplex (sensibilidad ~90% y especificidad ~97% para bacterias) se asoció a menos uso de antibióticos en infecciones virales: es una intervención PROA directa.',r:'Hasbun R, JAMA 2022; IDSA 2004'}
,{id:'mg20',t:'Meningitis',q:'¿Cómo se previene la meningitis neonatal precoz por estreptococo grupo B?',o:['Vacuna al recién nacido','Tamizaje vaginal-rectal a las 36–37 semanas y penicilina IV intraparto si es positivo','Amoxicilina en el tercer trimestre','Ceftriaxona al recién nacido'],a:1,e:'Previene la enfermedad precoz (0–6 días), pero no la tardía (7–89 días).',r:'Hasbun R, JAMA 2022; IDSA 2004'}

,{id:'ix1',t:'IDSA BLEE-AmpC',q:'Mujer con cistitis no complicada y urocultivo previo con E. coli BLEE. ¿Cuál de estas opciones NO se sugiere?',o:['Nitrofurantoína','Pivmecilinam','Amoxicilina-clavulánico','Gepotidacina'],a:2,e:'Preferidos para cistitis BLEE: aminoglucósido en dosis única, gepotidacina, nitrofurantoína, pivmecilinam, sulopenem y TMP-SMX. Amoxicilina-clavulánico tuvo menos curación que ciprofloxacino (58% vs 77%) y no se sugiere.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix2',t:'IDSA BLEE-AmpC',q:'¿Qué dosis de aminoglucósido se usa en dosis única para cistitis por BLEE?',o:['Gentamicina 1 mg/kg','Gentamicina 5 mg/kg o amikacina 15 mg/kg, una sola dosis IV','Amikacina 30 mg/kg por 3 días','Tobramicina 7 mg/kg c/8 h'],a:1,e:'Curación microbiológica ~95% con muy poco riesgo renal, gracias a su eliminación renal casi exclusiva.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix3',t:'IDSA BLEE-AmpC',q:'¿Por qué la fosfomicina oral solo se sugiere para E. coli y no para K. pneumoniae?',o:['Porque Klebsiella no se encuentra en orina','Porque K. pneumoniae porta con frecuencia el gen fosA, que inactiva la fosfomicina','Porque es nefrotóxica','Porque no hay presentación oral'],a:1,e:'Aun en E. coli, una dosis única de fosfomicina fue inferior a 5 días de nitrofurantoína (58% vs 70%).',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix4',t:'IDSA BLEE-AmpC',q:'¿Qué tiene de particular la gepotidacina?',o:['Es una fluoroquinolona más potente','Es un triazaacenaftileno que se une a la girasa y la topoisomerasa IV en sitios distintos de las quinolonas: la resistencia a ciprofloxacino no le da resistencia','Es un betalactámico','Es una tetraciclina'],a:1,e:'Dosis: 1,5 g VO c/12 h. Efecto adverso más común: diarrea. Su uso excesivo podría seleccionar resistencia en N. gonorrhoeae.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix5',t:'IDSA BLEE-AmpC',q:'¿Qué dosis de pivmecilinam sugiere la guía para cistitis?',o:['200 mg c/24 h','370 mg VO c/8 h (equivale a 400 mg de clorhidrato)','1 g c/12 h','185 mg c/12 h'],a:1,e:'Es un profármaco de mecilinam, mal sustrato para la mayoría de las betalactamasas. Tiene más de 90% de actividad contra E. coli BLEE.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix6',t:'IDSA BLEE-AmpC',q:'¿Por qué no se sugiere doxiciclina para cistitis por BLEE?',o:['Porque es nefrotóxica','Porque sus concentraciones urinarias son bajas (35–60% se excreta sin cambio)','Porque no cubre E. coli','Porque interactúa con el probenecid'],a:1,e:'Los datos de ITU con doxiciclina vienen de estudios pequeños, en su mayoría con P. aeruginosa.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix7',t:'IDSA BLEE-AmpC',q:'Pielonefritis por E. coli BLEE sensible a ciprofloxacino y TMP-SMX. ¿Qué es preferido?',o:['Meropenem por 14 días','TMP-SMX, ciprofloxacino o levofloxacino','Piperacilina-tazobactam','Cefepime en dosis alta'],a:1,e:'En ITU complicada, si hay sensibilidad, las orales son preferidas. Si no se pueden usar, la alternativa es cefepime-enmetazobactam o un carbapenémico.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix8',t:'IDSA BLEE-AmpC',q:'¿Qué precaución tiene la fosfomicina IV (6 g c/8 h) en ITU complicada por BLEE?',o:['Ototoxicidad','Gran aporte de sodio: cautela en adultos mayores e insuficiencia cardíaca','Prolonga el QT','Cristaluria'],a:1,e:'Es una alternativa, no preferida. Más cautela en K. pneumoniae por fosA.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix9',t:'IDSA BLEE-AmpC',q:'Bacteriemia por K. pneumoniae BLEE en un paciente en UCI con albúmina de 2,1 g/dL. ¿Qué carbapenémico prefieres?',o:['Ertapenem 1 g c/24 h','Meropenem o imipenem','Ertapenem 500 mg c/24 h','Da lo mismo'],a:1,e:'El ertapenem se une mucho a proteínas. Con albúmina <2,5 g/dL aumenta su fracción libre y su eliminación, y se asoció a más mortalidad a 30 días.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix10',t:'IDSA BLEE-AmpC',q:'Bacteriemia por E. coli BLEE, paciente estable y afebril. ¿Qué opción oral sirve para completar el tratamiento?',o:['Nitrofurantoína','Ciprofloxacino, levofloxacino o TMP-SMX si es sensible','Fosfomicina oral','Amoxicilina-clavulánico'],a:1,e:'Nitrofurantoína, fosfomicina, amoxicilina-clavulánico, doxiciclina, omadaciclina y sulopenem oral no se sugieren para bacteriemia.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix11',t:'IDSA BLEE-AmpC',q:'Paciente con cistitis en tratamiento empírico con piperacilina-tazobactam. Sale E. coli BLEE y está mejor. ¿Qué haces?',o:['Cambiar a meropenem y reiniciar el conteo de días','No cambiar ni alargar: el fármaco logra concentraciones urinarias altas','Agregar amikacina','Cambiar a fosfomicina por 14 días'],a:1,e:'En ITU complicada sin bacteriemia ni gravedad, piperacilina-tazobactam es alternativa. No se sugiere en infecciones invasivas fuera de la vía urinaria.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix12',t:'IDSA BLEE-AmpC',q:'¿Por qué el tazobactam protege peor que otros inhibidores frente a BLEE?',o:['Porque no inhibe enzimas de clase A','Proporción 8:1 (piperacilina:tazobactam), efecto inóculo, enzimas como OXA-1 que hacen poco fiable la CIM, y menor actividad si hay mucha BLEE o AmpC','Porque se elimina por bilis','Porque es inestable a pH ácido'],a:1,e:'En ceftolozano-tazobactam la proporción es 2:1, con más tazobactam relativo.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix13',t:'IDSA BLEE-AmpC',q:'E. coli BLEE con cefepime sensible (CIM 1) en una ITU complicada. ¿Usas cefepime?',o:['Sí, la CIM es baja','No: se sugiere evitar cefepime en ITU complicada e infección invasiva por BLEE aunque sea sensible','Sí, en dosis de 1 g c/12 h','Solo con amikacina'],a:1,e:'Un ensayo de ITU complicada por BLEE se detuvo precozmente: curación de 33% con cefepime vs 97% con ertapenem. En cistitis que ya mejoró con cefepime empírico, no hace falta cambiar.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix14',t:'IDSA BLEE-AmpC',q:'¿Qué dice la guía sobre las cefamicinas (cefoxitina) para BLEE?',o:['Son preferidas','No se sugieren hasta tener más datos de resultados y dosis óptima','Son de elección en bacteriemia','Solo para cistitis'],a:1,e:'Son estables frente a BLEE in vitro, pero los datos clínicos son observacionales y heterogéneos. El cefmetazol, no disponible en EE. UU., tiene los datos más alentadores.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix15',t:'IDSA BLEE-AmpC',q:'¿Qué especies se consideran de riesgo moderado de AmpC inducible clínicamente significativa?',o:['Serratia, Morganella y Providencia','Enterobacter cloacae complex, Klebsiella aerogenes, Citrobacter freundii (y probablemente Hafnia alvei)','E. coli y K. pneumoniae','Proteus mirabilis'],a:1,e:'Serratia, Morganella y Providencia tienen menos de 5% de AmpC relevante: se tratan según el antibiograma. Los acrónimos tipo SPACE o ESCPM sobresimplifican.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix16',t:'IDSA BLEE-AmpC',q:'Bacteriemia por Enterobacter cloacae sensible a ceftriaxona. ¿Qué riesgo tiene usar ceftriaxona?',o:['Ninguno','Aparición de resistencia durante el tratamiento en ~20% de los casos','Nefrotoxicidad','Más C. difficile solamente'],a:1,e:'Por eso se sugiere evitar cefotaxima, ceftriaxona y ceftazidima en infecciones invasivas por estas especies, aunque salgan sensibles.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix17',t:'IDSA BLEE-AmpC',q:'Enterobacter cloacae con CIM de cefepime de 4 mg/L (SDD), sin BLEE identificada. ¿Qué indicas?',o:['Carbapenémico obligatorio','Cefepime (2 g c/8 h en infusión de 3 h): sigue siendo preferido con CIM ≤8','Ceftriaxona','Piperacilina-tazobactam'],a:1,e:'La guía no encontró asociación entre la CIM SDD de cefepime y la producción de BLEE.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix18',t:'IDSA BLEE-AmpC',q:'¿Por qué cefepime funciona bien contra AmpC?',o:['Porque inhibe la AmpC','Porque induce poco el gen ampC y forma complejos acil-enzima estables que resisten la hidrólisis','Porque es un carbapenémico','Porque tiene un inhibidor'],a:1,e:'Imipenem es un inductor potente, pero también estable. Aztreonam, cefalosporinas de 3ª generación y piperacilina-tazobactam inducen poco, pero son hidrolizados.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix19',t:'IDSA BLEE-AmpC',q:'¿Qué fármacos tienen resistencia intrínseca en Enterobacterales con AmpC cromosómica (aunque sea basal)?',o:['Carbapenémicos','Ampicilina, amoxicilina-clavulánico, ampicilina-sulbactam, cefalosporinas de 1ª generación y cefamicinas','Quinolonas','Aminoglucósidos'],a:1,e:'Estos fármacos son inductores potentes y además se hidrolizan con AmpC basal.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix20',t:'IDSA BLEE-AmpC',q:'Infección invasiva por Citrobacter freundii. ¿Qué betalactámico NO se sugiere?',o:['Cefepime','Meropenem','Piperacilina-tazobactam','Ertapenem'],a:2,e:'El tazobactam protege mal frente a AmpC. Ceftolozano-tazobactam tampoco se sugiere para AmpC.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix21',t:'IDSA BLEE-AmpC',q:'Cistitis por Enterobacter cloacae. ¿Qué es preferido?',o:['Gepotidacina','Nitrofurantoína o TMP-SMX','Fosfomicina','Ceftriaxona'],a:1,e:'Para gepotidacina hay pocos datos y CIM elevadas en AmpC-E, por lo que no se sugiere sin antibiograma.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix22',t:'IDSA BLEE-AmpC',q:'¿Qué dice la guía sobre los betalactámicos nuevos (ceftazidima-avibactam, meropenem-vaborbactam, cefiderocol) para BLEE o AmpC?',o:['Son de elección','Son activos, pero se reservan para microorganismos resistentes a carbapenémicos','Son inactivos','Solo para cistitis'],a:1,e:'Excepción razonable: infección polimicrobiana con Pseudomonas DTR y un BLEE, donde ceftolozano-tazobactam cubre ambos.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix23',t:'IDSA CRE',q:'Morganella morganii resistente a imipenem pero sensible a meropenem y ertapenem. ¿Es CRE?',o:['Sí','No: en Morganella, Proteus y Providencia se requiere resistencia a un carbapenémico distinto del imipenem','Sí, si la CIM es >2','Depende del sitio'],a:1,e:'Tienen menor afinidad natural de sus PBP por imipenem.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix24',t:'IDSA CRE',q:'Cistitis por CRE. ¿Qué opciones son preferidas?',o:['Ceftazidima-avibactam o meropenem-vaborbactam','Aminoglucósido en dosis única, ciprofloxacino, levofloxacino, nitrofurantoína o TMP-SMX (si son sensibles)','Colistina siempre','Tigeciclina'],a:1,e:'Los agentes IV nuevos se reservan para infecciones invasivas. En EE. UU. la sensibilidad a amikacina es ~59%, a quinolonas y TMP-SMX <20%, y a nitrofurantoína ~30%.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix25',t:'IDSA CRE',q:'¿Por qué la colistina, y no la polimixina B, puede servir en cistitis?',o:['Por su menor toxicidad','Porque el colistimetato se convierte a colistina activa en la orina; la polimixina B se elimina por vías no renales','Porque es oral','Porque tiene punto de corte S'],a:1,e:'Aun así es solo alternativa: nefrotoxicidad de ~30% incluso en tratamientos cortos.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix26',t:'IDSA CRE',q:'¿En qué CRE no conviene usar pivmecilinam?',o:['NDM','OXA-48','KPC: la sensibilidad es de 0% porque KPC hidroliza mecilinam','Carbapenem-resistente sin carbapenemasa'],a:2,e:'En NDM la sensibilidad fue ~71% y en OXA-48 ~84%. Usarlo solo si es poco probable que sea KPC.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix27',t:'IDSA CRE',q:'Bacteriemia por K. pneumoniae resistente a ertapenem (CIM 2) pero sensible a meropenem (CIM 0,5), sin carbapenemasa. ¿Qué indicas?',o:['Ceftazidima-avibactam','Meropenem o imipenem en infusión extendida','Colistina','Ertapenem en dosis alta'],a:1,e:'Menos de 3% de estos aislados tiene carbapenemasa. El mecanismo habitual es BLEE o AmpC con pérdida de porinas. Requiere vigilancia clínica.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix28',t:'IDSA CRE',q:'CRE sin carbapenemasa y resistente a todos los carbapenémicos. ¿Qué es preferido?',o:['Tigeciclina','Aztreonam-avibactam, ceftazidima-avibactam, imipenem-relebactam o meropenem-vaborbactam según antibiograma','Polimixina B sola','Meropenem en dosis alta'],a:1,e:'Hay una preferencia leve por ceftazidima-avibactam e imipenem-relebactam, que inhiben mejor in vitro en este contexto. Cefiderocol es alternativa (sin inhibidor acompañante).',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix29',t:'IDSA CRE',q:'Infección invasiva por KPC. ¿Qué orden de preferencia sugiere la guía entre los 3 preferidos?',o:['Imipenem-relebactam > ceftazidima-avibactam > meropenem-vaborbactam','Meropenem-vaborbactam > ceftazidima-avibactam > imipenem-relebactam','Todos iguales, sin preferencia','Ceftazidima-avibactam siempre primero'],a:1,e:'Se basa en datos observacionales con mejores resultados numéricos y menos resistencia con meropenem-vaborbactam.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix30',t:'IDSA CRE',q:'¿Con qué frecuencia aparece resistencia durante el tratamiento de KPC con ceftazidima-avibactam?',o:['<1%','~10%, vs <3% con meropenem-vaborbactam o imipenem-relebactam','50%','No se ha descrito'],a:1,e:'El mecanismo principal son sustituciones en el lazo Ω de KPC, que a veces restauran la sensibilidad a carbapenémicos in vitro.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix31',t:'IDSA CRE',q:'¿Cómo se dosifica el aztreonam-avibactam?',o:['2 g c/8 h en 30 min','Carga 2,67 g (2 g/0,67 g) en 3 h y luego 2 g (1,5 g/0,5 g) c/6 h en 3 h','1 g c/12 h','4 g c/24 h'],a:1,e:'Preferido para NDM, junto con cefiderocol. La formulación fija 3:1 asegura exposición simultánea de ambos componentes.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix32',t:'IDSA CRE',q:'NDM-E sin aztreonam-avibactam disponible. ¿Cómo se administra la alternativa?',o:['Ceftazidima-avibactam en la mañana y aztreonam en la noche','Ceftazidima-avibactam 2,5 g c/8 h + aztreonam 2 g c/8 h, ambos en 3 h, juntos por vía Y','Aztreonam solo','Ceftazidima-avibactam sola'],a:1,e:'Con dosis altas de aztreonam (8 g/día) se describieron elevaciones de transaminasas.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix33',t:'IDSA CRE',q:'E. coli productora de NDM resistente a aztreonam-avibactam y a cefiderocol. ¿Qué mecanismo es probable?',o:['Pérdida de OprD','Inserciones de 4 aminoácidos en PBP3 (YRIN, YRIK) junto con AmpC tipo CMY','KPC','mcr-1'],a:1,e:'En EE. UU. ya se ven en ~30% de las E. coli NDM de algunas regiones. En ese escenario se consideran combinaciones con fosfomicina IV, polimixina B o tigeciclina.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix34',t:'IDSA CRE',q:'Infección invasiva por OXA-48. ¿Qué fármacos NO se sugieren aunque salgan sensibles?',o:['Ceftazidima-avibactam','Meropenem-vaborbactam e imipenem-relebactam','Cefiderocol','Aztreonam-avibactam'],a:1,e:'Vaborbactam y relebactam inhiben poco a OXA-48. Ceftazidima-avibactam es el preferido.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix35',t:'IDSA CRE',q:'¿En qué infecciones por CRE pueden usarse tigeciclina o eravaciclina?',o:['Bacteriemia y pielonefritis','Infecciones intraabdominales, de piel, osteomielitis o neumonía, cuando no hay betalactámico activo','Cistitis','Meningitis'],a:1,e:'Se distribuyen rápido a los tejidos y dejan concentraciones séricas y urinarias bajas. Con CIM de tigeciclina ≥0,5 los resultados son peores. Náuseas: 20–25% con tigeciclina vs ~5% con eravaciclina.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix36',t:'IDSA CRE',q:'¿Qué dosis de tigeciclina sugiere la guía?',o:['50 mg c/12 h','Carga de 200 mg IV y luego 100 mg c/12 h','100 mg c/24 h','200 mg c/12 h'],a:1,e:'Es la llamada "dosis alta", con mejores resultados que la estándar (100 mg y luego 50 mg c/12 h).',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix37',t:'IDSA CRE',q:'KPC sensible a ceftazidima-avibactam. ¿Agregas un aminoglucósido o colistina?',o:['Sí, siempre','No de rutina: la combinación no mejoró la sobrevida (74% vs 75%) y aumenta toxicidad','Solo colistina','Solo en cistitis'],a:1,e:'Tampoco hay datos de que la combinación prevenga resistencia.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix38',t:'IDSA CRE',q:'¿Qué proporción de las CRE produce carbapenemasa en EE. UU.?',o:['<5%','35–83%','100%','Ninguna'],a:1,e:'NDM aumentó mucho desde 2021, y OXA-48 en menor grado. Identificar la enzima cambia el tratamiento.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix39',t:'IDSA Pseudomonas-CRAB-Steno',q:'¿Cómo define la guía a P. aeruginosa DTR?',o:['Resistente a 3 familias','No sensible a aztreonam, cefepime, ceftazidima, ciprofloxacino, imipenem, levofloxacino, meropenem y piperacilina-tazobactam','Resistente a colistina','Productora de carbapenemasa'],a:1,e:'MDR es no sensible a al menos 1 antibiótico en 3 o más familias.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix40',t:'IDSA Pseudomonas-CRAB-Steno',q:'P. aeruginosa sensible a cefepime y a meropenem. ¿Qué prefieres?',o:['Meropenem','Cefepime u otro betalactámico tradicional no carbapenémico','Ceftolozano-tazobactam','Colistina'],a:1,e:'El uso de carbapenémicos se asoció a más resistencia durante el tratamiento sin mejores resultados. Así se preservan los carbapenémicos.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix41',t:'IDSA Pseudomonas-CRAB-Steno',q:'P. aeruginosa resistente a meropenem pero sensible a cefepime (pérdida de OprD). ¿Qué esquema prefiere la guía?',o:['Ceftazidima-avibactam siempre','Cefepime 2 g c/8 h en infusión de 3 h o más','Meropenem en dosis alta','Amikacina sola'],a:1,e:'En pacientes críticos o con foco no controlado también es razonable usar un betalactámico nuevo.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix42',t:'IDSA Pseudomonas-CRAB-Steno',q:'En bacteriemias por P. aeruginosa, ¿con qué antibiótico apareció más resistencia en 30 días?',o:['Piperacilina-tazobactam (8%)','Imipenem (27%)','Ceftazidima (12%)','Meropenem (15%)'],a:1,e:'Por eso se recomienda repetir el antibiograma en aislados posteriores.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix43',t:'IDSA Pseudomonas-CRAB-Steno',q:'Neumonía por P. aeruginosa DTR. ¿Qué agente prefiere la guía?',o:['Cefiderocol','Ceftolozano-tazobactam','Imipenem-relebactam','Colistina'],a:1,e:'Ceftolozano llega al ELF a ~50% de la concentración plasmática y supera 4 mg/L todo el intervalo; ceftazidima-avibactam llega a ~30%. Cefiderocol es alternativa fuera de la vía urinaria.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix44',t:'IDSA Pseudomonas-CRAB-Steno',q:'¿Qué dosis de ceftolozano-tazobactam sugiere la guía fuera de la cistitis?',o:['1,5 g c/8 h en 1 h','3 g (2 g/1 g) c/8 h en infusión de 3 h','3 g c/12 h','1 g c/8 h'],a:1,e:'Para cistitis: 1,5 g c/8 h en 1 h.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix45',t:'IDSA Pseudomonas-CRAB-Steno',q:'ITU complicada por P. aeruginosa DTR. ¿Qué opciones son preferidas?',o:['Solo colistina','Cefiderocol, ceftazidima-avibactam, ceftolozano-tazobactam o imipenem-relebactam (sin orden de preferencia)','Fosfomicina oral','Plazomicina'],a:1,e:'Amikacina o tobramicina una vez al día son alternativas. La plazomicina no supera a amikacina contra Pseudomonas. Conviene reservar cefiderocol por su actividad contra MBL.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix46',t:'IDSA Pseudomonas-CRAB-Steno',q:'P. aeruginosa productora de KPC. ¿Qué fármaco NO se sugiere?',o:['Cefiderocol','Ceftazidima-avibactam','Ceftolozano-tazobactam','Imipenem-relebactam'],a:2,e:'El tazobactam no inhibe KPC. Entre los demás se elige por antibiograma: en un estudio, 48% era resistente a ceftazidima-avibactam y 75% a imipenem-relebactam.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix47',t:'IDSA Pseudomonas-CRAB-Steno',q:'P. aeruginosa productora de VIM. ¿Qué es preferido?',o:['Aztreonam-avibactam','Cefiderocol','Ceftolozano-tazobactam','Imipenem-relebactam'],a:1,e:'Aztreonam-avibactam tiene actividad limitada en P. aeruginosa con MBL (eflujo, sin puntos de corte). Ceftazidima-avibactam + aztreonam queda solo si hay resistencia a cefiderocol.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix48',t:'IDSA Pseudomonas-CRAB-Steno',q:'¿Por qué en Latinoamérica es más importante identificar carbapenemasas en P. aeruginosa que en EE. UU.?',o:['No es más importante','Porque cerca de 69% de las P. aeruginosa resistentes a carbapenémicos de la región tiene carbapenemasa (vs pocas en EE. UU.)','Por menos uso de antibióticos','Por la vacuna'],a:1,e:'Asia ~57% y sur de Europa ~50%. Resistencia simultánea a ceftazidima-avibactam, ceftolozano-tazobactam e imipenem-relebactam debe hacer sospechar MBL.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix49',t:'IDSA Pseudomonas-CRAB-Steno',q:'¿Con qué frecuencia aparece resistencia a los betalactámicos nuevos durante el tratamiento de P. aeruginosa DTR?',o:['<2%','~20%','60%','Nunca'],a:1,e:'Además, la CIM de cefiderocol sube en ~15% de los aislados expuestos a ceftazidima-avibactam o ceftolozano-tazobactam. Repetir el antibiograma.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix50',t:'IDSA Pseudomonas-CRAB-Steno',q:'P. aeruginosa sin ningún betalactámico activo. ¿Qué se sugiere?',o:['Amikacina en monoterapia','Tobramicina (si es sensible) + el betalactámico nuevo con la CIM más cercana al punto de corte','Colistina inhalada sola','Suspender antibióticos'],a:1,e:'Si no hay sensibilidad a tobramicina: polimixina B, preferida sobre colistina fuera de la vía urinaria. El aminoglucósido en monoterapia no se sugiere fuera de la vía urinaria.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix51',t:'IDSA Pseudomonas-CRAB-Steno',q:'¿Se sugieren los antibióticos nebulizados como adyuvantes en neumonía por P. aeruginosa DTR o CRAB?',o:['Sí, siempre','No de rutina: 3 ensayos (colistina, amikacina con fosfomicina, amikacina) no mejoraron la sobrevida','Solo colistina','Solo en pediatría'],a:1,e:'Su uso selectivo es razonable si no hay betalactámico activo y la respuesta es mala. Riesgo de broncoespasmo.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix52',t:'IDSA Pseudomonas-CRAB-Steno',q:'¿Qué mecanismos explican la gran resistencia de A. baumannii?',o:['Solo KPC','Cefalosporinasas propias (ADC), carbapenemasas OXA (OXA-23, 24/40, 58), pérdida de porinas (CarO, OmpA), bombas AdeABC y AdeIJK, y metiltransferasas 16S','Solo mcr-1','Solo bombas de eflujo'],a:1,e:'Además es difícil distinguir colonización de infección, sobre todo en ventilados y quemados.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix53',t:'IDSA Pseudomonas-CRAB-Steno',q:'Infección invasiva por CRAB. ¿Cuál es el tratamiento preferido y su dosis?',o:['Colistina + meropenem','Sulbactam-durlobactam 2 g (1 g/1 g) c/6 h en 3 h + imipenem o meropenem','Tigeciclina sola','Cefiderocol solo'],a:1,e:'Con ClCr ≥130: c/4 h. En el ensayo ATTACK la sobrevida a 28 días fue de 81% vs 68% con colistina + imipenem. El carbapenémico acompañante se une a PBP2 y complementa.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix54',t:'IDSA Pseudomonas-CRAB-Steno',q:'¿Qué no inhibe el durlobactam?',o:['Enzimas de clase A','Enzimas de clase C (ADC)','OXA de clase D','Metalo-betalactamasas de clase B (NDM)'],a:3,e:'Si el CRAB tiene NDM o resistencia a sulbactam-durlobactam (CIM ≥16/4), se prefieren esquemas sin sulbactam (cefiderocol, minociclina, polimixina B o tigeciclina en combinación).',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix55',t:'IDSA Pseudomonas-CRAB-Steno',q:'Sin sulbactam-durlobactam disponible, ¿cómo se usa ampicilina-sulbactam como puente para CRAB?',o:['3 g c/6 h en 30 min, solo','Dosis alta: 9 g/día de sulbactam (por ejemplo, 27 g/día de ampicilina-sulbactam en infusión) + un segundo agente activo','1,5 g c/12 h','Solo inhalada'],a:1,e:'Solo ~10% de los CRAB es sensible a sulbactam. Una CIM de ampicilina-sulbactam de 8/4 corresponde a una CIM de sulbactam de 4.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix56',t:'IDSA Pseudomonas-CRAB-Steno',q:'¿Qué lugar tiene el cefiderocol en CRAB?',o:['Preferido en monoterapia','Alternativa, siempre en combinación, si hay resistencia a sulbactam-durlobactam o como puente','No tiene actividad','Preferido en neumonía'],a:1,e:'En CREDIBLE-CR la sobrevida a 28 días fue de 51% con cefiderocol vs 82% en CRAB. Los CRAB productores de NDM son sensibles solo en ~60%.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix57',t:'IDSA Pseudomonas-CRAB-Steno',q:'Si se usa una tetraciclina en CRAB, ¿cuál prefiere la guía y en qué dosis?',o:['Tigeciclina 50 mg c/12 h','Minociclina 200 mg IV o VO c/12 h, en combinación','Omadaciclina','Doxiciclina'],a:1,e:'La minociclina tiene punto de corte CLSI (≤1 mg/L desde 2025) y más de 50% de sensibilidad. La tigeciclina no tiene punto de corte para A. baumannii.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix58',t:'IDSA Pseudomonas-CRAB-Steno',q:'¿Qué problemas tiene la polimixina B en CRAB?',o:['Ninguno','Concentraciones séricas variables, mala actividad pulmonar y ventana terapéutica estrecha (~2 mg/L para efecto, umbral de nefrotoxicidad similar)','Es oral','Tiene excelente penetración pulmonar'],a:1,e:'Solo alternativa en combinación. No existe categoría S: con CIM ≤2 es intermedio.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix59',t:'IDSA Pseudomonas-CRAB-Steno',q:'¿Por qué S. maltophilia es resistente a carbapenémicos y aminoglucósidos?',o:['Por KPC','Por la metalo-betalactamasa L1, la cefalosporinasa L2 y acetiltransferasas de aminoglucósidos cromosómicas','Por mcr-1','Por pérdida de OprD'],a:1,e:'Además, sus bombas de eflujo Sme y el gen Smqnr elevan las CIM de TMP-SMX, tetraciclinas y quinolonas.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix60',t:'IDSA Pseudomonas-CRAB-Steno',q:'Bacteriemia por S. maltophilia en un paciente neutropénico. ¿Qué es preferido?',o:['TMP-SMX en monoterapia','Cefiderocol en monoterapia','Ceftazidima','Levofloxacino solo'],a:1,e:'Sensibilidad cercana al 100% y actividad bactericida en modelos animales. La preferencia se basa sobre todo en datos preclínicos.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix61',t:'IDSA Pseudomonas-CRAB-Steno',q:'¿Qué papel tienen TMP-SMX, levofloxacino y minociclina en S. maltophilia invasiva?',o:['Monoterapia preferida','Alternativas solo como parte de una combinación; pasar a monoterapia solo tras mejoría clínica clara y sostenida','No sirven','Solo en cistitis'],a:1,e:'TMP-SMX es, como mucho, bacteriostático. Con levofloxacino aparece resistencia en ~20% durante el tratamiento. Minociclina tiene el mejor respaldo PK/PD entre las tetraciclinas.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix62',t:'IDSA Pseudomonas-CRAB-Steno',q:'¿Por qué el aztreonam-avibactam sirve contra S. maltophilia?',o:['El avibactam inhibe la L1','La L1 no hidroliza aztreonam, y el avibactam inhibe la L2 que sí lo hidroliza','El aztreonam inhibe la L2','No sirve'],a:1,e:'Es una alternativa, preferentemente combinada con un segundo agente.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}
,{id:'ix63',t:'IDSA Pseudomonas-CRAB-Steno',q:'¿Se sugiere ceftazidima para S. maltophilia?',o:['Sí, si es sensible','No: L1 y L2 la inactivan, y desde 2024 no tiene punto de corte','Solo con amikacina','Solo en neumonía'],a:1,e:'Tampoco se sugieren eravaciclina u omadaciclina. Entre las tetraciclinas se prefiere minociclina.',r:'IDSA AMR Guidance 2026 (Tamma PD, Clin Infect Dis 2026)'}

{id:'c2',title:'Urosepsis BLEE',tag:'Gramnegativos',intro:'Mujer de 74 años con pielonefritis y shock séptico inicial. Recibió ceftriaxona. Al día 2, hemocultivos y urocultivo muestran E. coli BLEE, sensible a meropenem, ertapenem, amikacina y ciprofloxacino.',vit:['PA 98/55 (sin DVA)','FC 96','Afebril 24 h','Crea 1,3','ClCr ~40'],steps:[

 {q:'¿Duración total del tratamiento?',o:['3 días','7 días','21 días','Hasta urocultivo negativo'],a:1,e:'7 días son suficientes en bacteremia por gramnegativo con buena respuesta y foco controlado. No se pide urocultivo de control si está asintomática.'}

{id:'c3',title:'AUC fuera de rango',tag:'TDM',intro:'Hombre de 66 años, 80 kg, en vancomicina 1.500 mg c/12 h por bacteremia por SAMR. Al día 3, con dos niveles, el AUC24 calculado es 720 mg·h/L. La creatinina subió de 0,9 a 1,3 mg/dL.',vit:['AUC24 720','CIM 1','Crea 1,3','Diuresis conservada'],steps:[

{id:'c4',title:'Fiebre sin neutrófilos',tag:'Neutropenia febril',intro:'Mujer de 45 años con LMA en quimioterapia de inducción. Recuento absoluto de neutrófilos 200/mm³. Fiebre de 38,6 °C. Hemodinámicamente estable, sin foco evidente, CVC sin signos inflamatorios.',vit:['PA 118/70','FC 104','T° 38,6','RAN 200','Crea 0,7'],steps:[

{id:'c5',title:'Diarrea post-antibiótico',tag:'C. difficile',intro:'Mujer de 72 años, hospitalizada, en ceftriaxona por NAC hace 6 días. Inicia 6 deposiciones líquidas al día. Test de C. difficile positivo (GDH + toxina).',vit:['Leucocitos 18.000','Crea 1,1','T° 37,8','Sin íleo'],steps:[

,{id:'c6',title:'KPC en la UCI',tag:'Carbapenemasas',intro:'Hombre de 60 años en ventilación mecánica por 8 días. Neumonía asociada a ventilador. Cultivo de aspirado: Klebsiella pneumoniae resistente a meropenem. La inmunocromatografía detecta KPC.',vit:['PAM 70 con noradrenalina baja','FiO2 50%','Crea 1,0','ClCr ~85'],steps:[

]}
,{id:'c7',title:'Nivel indetectable',tag:'TDM betalactámicos',intro:'Mujer de 28 años con TEC grave en UCI. Neumonía por Pseudomonas aeruginosa con CIM de meropenem 2 mg/L. Recibe meropenem 1 g c/8 h en 30 minutos. Al día 3 persiste febril. El nivel valle de meropenem es indetectable.',vit:['ClCr medido 190','Crea 0,4','Albúmina 2,6','Peso 62 kg'],steps:[

 {q:'¿Qué ajuste propones?',o:['Agregar amikacina y mantener meropenem igual','Subir a 2 g c/8 h en infusión extendida de 3 h (o infusión continua) y repetir el nivel','Cambiar a ertapenem','Reducir la dosis'],a:1,e:'Aumentar dosis y tiempo de infusión mejora %fT>CIM. Luego se confirma con TDM a las 24–48 h.'},

,{id:'c10',title:'Debut con CD4 bajo',tag:'TARV',intro:'Hombre de 32 años con diagnóstico reciente de VIH. CD4 80 células/µL, carga viral 450.000 copias/mL. HBsAg positivo. IgG de Toxoplasma positiva. Sin síntomas neurológicos. Genotipo basal en curso.',vit:['CD4 80','CV 450.000','HBsAg +','Crea 0,9'],steps:[

 {q:'¿Qué profilaxis de infecciones oportunistas indicas?',o:['Ninguna','TMP-SMX forte diario (cubre Pneumocystis y Toxoplasma)','Azitromicina semanal para MAC','Fluconazol diario'],a:1,e:'CD4 <200 → Pneumocystis; CD4 <100 con IgG de Toxoplasma + → Toxoplasma. El forte diario cubre ambos. La profilaxis de MAC no se recomienda si el TARV inicia de inmediato.'},

]}

]}

 {q:'¿Cumple criterios de enfermedad pulmonar por MNT?',o:['No, necesita biopsia','Sí: síntomas, imagen compatible y ≥2 expectoraciones positivas para la misma especie','No, un cultivo bastaba y ya pasó','Solo si el IGRA es positivo'],a:1,e:'Cumple los criterios clínicos, radiológicos y microbiológicos. La decisión de tratar considera la progresión y las preferencias de la paciente.'},
 {q:'¿Qué esquema eliges?',o:['Azitromicina 500 mg + rifampicina 600 mg + etambutol 25 mg/kg, 3 veces por semana','Azitromicina sola','HRZE diario','Amikacina IV sola por 3 meses'],a:0,e:'Forma nodular-bronquiectásica no cavitaria: el esquema intermitente es igual de eficaz y mejor tolerado.'},
 {q:'¿Qué monitorizas durante el tratamiento?',o:['Nada','Agudeza visual y colores (etambutol), audiometría (macrólido), ECG por QT, función hepática, y cultivos mensuales','Solo la PCR','Niveles de rifampicina'],a:1,e:'Con ClCr ~50, vigilar el etambutol. Además, rifampicina reduce los niveles de claritromicina, una razón más para preferir azitromicina.'},
 {q:'Los cultivos se negativizan al mes 4. ¿Hasta cuándo tratas?',o:['Hasta el mes 6','Hasta 12 meses después de la conversión (mes 16 aproximadamente)','Suspendes ya','2 años desde el inicio sin importar el cultivo'],a:1,e:'La duración se cuenta desde la conversión del cultivo.'}
]}
,{id:'c13',title:'Rifampicina resistente',tag:'TB-RR',intro:'Mujer de 34 años, 55 kg, con TB pulmonar. Xpert MTB/RIF: rifampicina resistente. Xpert MTB/XDR: fluoroquinolonas sensibles. VIH negativo, no embarazada. QTcF basal 420 ms.',vit:['Peso 55 kg','QTcF 420','Hb 12,8','Plaq 240.000'],steps:[
 {q:'¿Qué esquema recomienda la OMS?',o:['HRZE con dosis altas de rifampicina','BPaLM por 6 meses','Esquema largo con kanamicina','Levofloxacino + etambutol'],a:1,e:'Bedaquilina, pretomanid, linezolid 600 mg y moxifloxacino. Si hubiera resistencia a fluoroquinolonas, BPaL.'},
 {q:'¿Qué controles necesitas en este esquema?',o:['Solo baciloscopia','ECG (QT), hemograma, examen neurológico y visual, transaminasas, y cultivo mensual','Audiometría semanal','Solo IGRA'],a:1,e:'QT por bedaquilina y moxifloxacino; mielosupresión y neuropatía por linezolid; hepatotoxicidad por bedaquilina y pretomanid.'},
 {q:'En la semana 10 aparece neuropatía periférica leve y hemoglobina de 9,5. ¿Qué haces?',o:['Suspender todo el esquema','Reducir o suspender temporalmente el linezolid según la gravedad, manteniendo el resto','Duplicar la bedaquilina','Agregar isoniazida'],a:1,e:'Linezolid es el fármaco más tóxico de BPaLM. Las guías permiten reducirlo a 300 mg o suspenderlo si ya completó buena parte del tratamiento.'},
 {q:'¿Debe evitar algo de lo que toma?',o:['Paracetamol','Fármacos que prolongan QT (ondansetrón, azitromicina, citalopram) y serotoninérgicos (ISRS) con cautela','Omeprazol','Vitamina B6'],a:1,e:'Bedaquilina + moxifloxacino suman QT. Linezolid, como IMAO débil, se combina con cautela con ISRS.'}
]}

,{id:'c14',title:'Shock en TRRC',tag:'Paciente crítico',intro:'Hombre de 55 años, 90 kg, con shock séptico por neumonía nosocomial. Recibió 4 L de cristaloides. Lesión renal aguda anúrica; inicia TRRC con efluente de 30 mL/kg/h. Albúmina 2,2 g/dL. Aspirado traqueal con bacilos gramnegativos.',vit:['Noradrenalina 0,3','Anúrico','TRRC 30 mL/kg/h','Albúmina 2,2'],steps:[
 {q:'Inicias meropenem. ¿Cómo dosificas las primeras 24–48 h?',o:['500 mg c/24 h por anuria','Carga completa y luego 1–2 g c/8 h en infusión extendida','250 mg c/12 h','Esperar a que mejore la función renal'],a:1,e:'Vd aumentado por fluidos y TRRC que remueve el fármaco: el riesgo inicial es la subexposición, no la toxicidad.'},
 {q:'También necesita vancomicina por riesgo de SAMR. ¿Dosis de carga?',o:['500 mg','25 mg/kg con peso real (≈2.250 mg)','1 g fijo','No se da carga en TRRC'],a:1,e:'La carga depende del Vd y no se ajusta por función renal. Luego se mantiene según niveles y la dosis de TRRC.'},
 {q:'Al día 3 la TRRC se suspende varias horas por coagulación del filtro. ¿Qué implica?',o:['Nada','El clearance cae: riesgo de acumulación. Ajustar y medir niveles','Hay que duplicar la dosis','Cambiar a ertapenem'],a:1,e:'La dosis efectivamente entregada de TRRC cambia el clearance día a día. Aquí el TDM es la herramienta más útil.'},
 {q:'Cultivo: Pseudomonas sensible a cefepime (CIM 4). ¿Qué haces?',o:['Seguir con meropenem y vancomicina','Desescalar a cefepime en dosis altas por infusión extendida y suspender vancomicina','Agregar amikacina','Agregar colistina'],a:1,e:'Desescalar es seguro y reduce la presión sobre carbapenémicos. Con CIM 4, conviene infusión extendida y TDM; vigilar neurotoxicidad si cambia la función renal.'}
]}
,{id:'c15',title:'Día +45 post TPH',tag:'Trasplante hematopoyético',intro:'Mujer de 40 años, TPH alogénico de donante no relacionado por LMA. CMV receptor positivo. Injerto el día +18. Recibe tacrolimus, letermovir, aciclovir, fluconazol y TMP-SMX. Día +45: diarrea y rash; biopsia confirma EICH gastrointestinal grado III. Inicia metilprednisolona 2 mg/kg.',vit:['Día +45','Tacrolimus 8 ng/mL','Neutrófilos 2.800','Crea 0,9'],steps:[
 {q:'¿Qué cambio de profilaxis antifúngica corresponde?',o:['Mantener fluconazol','Cambiar a posaconazol (cobertura de mohos)','Suspender antifúngicos','Cambiar a nistatina'],a:1,e:'EICH con corticoides en dosis altas es la indicación clásica de posaconazol.'},
 {q:'¿Qué haces con el tacrolimus al iniciar posaconazol?',o:['Nada','Reducir la dosis a ~1/3 y medir niveles en 3–5 días','Duplicarlo','Cambiar a sirolimus'],a:1,e:'Posaconazol inhibe fuertemente el CYP3A4. Sin ajuste, el tacrolimus puede llegar a niveles tóxicos (nefrotoxicidad, neurotoxicidad, PRES).'},
 {q:'¿Qué haces con el letermovir?',o:['Suspenderlo al día +45','Mantenerlo y considerar extenderlo hasta el día +200 por alto riesgo (EICH con corticoides)','Cambiar a valganciclovir profiláctico','Duplicar la dosis'],a:1,e:'La EICH tratada con corticoides es un factor de alto riesgo para CMV tardío.'},
 {q:'Día +120: sigue con EICH crónica. ¿Qué otra profilaxis agregas?',o:['Ninguna','Profilaxis contra encapsulados (por ejemplo, penicilina o amoxicilina) y revisar IgG','Levofloxacino','Ganciclovir'],a:1,e:'La EICH crónica produce asplenia funcional. Aciclovir y TMP-SMX se mantienen mientras dure la inmunosupresión.'}
]}

,{id:'c16',title:'Flebitis con S. aureus',tag:'IV a oral',intro:'Hombre de 58 años, diabético sin daño de órgano blanco. Bacteriemia por SAMS asociada a un catéter venoso periférico, retirado el día 1. Inició cefazolina el día 1. Hemocultivos de control a las 48 h negativos. Afebril desde el día 2. Ecocardiograma transtorácico sin vegetaciones. Hoy cumple el día 6. Sin prótesis ni dispositivos.',vit:['Día 6 de cefazolina','Afebril 4 días','HC control (−)','Crea 0,9'],steps:[
 {q:'¿Cumple criterios de bajo riesgo como en SABATO?',o:['No, toda bacteriemia por S. aureus es de alto riesgo','Sí: foco removible retirado, hemocultivos de control negativos, sin fiebre persistente, sin foco profundo ni prótesis','No, porque es diabético','Solo si tiene ecocardiograma transesofágico'],a:1,e:'La diabetes sin compromiso grave no excluía. Lo clave es el foco removido, la negativización precoz y la ausencia de signos de complicación.'},
 {q:'Decides pasar a oral. ¿Qué esquema replica SABATO?',o:['Amoxicilina 500 mg c/8 h','TMP-SMX 160/800 mg c/12 h hasta completar 14 días totales','Ciprofloxacino solo','Cefadroxilo 500 mg c/12 h por 6 semanas'],a:1,e:'Alternativa en SAMS: clindamicina 600 mg c/8 h (si sensible, con D-test negativo). Duración total de 14 días.'},
 {q:'¿Qué controles indicas con TMP-SMX?',o:['Ninguno','Potasio y creatinina (hiperkalemia, alza de creatinina), hemograma y rash','Niveles de TMP-SMX','Audiometría'],a:1,e:'Ojo con IECA o ARA-II y espironolactona. La creatinina puede subir sin caída de filtración por bloqueo de la secreción tubular.'},
 {q:'Al día 10 consulta con fiebre y dolor lumbar. ¿Qué haces?',o:['Seguir igual','Reevaluar complicación: hemocultivos, imagen de columna (espondilodiscitis o absceso epidural) y volver a IV','Agregar rifampicina','Suspender antibióticos'],a:1,e:'En SABATO las muertes atribuibles a S. aureus ocurrieron en pacientes que desarrollaron infección diseminada. El paso a oral exige seguimiento estrecho.'}
]}

,{id:'c17',title:'Pielonefritis BLEE',tag:'Resistencia BGN',intro:'Mujer de 52 años con pielonefritis y bacteriemia. Volvió hace 2 semanas de un viaje a India. Recibió ceftriaxona. A las 36 h, el panel molecular del hemocultivo detecta E. coli con CTX-M. Está febril pero sin vasopresores.',vit:['T° 38,4','PA 110/70','Crea 0,8','Viaje a India'],steps:[
 {q:'¿Qué significa CTX-M y qué haces con la ceftriaxona?',o:['Es una carbapenemasa; pasar a colistina','Es una BLEE: cambiar a carbapenémico (meropenem o ertapenem)','Es AmpC; seguir con ceftriaxona','Es penicilinasa; seguir igual'],a:1,e:'CTX-M es la BLEE más frecuente. Para infección invasiva, la revisión prefiere carbapenémico (MERINO).'},
 {q:'¿Por qué el antecedente de viaje a India es relevante?',o:['No es relevante','Alto riesgo de colonización por BLEE (hasta 70%) y mayor prevalencia de NDM en el sur de Asia','Por riesgo de malaria solamente','Por la vacuna'],a:1,e:'Si fallara el carbapenémico o el antibiograma mostrara resistencia, hay que pensar en NDM y pedir la prueba de carbapenemasas.'},
 {q:'Al día 4 está afebril y estable. Antibiograma: sensible a ciprofloxacino y TMP-SMX. ¿Qué haces?',o:['Completar 14 días de meropenem IV','Paso a vía oral (ciprofloxacino o TMP-SMX) para completar 7 días totales','Nitrofurantoína','Cefepime-enmetazobactam por 14 días'],a:1,e:'La revisión respalda el paso a quinolona o TMP-SMX una vez estable. La resistencia no alarga la duración.'}
]}
,{id:'c18',title:'Klebsiella sin respuesta',tag:'Resistencia BGN',intro:'Hombre de 70 años en UCI con bacteriemia por K. pneumoniae resistente a meropenem. Test inmunocromatográfico de carbapenemasas: NDM positivo. KPC, OXA-48, VIM e IMP negativos. ClCr 60 mL/min.',vit:['ClCr 60','Noradrenalina baja','NDM +','KPC −'],steps:[
 {q:'¿Qué tratamiento eliges según la revisión?',o:['Ceftazidima-avibactam sola','Aztreonam-avibactam (o, si no existe, ceftazidima-avibactam + aztreonam simultáneos)','Meropenem-vaborbactam','Imipenem-relebactam'],a:1,e:'Alternativas preferidas: cefepime-zidebactam o cefiderocol. Ningún inhibidor de serina-betalactamasas inhibe NDM.'},
 {q:'Si usas ceftazidima-avibactam + aztreonam, ¿cómo los administras?',o:['En días alternos','Ceftazidima-avibactam 2,5 g c/8 h y aztreonam 2 g c/8 h, ambos en 3 h y al mismo tiempo','Aztreonam primero y 8 h después ceftazidima-avibactam','Una sola dosis diaria'],a:1,e:'La administración simultánea asegura que avibactam proteja al aztreonam de las betalactamasas acompañantes.'},
 {q:'¿Es una buena opción la tigeciclina para esta bacteriemia?',o:['Sí, la mejor','No como agente principal: bajas concentraciones séricas','Sí, si se da en dosis estándar','Solo en monoterapia'],a:1,e:'Las tetraciclinas nuevas quedan como alternativa por su mala exposición sérica y urinaria.'},
 {q:'Al día 5 el paciente mejora y los hemocultivos son negativos desde el día 2. ¿Cuánto tratas?',o:['21 días por ser NDM','Duración habitual de una bacteriemia por gramnegativo con foco controlado (~7 días)','6 semanas','Indefinido'],a:1,e:'La resistencia no alarga la duración. Lo que define el tiempo es el foco, el control y la respuesta clínica.'}
]}

,{id:'c19',title:'NAV por Pseudomonas DTR',tag:'C/T vs CZA',intro:'Hombre de 66 años, 80 kg, día 9 de ventilación mecánica. Neumonía asociada a ventilador por P. aeruginosa DTR: resistente a piperacilina-tazobactam, cefepime, carbapenémicos y quinolonas. Sensible a ceftolozano-tazobactam (CIM 2) y ceftazidima-avibactam (CIM 4). Carbapenemasa negativa. ClCr 70 mL/min.',vit:['VM día 9','ClCr 70','C/T CIM 2','CZA CIM 4'],steps:[
 {q:'Con CACTUS y el metaanálisis de Li en mente, ¿qué prefieres?',o:['Colistina + meropenem','Ceftolozano-tazobactam','Amikacina sola','Tigeciclina'],a:1,e:'Ambos son de primera línea, pero en neumonía la evidencia observacional favorece ceftolozano-tazobactam por más éxito clínico y menos recurrencia.'},
 {q:'¿Qué dosis indicas?',o:['1,5 g c/8 h','3 g c/8 h (2 g/1 g) en infusión, idealmente extendida','1 g c/12 h','3 g c/24 h'],a:1,e:'En CACTUS, el 20% de los pacientes con ceftolozano-tazobactam recibió dosis subóptima, sobre todo 1,5 g en neumonía.'},
 {q:'¿Agregas amikacina inhalada o colistina IV?',o:['Sí, siempre','No de rutina: la combinación y los inhalados adyuvantes no mostraron beneficio en supervivencia','Solo colistina','Solo si hay fiebre'],a:1,e:'La monoterapia con un betalactámico activo es el estándar si el foco está controlado.'},
 {q:'Al día 8 reaparece fiebre y un nuevo aspirado crece P. aeruginosa. ¿Qué haces?',o:['Seguir igual','Pedir sensibilidad de nuevo: ~22% desarrolla resistencia durante el tratamiento','Duplicar la dosis sin cultivo','Suspender antibióticos'],a:1,e:'Si apareció resistencia a ceftolozano-tazobactam, revisar las otras opciones (ceftazidima-avibactam, imipenem-relebactam, cefiderocol) según el nuevo antibiograma.'}
]}

,{id:'c20',title:'Fiebre y próstata dolorosa',tag:'Prostatitis',intro:'Hombre de 65 años, diabético, con 4 días de fiebre, calofríos, disuria y dificultad para iniciar la micción. T° 38,7, PA 109/67, FC 121. Tacto rectal suave: próstata muy dolorosa. Leucocitos 16.500. Creatinina 1,54 mg/dL (su basal). Sedimento con 312 leucocitos/campo.',vit:['T° 38,7','FC 121','Crea 1,54','Diabético'],steps:[
 {q:'¿Qué tratamiento empírico indicas mientras esperas los cultivos?',o:['Nitrofurantoína','Ceftriaxona IV (o según riesgo de BLEE, carbapenémico)','Azitromicina','Amoxicilina oral'],a:1,e:'Sin manipulación urológica reciente ni uso previo de antibióticos, una cefalosporina de 3ª generación es razonable. Ajustar con el cultivo.'},
 {q:'Tiene dificultad para orinar y residuo alto. ¿Cómo drenas la vejiga?',o:['Masaje prostático','Sonda Coudé con cuidado o cistostomía suprapúbica, evitando la sonda Foley a ciegas','No drenar','Sonda Foley gruesa'],a:1,e:'Una sonda uretral forzada a través de una próstata inflamada puede causar daño.'},
 {q:'Urocultivo y hemocultivo: E. coli multisensible. Al día 3 está afebril y tolera vía oral. Tuvo una tendinitis de Aquiles. ¿Con qué completas?',o:['Ciprofloxacino','TMP-SMX 160/800 mg c/12 h','Nitrofurantoína','Cefuroxima'],a:1,e:'TMP-SMX penetra bien en la próstata y evita la quinolona por el antecedente de tendinopatía. Ajustar si cae la función renal.'},
 {q:'¿Cuánto tratas en total?',o:['7 días','14 días','6 semanas','3 meses'],a:1,e:'Prostatitis aguda: al menos 2 semanas. Si aparece un absceso o persisten los síntomas, reevaluar.'}
]}
,{id:'c21',title:'Cistitis que vuelve',tag:'Prostatitis',intro:'Hombre de 48 años con 3 episodios de cistitis por E. coli en 4 meses, cada uno tratado 7 días. Entre episodios refiere molestia pélvica vaga. Sedimento con 58 leucocitos/campo. Urocultivo previo al masaje: 10⁴ UFC/mL de E. coli; post masaje: 10⁵ UFC/mL. E. coli BLEE sensible a ciprofloxacino.',vit:['Afebril','PA normal','E. coli BLEE','Cipro S'],steps:[
 {q:'¿Qué diagnóstico sugiere el test de 2 vasos?',o:['Cistitis simple','Prostatitis bacteriana crónica: crecimiento 10 veces mayor después del masaje','Pielonefritis','Síndrome de dolor pélvico sin infección'],a:1,e:'Es positivo por el aumento de 10 veces en las UFC post masaje.'},
 {q:'¿Qué tratamiento indicas?',o:['Nitrofurantoína 7 días','Ciprofloxacino 500–750 mg c/12 h por 4–6 semanas','Ertapenem 14 días','Amoxicilina-clavulánico 6 semanas'],a:1,e:'La quinolona penetra bien la próstata y es la opción con más evidencia. Que sea BLEE no cambia la elección si es sensible.'},
 {q:'Si fuera resistente a quinolonas y a TMP-SMX, ¿qué opción oral considerarías?',o:['Nitrofurantoína','Fosfomicina 3 g cada 24–48 h por varias semanas','Cefalexina','Azitromicina'],a:1,e:'Hay series con ~80% de curación microbiológica.'},
 {q:'Recae después de un segundo curso adecuado y tiene hipertrofia prostática con retención. ¿Qué evaluar?',o:['Seguir con antibióticos de por vida','Derivar a urología: la RTU de próstata puede ser una opción en casos refractarios con obstrucción','Solo PSA','Nada'],a:1,e:'La cirugía se reserva para casos refractarios o con alteraciones anatómicas.'}
]}

,{id:'c22',title:'Fiebre y confusión a los 68',tag:'Meningitis',intro:'Mujer de 68 años, en prednisona 20 mg/día por artritis reumatoide. Fiebre de 39 °C, cefalea y somnolencia (Glasgow 12) de 1 día. Sin déficit focal. 70 kg. ClCr 75 mL/min. Ya tomaste hemocultivos.',vit:['T° 39','Glasgow 12','Prednisona 20 mg','ClCr 75'],steps:[
 {q:'¿Necesita TAC antes de la punción y qué haces mientras tanto?',o:['No necesita TAC; esperar el LCR para iniciar antibióticos','Sí (compromiso de conciencia e inmunosupresión), pero se inician dexametasona y antibióticos antes de la TAC','No, iniciar solo ceftriaxona','Sí, y se esperan los resultados para tratar'],a:1,e:'Retrasar el antibiótico más de 6 h aumenta mucho la mortalidad.'},
 {q:'¿Qué esquema empírico indicas?',o:['Ceftriaxona 2 g c/24 h','Vancomicina 15–20 mg/kg c/8–12 h + ceftriaxona 2 g c/12 h + ampicilina 2 g c/4 h + dexametasona 10 mg c/6 h','Meropenem 1 g c/8 h','Ampicilina sola'],a:1,e:'Mayor de 50 años e inmunosuprimida: cubrir Listeria.'},
 {q:'Gram del LCR: bacilos grampositivos. Hemocultivo: Listeria monocytogenes. ¿Qué ajustas?',o:['Mantener todo','Suspender vancomicina, ceftriaxona y dexametasona; ampicilina 2 g c/4 h, considerando gentamicina','Cambiar a meropenem','Agregar clindamicina'],a:1,e:'La dexametasona se asoció a más mortalidad en Listeria. Gentamicina 1,7 mg/kg c/8 h con niveles, vigilando la función renal.'},
 {q:'¿Cuánto tratas?',o:['7 días','10–14 días','Al menos 21 días','6 meses'],a:2,e:'Listeria se trata al menos 3 semanas, y más si hay rombencefalitis o absceso.'}
]}
,{id:'c23',title:'Petequias en un joven',tag:'Meningitis',intro:'Hombre de 22 años, sano, con 12 h de fiebre, rigidez de nuca y petequias en las piernas. LCR: 3.500 leucocitos/µL (90% neutrófilos), glucosa 18 mg/dL, proteínas 260 mg/dL. Gram: diplococos gramnegativos. Recibió vancomicina, ceftriaxona y dexametasona.',vit:['T° 39,4','PA 100/60','Petequias','LCR 3.500 cél'],steps:[
 {q:'¿Qué agente sospechas y qué ajustas de inmediato?',o:['Neumococo; mantener todo','Meningococo: se puede suspender la vancomicina y mantener la ceftriaxona','Listeria; agregar ampicilina','H. influenzae; cambiar a ampicilina'],a:1,e:'Diplococos gramnegativos con petequias: N. meningitidis. Muchos expertos suspenden la dexametasona si no es neumococo.'},
 {q:'El cultivo confirma meningococo con CIM de penicilina 0,06 mg/L. ¿Tratamiento definitivo y duración?',o:['Ceftriaxona 14 días','Penicilina G 4 millones UI c/4 h (o mantener ceftriaxona) por 7 días','Ciprofloxacino oral','Vancomicina'],a:1,e:'Con CIM <0,1 la penicilina es adecuada. Muchos centros mantienen ceftriaxona por comodidad y porque además erradica el portador.'},
 {q:'Su pareja y el compañero de departamento compartieron la casa la última semana. ¿Qué indicas?',o:['Nada','Profilaxis: ciprofloxacino 500 mg en dosis única (o rifampicina o ceftriaxona IM)','Vacunar solamente','Penicilina por 10 días'],a:1,e:'Idealmente dentro de 24 h. Si el paciente recibió penicilina como tratamiento definitivo, también necesita erradicación del portador.'}
]}

,{id:'c24',title:'Enterobacter en la sangre',tag:'IDSA BLEE-AmpC',intro:'Hombre de 74 años con colangitis drenada por CPRE. Hemocultivos: Enterobacter cloacae complex sensible a ceftriaxona (CIM ≤1), cefepime (CIM 1), meropenem y ciprofloxacino; resistente a cefazolina y amoxicilina-clavulánico. Recibe ceftriaxona desde ayer.',vit:['Afebril 24 h','PA estable','ClCr 60','Foco drenado'],steps:[
 {q:'¿Mantienes la ceftriaxona?',o:['Sí, es sensible','No: en E. cloacae se sugiere evitar cefalosporinas de 3ª generación en infección invasiva por riesgo de resistencia (~20%)','Sí, en dosis doble','Sí, con amikacina'],a:1,e:'Es una de las especies con riesgo moderado de AmpC inducible.'},
 {q:'¿A qué cambias?',o:['Piperacilina-tazobactam','Cefepime 2 g c/8 h (infusión de 3 h si es posible)','Ceftazidima-avibactam','Ceftolozano-tazobactam'],a:1,e:'Cefepime es preferido con CIM ≤8 sin BLEE identificada. Reservar los fármacos nuevos para resistentes a carbapenémicos.'},
 {q:'Al día 4 está estable y tolera vía oral. ¿Qué opción tienes?',o:['Amoxicilina-clavulánico','Ciprofloxacino oral (sensible): no es sustrato de AmpC','Cefuroxima','Nitrofurantoína'],a:1,e:'Quinolonas y TMP-SMX no inducen AmpC ni son hidrolizados por ella.'},
 {q:'¿Cuánto tratas en total?',o:['14 días por ser AmpC','~7 días con foco controlado y buena respuesta','21 días','4 semanas'],a:1,e:'La resistencia no alarga la duración del tratamiento.'}
]}
,{id:'c25',title:'KPC en la UCI quirúrgica',tag:'IDSA CRE',intro:'Mujer de 61 años con absceso intraabdominal postoperatorio drenado y bacteriemia por K. pneumoniae resistente a meropenem. Test inmunocromatográfico: KPC positivo. Sensible a ceftazidima-avibactam, meropenem-vaborbactam, imipenem-relebactam y cefiderocol. Amikacina sensible. ClCr 80.',vit:['ClCr 80','Drenaje percutáneo','KPC +','Shock resuelto'],steps:[
 {q:'¿Qué eliges según la guía?',o:['Colistina + meropenem','Meropenem-vaborbactam (preferencia leve), o ceftazidima-avibactam o imipenem-relebactam','Tigeciclina','Cefiderocol + amikacina'],a:1,e:'Meropenem-vaborbactam tiene menos resistencia emergente que ceftazidima-avibactam (<3% vs ~10%).'},
