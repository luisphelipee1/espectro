,{id:'t8',t:'TARV',q:'Paciente en darunavir/cobicistat con asma, que usa fluticasona inhalada, consulta con cara de luna llena y estrías. ¿Qué ocurre?',o:['Lipodistrofia','Cushing iatrogénico por inhibición del CYP3A4','Hipotiroidismo','Efecto adverso del darunavir solo'],a:1,e:'Ritonavir y cobicistat elevan mucho los niveles de fluticasona y budesonida. Se prefiere beclometasona. También están contraindicadas simvastatina y lovastatina.',r:'DHHS Drug Interactions'}
,{id:'t9',t:'TARV',q:'¿Qué diferencia clínica principal hay entre TDF y TAF?',o:['TAF no cubre hepatitis B','TDF tiene más toxicidad renal y ósea; TAF se asocia a más aumento de peso y lípidos','TDF se da una vez por semana','No hay diferencias'],a:1,e:'TAF logra niveles plasmáticos de tenofovir mucho menores. Ambos son activos contra VHB.',r:'DHHS Adult ARV Guidelines'}
,{id:'t10',t:'TARV',q:'Paciente con VIH y VHB en TDF/FTC quiere suspender el TARV por su cuenta. ¿Qué riesgo debes advertirle además del rebote viral del VIH?',o:['Ninguno adicional','Reactivación grave de la hepatitis B','Hipersensibilidad','Pancreatitis'],a:1,e:'Suspender fármacos activos contra VHB puede gatillar una hepatitis fulminante. Al cambiar el esquema, siempre mantener cobertura de VHB.',r:'DHHS Adult ARV Guidelines'}
,{id:'t11',t:'TARV',q:'Nuevo diagnóstico de VIH con meningitis criptocócica. ¿Cuándo iniciar el TARV?',o:['El mismo día','Diferirlo 4–6 semanas desde el inicio del antifúngico','A los 6 meses','Solo cuando el cultivo de LCR sea negativo'],a:1,e:'El ensayo COAT mostró más mortalidad con inicio precoz por síndrome inflamatorio de reconstitución inmune (SIRI) en el SNC. En el resto de los pacientes se recomienda inicio rápido.',r:'Boulware DR, NEJM 2014 (COAT)'}
,{id:'t12',t:'TARV',q:'Tuberculosis pulmonar con CD4 de 40 células/µL. ¿Cuándo iniciar TARV?',o:['Dentro de las 2 primeras semanas de tratamiento antituberculoso','Al terminar el tratamiento de TB','A los 3 meses','Nunca con rifampicina'],a:0,e:'Con CD4 <50, el inicio precoz reduce mortalidad pese a más SIRI. Con CD4 ≥50, dentro de 8 semanas. En meningitis tuberculosa hay que tener más precaución.',r:'DHHS OI Guidelines; Blanc FX, NEJM 2011 (CAMELIA)'}
,{id:'t13',t:'TARV',q:'¿Con qué recuento de CD4 está indicada la profilaxis de Pneumocystis?',o:['<500 células/µL','<200 células/µL (o <14%)','<50 células/µL','Solo si hubo neumonía previa'],a:1,e:'TMP-SMX 1 comprimido forte o simple al día. Si además la IgG para Toxoplasma es positiva y CD4 <100, el forte diario cubre ambos. Se suspende con CD4 >200 por más de 3 meses en TARV.',r:'DHHS OI Guidelines'}
,{id:'t14',t:'TARV',q:'¿Qué significa I=I (Indetectable = Intransmisible)?',o:['Que con carga viral indetectable no se transmite por ninguna vía','Que con carga viral <200 copias/mL sostenida no hay transmisión sexual','Que se puede suspender el TARV','Que no hay que usar condón contra otras ITS'],a:1,e:'La evidencia (PARTNER, HPTN 052) muestra cero transmisiones sexuales con supresión sostenida. El condón sigue siendo útil contra otras ITS.',r:'Rodger AJ, Lancet 2019 (PARTNER2)'}
,{id:'t15',t:'TARV',q:'Exposición sexual de riesgo hace 30 horas. ¿Qué indicas?',o:['Nada, ya pasaron más de 24 h','PEP lo antes posible por 28 días (por ejemplo, BIC/FTC/TAF o DTG + TDF/FTC)','PEP por 7 días','Esperar el test a las 6 semanas'],a:1,e:'La profilaxis post-exposición se inicia dentro de las 72 h, idealmente cuanto antes, y dura 28 días. Hacer test basal de VIH, VHB, VHC e ITS.',r:'CDC PEP Guidelines 2025'}
,{id:'t16',t:'TARV',q:'¿En qué población está validada la PrEP "a demanda" (esquema 2-1-1) con TDF/FTC?',o:['Mujeres cis con exposición vaginal','Hombres que tienen sexo con hombres','Personas que se inyectan drogas','Todas las poblaciones'],a:1,e:'2 comprimidos entre 2 y 24 h antes, 1 a las 24 h y 1 a las 48 h. En exposición vaginal se necesita uso diario porque la concentración en tejido tarda más.',r:'Molina JM, NEJM 2015 (IPERGAY); OMS 2022'}
,{id:'t17',t:'TARV',q:'¿Qué mecanismo tiene el lenacapavir?',o:['Inhibidor de integrasa','Inhibidor de la cápside','Inhibidor de proteasa','Antagonista de CCR5'],a:1,e:'Primer inhibidor de cápside. Su vida media larga permite dosis subcutáneas cada 6 meses, tanto en tratamiento de multirresistentes como en PrEP (PURPOSE 1 y 2).',r:'Bekker LG, NEJM 2024 (PURPOSE 1)'}
,{id:'t18',t:'TARV',q:'Paciente en rilpivirina oral que usa omeprazol. ¿Qué pasa?',o:['Nada','Los IBP reducen la absorción de rilpivirina: están contraindicados','Aumenta la toxicidad de rilpivirina','Se potencian'],a:1,e:'Rilpivirina necesita pH ácido y comida. Los antagonistas H2 se pueden usar separados (12 h antes o 4 h después).',r:'Ficha técnica Edurant'}
,{id:'t19',t:'TARV',q:'¿Qué requisito debe cumplir un paciente para pasar a cabotegravir + rilpivirina inyectable?',o:['CD4 >500','Carga viral suprimida, sin resistencia a inhibidores de integrasa ni no nucleósidos, y sin VHB activa sin tratar','Haber fallado a 3 esquemas','Ser VHB positivo'],a:1,e:'Es un esquema de mantención IM cada 1 o 2 meses. No cubre VHB, y los atrasos en las inyecciones aumentan el riesgo de falla con resistencia.',r:'DHHS Adult ARV Guidelines'}
,{id:'t20',t:'TARV',q:'Embarazada con VIH recién diagnosticado. ¿Qué tercer fármaco se prefiere?',o:['Efavirenz','Dolutegravir','Cobicistat potenciado','Ninguno hasta el parto'],a:1,e:'La señal inicial de defectos del tubo neural (Tsepamo) no se confirmó con más datos. Dolutegravir logra supresión rápida, clave para prevenir la transmisión vertical.',r:'DHHS Perinatal Guidelines; Zash R, NEJM 2019'}
,{id:'t21',t:'TARV',q:'Paciente en TARV con carga viral de 1.200 copias/mL confirmada, con buena adherencia referida. ¿Qué pides?',o:['Nada, repetir en 1 año','Test de resistencia (genotipo) mientras sigue en TARV','Cambiar todo el esquema sin estudio','CD4 solamente'],a:1,e:'Falla virológica: carga viral >200 copias/mL confirmada. El genotipo debe tomarse en TARV o dentro de 4 semanas de suspenderlo, porque sin presión farmacológica vuelve a dominar el virus sensible.',r:'DHHS Adult ARV Guidelines'}
,{id:'t22',t:'TARV',q:'¿Qué mostró el ensayo REPRIEVE en personas con VIH de 40 a 75 años con riesgo cardiovascular bajo a moderado?',o:['Sin beneficio de estatinas','Pitavastatina redujo los eventos cardiovasculares mayores en ~35%','Más diabetes sin beneficio','Aspirina redujo la mortalidad'],a:1,e:'Hoy se recomienda considerar estatina en este grupo. Pitavastatina, pravastatina o rosuvastatina tienen menos interacciones con el TARV.',r:'Grinspoon SK, NEJM 2023 (REPRIEVE)'}
,{id:'t23',t:'TARV',q:'A las 3 semanas de iniciar TARV, un paciente con CD4 de 30 presenta fiebre y crecimiento de adenopatías. Antes tenía MAC diseminado. ¿Qué sospechas?',o:['Falla virológica','Síndrome inflamatorio de reconstitución inmune (SIRI)','Resistencia del MAC','Toxicidad del TARV'],a:1,e:'La recuperación inmune desenmascara o agrava una infección oportunista. En general no se suspende el TARV; se maneja con AINE o corticoides según la gravedad.',r:'DHHS OI Guidelines'}

,{id:'tb1',t:'TB · básico',q:'¿Cuál es el esquema estándar para TB pulmonar sensible en adultos?',o:['6 meses de isoniazida sola','2 meses de HRZE seguidos de 4 meses de HR','9 meses de HRZE','2 meses de HR'],a:1,e:'Fase intensiva de 2 meses con isoniazida (H), rifampicina (R), pirazinamida (Z) y etambutol (E). Fase de continuación de 4 meses con H y R. En Chile se rige por la norma del Programa Nacional de TB.',r:'OMS 2022; ATS/CDC/IDSA 2016'}
,{id:'tb2',t:'TB · básico',q:'¿Qué examen se pide primero ante sospecha de TB pulmonar?',o:['Hemocultivos','Baciloscopia y prueba molecular rápida (Xpert MTB/RIF) en expectoración, más cultivo','PPD','TAC de tórax solamente'],a:1,e:'La prueba molecular detecta M. tuberculosis y resistencia a rifampicina en horas. El cultivo sigue siendo necesario para el antibiograma completo y el seguimiento.',r:'OMS 2024 (diagnóstico)'}
,{id:'tb3',t:'TB · básico',q:'¿Por qué se usan 4 fármacos en la fase intensiva?',o:['Para acortar a 1 mes','Para evitar seleccionar resistencia mientras se espera el antibiograma, y matar las distintas poblaciones bacilares','Porque la rifampicina sola es tóxica','Por costumbre'],a:1,e:'Con carga bacilar alta, la monoterapia selecciona mutantes resistentes. Etambutol protege el esquema hasta confirmar sensibilidad a H y R.',r:'ATS/CDC/IDSA 2016'}
,{id:'tb4',t:'TB · básico',q:'Adulto de 62 kg. Con comprimidos combinados HRZE (75/150/400/275 mg), ¿cuántos comprimidos diarios?',o:['2','3','4','5'],a:2,e:'Bandas de peso OMS: 30–37 kg → 2; 38–54 kg → 3; 55–70 kg → 4; ≥71 kg → 5.',r:'OMS, Operational Handbook 2022'}
,{id:'tb5',t:'TB · básico',q:'¿Qué efecto de la rifampicina debes advertir siempre al paciente?',o:['Orina, lágrimas y sudor de color naranja','Caída del pelo','Coloración azul de las uñas','Hipoglicemia'],a:0,e:'Es inocuo, pero puede manchar los lentes de contacto blandos. Además, la rifampicina reduce la eficacia de los anticonceptivos hormonales.',r:'Ficha técnica rifampicina'}
,{id:'tb6',t:'TB · básico',q:'¿Para qué se da piridoxina (vitamina B6) junto con isoniazida?',o:['Para mejorar la absorción','Para prevenir la neuropatía periférica','Para evitar la hepatotoxicidad','Para reducir náuseas'],a:1,e:'Isoniazida interfiere con el metabolismo de la piridoxina. Se indica sobre todo en embarazo, diabetes, VIH, alcoholismo, desnutrición, insuficiencia renal y neuropatía previa.',r:'ATS/CDC/IDSA 2016'}
,{id:'tb7',t:'TB · básico',q:'¿Qué toxicidad característica tiene el etambutol?',o:['Ototoxicidad','Neuritis óptica (agudeza visual y discriminación de colores)','Hiperkalemia','Pancreatitis'],a:1,e:'Hacer agudeza visual y test de colores (Ishihara) basal y mensual. Mayor riesgo con dosis altas e insuficiencia renal.',r:'ATS/CDC/IDSA 2016'}
,{id:'tb8',t:'TB · básico',q:'¿Qué examen de sangre se ve afectado típicamente por la pirazinamida?',o:['Potasio','Ácido úrico (hiperuricemia)','Glicemia','Plaquetas'],a:1,e:'La hiperuricemia es casi universal y rara vez da gota. La pirazinamida también es hepatotóxica.',r:'ATS/CDC/IDSA 2016'}
,{id:'tb9',t:'TB · básico',q:'¿Qué aislamiento necesita un paciente hospitalizado con TB pulmonar bacilífera?',o:['Contacto','Gotitas (mascarilla quirúrgica)','Aéreo: pieza individual, idealmente con presión negativa, y respirador N95 para el personal','Ninguno'],a:2,e:'El paciente usa mascarilla quirúrgica al salir de la pieza. Se mantiene hasta tener respuesta clínica y baciloscopias negativas según el protocolo.',r:'CDC 2005'}
,{id:'tb10',t:'TB · básico',q:'¿Qué ventaja tiene el IGRA (Quantiferon) sobre el PPD?',o:['Detecta TB activa','No se altera por la vacuna BCG','Es más barato','No necesita muestra de sangre'],a:1,e:'Los antígenos ESAT-6 y CFP-10 no están en la BCG. Ni el IGRA ni el PPD distinguen infección latente de TB activa.',r:'Lewinsohn DM, CID 2017'}
,{id:'tb11',t:'TB · básico',q:'¿Qué es la infección tuberculosa latente?',o:['TB activa sin síntomas','Infección con respuesta inmune a M. tuberculosis, sin enfermedad activa ni contagio','TB resistente','TB extrapulmonar'],a:1,e:'Se trata en grupos con alto riesgo de reactivación: contactos, VIH, antes de un anti-TNF, trasplante y otros.',r:'OMS 2024 (TPT)'}
,{id:'tb12',t:'TB · básico',q:'¿Qué significa TB "MDR"?',o:['Resistente a isoniazida y rifampicina','Resistente solo a etambutol','Resistente a todos los fármacos','Resistente a fluoroquinolonas'],a:0,e:'RR: resistente a rifampicina. MDR: resistente a H y R. Pre-XDR: además resistente a fluoroquinolona. XDR: pre-XDR más resistencia a bedaquilina o linezolid.',r:'OMS 2021 (definiciones)'}
,{id:'tb13',t:'TB · intermedio',q:'Semana 3 de HRZE. ALT 260 U/L (límite 40) con náuseas. ¿Qué haces?',o:['Continuar y controlar en un mes','Suspender los fármacos hepatotóxicos (H, R y Z)','Suspender solo el etambutol','Reducir todas las dosis a la mitad'],a:1,e:'Criterio: ALT >3 veces el límite con síntomas o ictericia, o >5 veces sin síntomas. Si la TB es grave, mantener un esquema puente no hepatotóxico (por ejemplo, etambutol + levofloxacino + amikacina o linezolid).',r:'ATS/CDC/IDSA 2016'}
,{id:'tb14',t:'TB · intermedio',q:'Normalizada la ALT, ¿cómo reintroduces el esquema?',o:['Todos juntos en dosis completa','Secuencial: primero rifampicina, luego isoniazida, y considerar no reintroducir pirazinamida','Solo isoniazida','No se reintroduce'],a:1,e:'Se reintroduce uno a uno controlando ALT a los 3–7 días. Si se omite pirazinamida, el esquema se alarga a 9 meses (2 HRE + 7 HR).',r:'ATS/CDC/IDSA 2016'}
,{id:'tb15',t:'TB · intermedio',q:'Paciente en hemodiálisis con TB. ¿Qué fármacos se ajustan?',o:['Isoniazida y rifampicina','Pirazinamida y etambutol: 3 veces por semana después de la diálisis','Ninguno','Todos se reducen a la mitad'],a:1,e:'H y R se eliminan principalmente por el hígado. Z y E se acumulan en insuficiencia renal: misma dosis, 3 veces por semana post-diálisis.',r:'ATS/CDC/IDSA 2016'}
,{id:'tb16',t:'TB · intermedio',q:'Paciente en warfarina que inicia rifampicina. ¿Qué esperas?',o:['INR muy alto','Caída marcada del INR: necesitará mucha más warfarina y control estrecho','Sin efecto','Sangrado inmediato'],a:1,e:'Rifampicina es un inductor muy potente (CYP3A4, 2C9, P-gp). También reduce DOAC, tacrolimus, azoles, anticonceptivos, metadona y muchos antirretrovirales. El efecto dura 2 semanas después de suspenderla.',r:'Baciewicz AM, Am J Med Sci 2008'}
,{id:'tb17',t:'TB · intermedio',q:'Persona con VIH en darunavir/ritonavir que necesita una rifamicina. ¿Cuál usas?',o:['Rifampicina 600 mg','Rifabutina 150 mg c/24 h','Rifapentina','Ninguna rifamicina'],a:1,e:'Rifabutina induce mucho menos el CYP3A. Con IP potenciados se usa 150 mg diarios, porque el ritonavir eleva sus niveles (riesgo de uveítis y neutropenia).',r:'DHHS OI Guidelines'}
,{id:'tb18',t:'TB · intermedio',q:'Paciente con TB pulmonar cavitada y cultivo aún positivo a los 2 meses. ¿Qué cambia?',o:['Nada','Se extiende la fase de continuación a 7 meses (9 meses en total)','Se agrega amikacina','Se cambia a esquema MDR'],a:1,e:'Cavitación más cultivo positivo a los 2 meses predice recaída. También revisar adherencia, absorción y repetir la sensibilidad.',r:'ATS/CDC/IDSA 2016'}
,{id:'tb19',t:'TB · intermedio',q:'Meningitis tuberculosa. ¿Qué es diferente en el manejo?',o:['Dura 6 meses como la pulmonar','Dura 9–12 meses y se agrega dexametasona','No se usa rifampicina','Se usa solo isoniazida intratecal'],a:1,e:'Típicamente 2 HRZE + 7–10 HR, con corticoides al inicio, que reducen la mortalidad. La TB ósea también se trata 6–9 meses o más.',r:'ATS/CDC/IDSA 2016; Thwaites GE, NEJM 2004'}
,{id:'tb20',t:'TB · intermedio',q:'Paciente que va a iniciar infliximab tiene IGRA positivo y radiografía normal. ¿Qué haces?',o:['Iniciar infliximab y observar','Tratar la infección latente, idealmente iniciándola al menos 1 mes antes del anti-TNF','Contraindicar el infliximab de por vida','Tratar con HRZE completo'],a:1,e:'Los anti-TNF aumentan mucho el riesgo de reactivación. Opciones: 4 meses de rifampicina, 3 meses de rifapentina + isoniazida semanal (3HP), 3HR o 6–9 meses de isoniazida.',r:'OMS 2024 (TPT); ACR'}
,{id:'tb21',t:'TB · intermedio',q:'¿En qué consiste el esquema 3HP para infección latente?',o:['3 meses de isoniazida diaria','Isoniazida + rifapentina una vez por semana por 12 semanas','3 meses de HRZE','Rifampicina 3 veces por semana por 1 mes'],a:1,e:'12 dosis semanales con buena adherencia. Puede dar reacción tipo gripal o de hipersensibilidad. Comparte las interacciones de las rifamicinas.',r:'Sterling TR, NEJM 2011 (PREVENT TB)'}
,{id:'tb22',t:'TB · intermedio',q:'Dos semanas después de iniciar el tratamiento de TB ganglionar, los ganglios crecen y aparece uno nuevo. El paciente tiene adherencia y la cepa es sensible. ¿Qué piensas?',o:['Falla del tratamiento','Reacción paradójica','Resistencia adquirida','Otro diagnóstico seguro'],a:1,e:'Es una respuesta inmune exagerada a los antígenos liberados, frecuente en TB ganglionar y en VIH al iniciar TARV (SIRI). No implica cambiar el esquema; se puede drenar o dar corticoides.',r:'ATS/CDC/IDSA 2016'}
,{id:'tb23',t:'TB · intermedio',q:'TB con resistencia aislada a isoniazida (rifampicina sensible). ¿Qué esquema recomienda la OMS?',o:['HRZE estándar','6 meses de rifampicina, etambutol, pirazinamida y levofloxacino','Esquema MDR completo','Isoniazida en dosis altas'],a:1,e:'Se elimina la isoniazida y se agrega levofloxacino por 6 meses. Hay que descartar resistencia a rifampicina y a fluoroquinolonas antes.',r:'OMS 2022 (Módulo 4)'}
,{id:'tb24',t:'TB · intermedio',q:'Embarazada con TB pulmonar sensible. ¿Qué evitas?',o:['Isoniazida','Rifampicina','Aminoglucósidos como estreptomicina (ototoxicidad fetal)','Etambutol'],a:2,e:'HRZE se considera seguro, con piridoxina. La OMS incluye pirazinamida. La TB no tratada es mucho más riesgosa que los fármacos.',r:'OMS 2022; ATS/CDC/IDSA 2016'}
,{id:'tb25',t:'TB · avanzado',q:'Xpert MTB/RIF detecta M. tuberculosis con resistencia a rifampicina. ¿Qué mutaciones detecta la prueba?',o:['katG','Región determinante de resistencia del gen rpoB','inhA','gyrA'],a:1,e:'Más del 95% de la resistencia a rifampicina está en esa región de rpoB. katG e inhA explican la resistencia a isoniazida; gyrA, la de fluoroquinolonas.',r:'OMS 2024 (diagnóstico)'}
,{id:'tb26',t:'TB · avanzado',q:'TB resistente a rifampicina, sensible a fluoroquinolonas, en un adulto. ¿Qué esquema prefiere la OMS?',o:['18–20 meses con inyectable','BPaLM por 6 meses: bedaquilina, pretomanid, linezolid y moxifloxacino','HRZE extendido','Solo fluoroquinolona + amikacina'],a:1,e:'Si hay resistencia a fluoroquinolonas, se usa BPaL (sin moxifloxacino). Los esquemas largos con inyectables quedaron atrás.',r:'OMS 2022 (Módulo 4); TB-PRACTECAL, NEJM 2022'}
,{id:'tb27',t:'TB · avanzado',q:'¿Cómo se dosifica la bedaquilina en el esquema BPaLM?',o:['400 mg diarios por 2 semanas, luego 200 mg 3 veces por semana','100 mg diarios','600 mg semanales','200 mg c/12 h'],a:0,e:'Esquema clásico. La OMS también acepta 200 mg diarios por 8 semanas y luego 100 mg diarios. Se toma con comida.',r:'OMS 2022 (Módulo 4)'}
,{id:'tb28',t:'TB · avanzado',q:'¿Qué monitorización es clave con bedaquilina y moxifloxacino en BPaLM?',o:['Niveles plasmáticos de bedaquilina','ECG por prolongación del QT, con potasio y magnesio','Audiometría','Función tiroidea'],a:1,e:'El efecto se suma con clofazimina, macrólidos y otros. Suspender si el QTcF supera 500 ms.',r:'OMS 2022 (Módulo 4)'}
,{id:'tb29',t:'TB · avanzado',q:'¿Qué toxicidades del linezolid limitan su uso en BPaLM y cómo se manejan?',o:['Hepatotoxicidad; reducir a la mitad','Mielosupresión y neuropatía periférica u óptica; 600 mg diarios con hemograma y examen neurológico, reduciendo o suspendiendo si aparecen','Nefrotoxicidad; ajustar por ClCr','Ninguna'],a:1,e:'El ensayo ZeNix mostró que 600 mg diarios mantienen la eficacia con menos toxicidad que 1.200 mg.',r:'Conradie F, NEJM 2022 (ZeNix)'}
,{id:'tb30',t:'TB · avanzado',q:'¿En qué consiste el esquema de 4 meses con rifapentina y moxifloxacino para TB sensible?',o:['2 HPZM + 2 HPM, en mayores de 12 años sin contraindicación','4 meses de HRZE','4 meses de rifampicina','Moxifloxacino solo'],a:0,e:'Isoniazida, rifapentina, pirazinamida y moxifloxacino. No fue inferior al esquema de 6 meses en el ensayo Study 31/A5349.',r:'Dorman SE, NEJM 2021'}
,{id:'tb31',t:'TB · avanzado',q:'Paciente con cáncer vesical tratado con BCG intravesical presenta infección sistémica por BCG. ¿Qué fármaco NO sirve?',o:['Isoniazida','Rifampicina','Pirazinamida','Etambutol'],a:2,e:'M. bovis BCG es intrínsecamente resistente a pirazinamida. Se trata con isoniazida, rifampicina y etambutol.',r:'Pérez-Jacoiste Asín MA, Medicine 2014'}
,{id:'tb32',t:'TB · avanzado',q:'Una mutación en el promotor de inhA confiere resistencia de bajo nivel a isoniazida. ¿Con qué otro fármaco hay resistencia cruzada?',o:['Rifampicina','Etionamida (o protionamida)','Etambutol','Bedaquilina'],a:1,e:'inhA es blanco común de isoniazida y etionamida. katG da resistencia de alto nivel a isoniazida sin afectar etionamida.',r:'OMS, catálogo de mutaciones 2023'}
,{id:'tb33',t:'TB · avanzado',q:'¿Por qué no se debe agregar un solo fármaco nuevo a un esquema de TB que está fallando?',o:['Porque es caro','Porque equivale a monoterapia y selecciona resistencia al nuevo fármaco','Porque interactúa','No hay problema'],a:1,e:'Regla de oro: ante falla, agregar al menos 2–3 fármacos que el paciente no haya recibido y que sean probablemente activos, guiados por el antibiograma.',r:'ATS/CDC/IDSA 2016'}
,{id:'tb34',t:'TB · avanzado',q:'Paciente con TB sensible que vomita la mitad de las tomas y no mejora. ¿Qué herramienta ayuda a decidir?',o:['Repetir el IGRA','Monitorización de niveles de isoniazida y rifampicina a las 2 h post dosis','Más tiempo de tratamiento sin cambios','PET-CT'],a:1,e:'La malabsorción (VIH, diabetes, gastrectomía, diarrea) deja niveles bajos. El TDM permite subir las dosis con fundamento.',r:'Alsultan A, Drugs 2014'}
,{id:'tb35',t:'TB · avanzado',q:'TB pulmonar en paciente diabético con mal control. ¿Qué consideraciones son correctas?',o:['Ninguna especial','Más riesgo de falla y recaída, rifampicina baja los niveles de sulfonilureas, y conviene dar piridoxina','La metformina está contraindicada','Se debe usar insulina siempre'],a:1,e:'Hay que optimizar el control glicémico. Algunos expertos extienden el tratamiento si la respuesta es lenta.',r:'ATS/CDC/IDSA 2016'}
,{id:'tb36',t:'TB · avanzado',q:'¿Qué hace el pretomanid?',o:['Inhibe la ATP sintasa','Es un nitroimidazol que inhibe la síntesis de ácidos micólicos y genera óxido nítrico en anaerobiosis','Inhibe la ARN polimerasa','Inhibe la girasa'],a:1,e:'La ATP sintasa es el blanco de bedaquilina. Pretomanid solo se usa en combinación (BPaL o BPaLM).',r:'Conradie F, NEJM 2020 (Nix-TB)'}
,{id:'mn1',t:'MNT',q:'¿Qué diferencia epidemiológica clave hay entre las micobacterias no tuberculosas (MNT) y M. tuberculosis?',o:['Las MNT son más contagiosas','Las MNT viven en el ambiente (agua, suelo) y en general no se transmiten de persona a persona','Las MNT solo infectan animales','No hay diferencias'],a:1,e:'Por eso no se notifican como la TB ni se estudian contactos. La excepción posible es M. abscessus en fibrosis quística.',r:'ATS/ERS/ESCMID/IDSA 2020'}
,{id:'mn2',t:'MNT',q:'¿Qué se necesita para diagnosticar enfermedad pulmonar por MNT?',o:['Un cultivo positivo de expectoración','Síntomas, imagen compatible y criterio microbiológico (≥2 expectoraciones positivas para la misma especie, o 1 lavado broncoalveolar o biopsia)','Solo una TAC','Un IGRA positivo'],a:1,e:'Un único cultivo de expectoración puede ser contaminación o colonización. Además, cumplir criterios no obliga a tratar: se pondera la progresión.',r:'ATS/ERS/ESCMID/IDSA 2020'}
,{id:'mn3',t:'MNT',q:'Mujer de 68 años, delgada, con bronquiectasias y nódulos, sin cavidades. MAC sensible a macrólidos. ¿Qué esquema?',o:['Claritromicina sola','Azitromicina + rifampicina + etambutol, 3 veces por semana','HRZE','Amikacina sola'],a:1,e:'Forma nodular-bronquiectásica no cavitaria: esquema intermitente. Azitromicina 500–600 mg, rifampicina 600 mg y etambutol 25 mg/kg, 3 veces por semana.',r:'ATS/ERS/ESCMID/IDSA 2020'}
,{id:'mn4',t:'MNT',q:'MAC pulmonar con cavidades. ¿Qué cambia?',o:['Nada','Tratamiento diario y agregar amikacina IV o inhalada al inicio','Tratar solo 3 meses','Usar solo rifampicina'],a:1,e:'Forma cavitaria o avanzada: azitromicina 250–500 mg, rifampicina 450–600 mg y etambutol 15 mg/kg diarios, más amikacina en la fase inicial. Considerar cirugía.',r:'ATS/ERS/ESCMID/IDSA 2020'}
,{id:'mn5',t:'MNT',q:'¿Cuánto dura el tratamiento de MAC pulmonar?',o:['6 meses en total','Al menos 12 meses después de la conversión del cultivo','2 meses','Hasta que mejore la tos'],a:1,e:'Por eso suele superar los 18 meses en total. Se toman cultivos de expectoración mensuales.',r:'ATS/ERS/ESCMID/IDSA 2020'}
,{id:'mn6',t:'MNT',q:'¿Por qué nunca se da un macrólido solo para MAC?',o:['Porque no penetra al pulmón','Porque selecciona rápido mutaciones en 23S rRNA con resistencia a macrólidos, que empeora mucho el pronóstico','Porque es hepatotóxico','Porque interactúa con rifampicina'],a:1,e:'El etambutol es el principal acompañante que protege al macrólido. Con resistencia a macrólidos el pronóstico es similar al de la TB MDR.',r:'Griffith DE, AJRCCM 2006'}
,{id:'mn7',t:'MNT',q:'MAC pulmonar con cultivos positivos después de 6 meses de esquema estándar. ¿Qué agregas?',o:['Nada, seguir esperando','Amikacina liposomal inhalada (590 mg diarios)','Isoniazida','Ceftriaxona'],a:1,e:'El ensayo CONVERT mostró más conversión de cultivo con amikacina liposomal inhalada en MAC refractario.',r:'Griffith DE, AJRCCM 2018 (CONVERT)'}
,{id:'mn8',t:'MNT',q:'¿Qué prueba de sensibilidad se recomienda de rutina en MAC?',o:['Todos los antituberculosos','Claritromicina (macrólidos) y amikacina','Rifampicina y etambutol','Ninguna'],a:1,e:'Son los únicos con correlación clínica establecida. La sensibilidad in vitro a rifampicina y etambutol no predice la respuesta.',r:'CLSI M24; ATS/ERS/ESCMID/IDSA 2020'}
,{id:'mn9',t:'MNT',q:'M. abscessus subsp. abscessus aparece sensible a claritromicina al día 3 de incubación. ¿Qué debes pedir?',o:['Nada más','Leer a los 14 días o secuenciar erm(41): puede tener resistencia inducible a macrólidos','Repetir al día 1','Cambiar a azitromicina'],a:1,e:'El gen erm(41) funcional induce resistencia que solo se ve con incubación prolongada. La subespecie massiliense tiene erm(41) no funcional y responde mejor a macrólidos.',r:'Nash KA, AAC 2009; CLSI M24'}
,{id:'mn10',t:'MNT',q:'¿Cómo es la fase de inducción para M. abscessus pulmonar?',o:['Azitromicina sola','Amikacina IV + imipenem o cefoxitina + tigeciclina (± macrólido si no hay resistencia inducible)','HRZE','Rifampicina + etambutol'],a:1,e:'Al menos 3 fármacos activos en inducción, luego mantención oral o inhalada según sensibilidad (por ejemplo, amikacina inhalada, linezolid, clofazimina). Es de las MNT más difíciles de tratar.',r:'ATS/ERS/ESCMID/IDSA 2020'}
,{id:'mn11',t:'MNT',q:'¿Cuál es el tratamiento de M. kansasii pulmonar sensible a rifampicina?',o:['Claritromicina sola','Rifampicina + etambutol + (isoniazida o azitromicina)','Amikacina + imipenem','No requiere tratamiento'],a:1,e:'Es de las MNT más parecidas a la TB y responde bien. Se trata al menos 12 meses. La rifampicina es el fármaco clave.',r:'ATS/ERS/ESCMID/IDSA 2020'}
,{id:'mn12',t:'MNT',q:'Lesión nodular en la mano de alguien que limpia un acuario. ¿Qué MNT sospechas?',o:['M. avium','M. marinum','M. abscessus','M. kansasii'],a:1,e:'"Granuloma de las piscinas o acuarios". Crece a 30–32 °C, por lo que hay que avisar al laboratorio. Tratamiento: claritromicina + etambutol por 1–2 meses después de la resolución.',r:'ATS/IDSA 2007'}
,{id:'mn13',t:'MNT',q:'Endocarditis o infección de prótesis meses después de cirugía cardíaca, asociada a dispositivos de calentamiento y enfriamiento. ¿Qué agente sospechas?',o:['M. chimaera','M. tuberculosis','M. marinum','M. leprae'],a:0,e:'M. chimaera (complejo MAC) contaminó equipos heater-cooler a nivel mundial. El período de incubación puede ser de años.',r:'Sax H, CID 2015'}
,{id:'mn14',t:'MNT',q:'Persona con VIH y CD4 de 25 con fiebre, baja de peso y hemocultivo positivo para MAC. ¿Qué esquema?',o:['Azitromicina sola','Claritromicina (o azitromicina) + etambutol, considerando agregar rifabutina','HRZE','Amikacina sola'],a:1,e:'Se inicia el TARV dentro de 2 semanas, vigilando el SIRI. Ojo con las interacciones de claritromicina y rifabutina con el TARV.',r:'DHHS OI Guidelines'}
,{id:'mn15',t:'MNT',q:'Niño de 3 años con adenopatía cervical unilateral por MNT, sin otros síntomas. ¿Tratamiento de elección?',o:['Antibióticos por 12 meses','Escisión quirúrgica completa','Drenaje con aguja','HRZE'],a:1,e:'La escisión completa cura en más del 90%. Drenar o abrir sin resecar deja fístulas crónicas.',r:'Lindeboom JA, CID 2007'}
,{id:'mn16',t:'MNT',q:'Las micobacterias de crecimiento rápido (M. fortuitum, M. abscessus, M. chelonae) crecen en cultivo en:',o:['Menos de 7 días','6–8 semanas','Solo en animales','24 horas siempre'],a:0,e:'Se aíslan a veces en hemocultivos o heridas, y se confunden con difteroides en el Gram. Las de crecimiento lento (MAC, M. kansasii, M. tuberculosis) tardan semanas.',r:'ATS/ERS/ESCMID/IDSA 2020'}

,{id:'pk1',t:'PK/PD a fondo',q:'¿Qué meta de %fT>CIM se asocia a efecto bactericida para cada familia de betalactámicos?',o:['Todas 100%','Penicilinas ~50%, cefalosporinas ~60–70%, carbapenémicos ~40%','Penicilinas 20%, cefalosporinas 30%, carbapenémicos 80%','Ninguna, son concentración-dependientes'],a:1,e:'Son metas clásicas de modelos animales. En el paciente crítico se apunta más alto: 100% fT>CIM.',r:'Craig WA, CID 1998'}
,{id:'pk2',t:'PK/PD a fondo',q:'¿Qué meta de Cmáx/CIM se busca con aminoglucósidos?',o:['≥2','≥8–10','≥100','≥400'],a:1,e:'Un pico 8–10 veces sobre la CIM maximiza la muerte bacteriana y reduce la emergencia de resistencia.',r:'Moore RD, JID 1987'}
,{id:'pk3',t:'PK/PD a fondo',q:'¿Qué meta de fAUC24/CIM se describe para fluoroquinolonas contra gramnegativos?',o:['≥25','≥100–125','≥400','≥1.000'],a:1,e:'Contra neumococo la meta es menor (fAUC/CIM ~30–50). Con CIM altas, las dosis estándar no alcanzan la meta.',r:'Forrest A, AAC 1993'}
,{id:'pk4',t:'PK/PD a fondo',q:'¿Qué es el efecto post-antibiótico?',o:['La toxicidad tardía de un antibiótico','La supresión del crecimiento bacteriano que persiste después de que la concentración baja de la CIM','La resistencia que aparece al suspender','El rebote de fiebre'],a:1,e:'Es prolongado con aminoglucósidos y quinolonas contra gramnegativos. Los betalactámicos casi no lo tienen contra gramnegativos (excepto carbapenémicos), lo que explica la importancia del tiempo sobre la CIM.',r:'Craig WA, CID 1998'}
,{id:'pk5',t:'PK/PD a fondo',q:'¿Qué parámetro farmacocinético determina la dosis de carga?',o:['El clearance','El volumen de distribución','La vida media','La unión a proteínas solamente'],a:1,e:'Carga = concentración objetivo × Vd. Por eso la dosis de carga NO se ajusta por función renal. El clearance determina la dosis de mantención.',r:'Roberts JA, Lancet Infect Dis 2014'}
,{id:'pk6',t:'PK/PD a fondo',q:'¿Qué grupo de antimicrobianos sufre más cambios farmacocinéticos en sepsis?',o:['Lipofílicos (quinolonas, macrólidos, linezolid)','Hidrofílicos (betalactámicos, aminoglucósidos, glicopéptidos, colistina)','Ninguno','Solo antifúngicos'],a:1,e:'Los hidrofílicos tienen Vd pequeño (agua extracelular) y eliminación renal: el volumen aumenta con fluidos y fuga capilar, y el clearance cambia con la función renal.',r:'Roberts JA, Crit Care Med 2009'}
,{id:'pk7',t:'PK/PD a fondo',q:'¿Cuántas vidas medias se necesitan para llegar al estado estacionario sin dosis de carga?',o:['1','2','4–5','10'],a:2,e:'Por eso los fármacos de vida media larga (vancomicina en insuficiencia renal, teicoplanina, fluconazol) necesitan carga.',r:'Rowland & Tozer, Clinical Pharmacokinetics'}
,{id:'pk8',t:'PK/PD a fondo',q:'¿Qué es la probabilidad de alcanzar el objetivo (PTA) en una simulación de Monte Carlo?',o:['La probabilidad de curación del paciente','El porcentaje de pacientes simulados que alcanzan la meta PK/PD para una CIM dada con un esquema de dosis','La sensibilidad del antibiograma','La tasa de efectos adversos'],a:1,e:'Se usa para fijar puntos de corte y elegir dosis. Un esquema aceptable suele tener PTA ≥90% para las CIM esperables.',r:'Mouton JW, J Antimicrob Chemother 2005'}
,{id:'pk9',t:'PK/PD a fondo',q:'¿Qué es la concentración preventiva de mutantes (MPC)?',o:['La concentración que inhibe al 50% de las cepas','La concentración que impide crecer a las subpoblaciones mutantes de primer paso','Lo mismo que la CBM','La concentración tóxica'],a:1,e:'Entre la CIM y la MPC está la "ventana de selección de mutantes". Mantenerse ahí mucho tiempo favorece la resistencia, sobre todo con quinolonas.',r:'Drlica K, CID 2007'}
,{id:'pk10',t:'PK/PD a fondo',q:'¿Qué índice PK/PD predice la eficacia del fluconazol contra Candida?',o:['%T>CIM','AUC/CIM ~100 (dosis/CIM >50)','Cmáx/CIM ≥10','Ninguno'],a:1,e:'Por eso con CIM de 16 (SDD en C. glabrata) haría falta 800 mg/día. Equinocandinas: Cmáx/CIM y AUC/CIM.',r:'Andes D, AAC 2003'}
,{id:'pk11',t:'PK/PD a fondo',q:'¿Qué concentración valle de linezolid se usa como umbral de toxicidad hematológica en TDM?',o:['>1 mg/L','>7–8 mg/L','>20 mg/L','No hay umbral'],a:1,e:'Meta habitual: valle 2–7 mg/L. Sobre 7–8 aumenta mucho el riesgo de trombocitopenia, sobre todo en insuficiencia renal.',r:'Pea F, J Antimicrob Chemother 2012'}
,{id:'pk12',t:'PK/PD a fondo',q:'¿Qué valle de daptomicina se asocia a mayor riesgo de elevación de CPK?',o:['>1 mg/L','>24,3 mg/L','>100 mg/L','No se asocia a niveles'],a:1,e:'El umbral de 24,3 mg/L viene de un análisis de Bhavnani. Eficacia: Cmáx/CIM y AUC/CIM.',r:'Bhavnani SM, CID 2010'}
,{id:'pk13',t:'PK/PD a fondo',q:'Ceftriaxona se une ~90% a albúmina. ¿Cuál de estos también se une mucho a proteínas?',o:['Meropenem','Ertapenem','Gentamicina','Fluconazol'],a:1,e:'Ertapenem, flucloxacilina, teicoplanina y daptomicina también. En ellos la hipoalbuminemia cambia de forma importante la fracción libre y el clearance.',r:'Ulldemolins M, Clin Pharmacokinet 2011'}
,{id:'pk14',t:'PK/PD a fondo',q:'¿Por qué en neumonía importa la concentración en el líquido de revestimiento epitelial (ELF)?',o:['No importa','Porque es el sitio donde están las bacterias extracelulares en la neumonía; algunos fármacos llegan mal ahí','Porque es donde se elimina el fármaco','Solo importa para virus'],a:1,e:'Vancomicina y aminoglucósidos penetran poco al ELF. Linezolid, tigeciclina y macrólidos llegan bien. Daptomicina se inactiva en el surfactante.',r:'Rodvold KA, Clin Pharmacokinet 2011'}
,{id:'uc1',t:'Paciente crítico',q:'Shock séptico. ¿Dentro de cuánto tiempo debe administrarse el antimicrobiano?',o:['Dentro de 1 hora','Dentro de 6 horas','Al tener el hemocultivo','A las 24 horas'],a:0,e:'La Surviving Sepsis Campaign 2021 recomienda dentro de 1 hora en shock o sepsis probable. Con sepsis posible sin shock, hay hasta 3 horas para completar la evaluación.',r:'Surviving Sepsis Campaign 2021'}
,{id:'uc2',t:'Paciente crítico',q:'¿Por qué los pacientes sépticos suelen quedar subdosificados en las primeras 24–48 h?',o:['Por menor Vd','Por aumento del Vd de hidrofílicos (fluidos, fuga capilar) y a veces clearance aumentado','Por mayor absorción oral','Por hepatotoxicidad'],a:1,e:'Por eso se recomienda dar la dosis de carga completa y no ajustar por función renal en las primeras 24–48 h, salvo excepciones como los aminoglucósidos.',r:'Roberts JA, Lancet Infect Dis 2014'}
,{id:'uc3',t:'Paciente crítico',q:'¿Por qué las fórmulas de ClCr (Cockcroft-Gault, CKD-EPI) son poco fiables en la UCI?',o:['Porque sobrestiman siempre','Porque suponen creatinina estable; en la UCI cambia rápido y la masa muscular es variable','Porque no incluyen el peso','Son muy fiables'],a:1,e:'Se prefiere medir el ClCr en orina de 8 h. Una creatinina "normal" en un paciente joven puede esconder clearance aumentado.',r:'Udy AA, Chest 2012'}
,{id:'uc4',t:'Paciente crítico',q:'Paciente en terapia de reemplazo renal continua (TRRC) con dosis de efluente de 25–35 mL/kg/h. ¿Cómo suele dosificarse el meropenem?',o:['500 mg c/24 h como en hemodiálisis','1 g c/8 h (o 2 g c/8 h si la CIM es alta o en las primeras 48 h)','Sin cambios respecto de un paciente en hemodiálisis','No se puede usar'],a:1,e:'La TRRC remueve bastante betalactámico. Dosificarlo como anúrico lleva a subexposición. Idealmente, TDM.',r:'Jamal JA, Crit Care 2015'}
,{id:'uc5',t:'Paciente crítico',q:'¿Qué efecto tiene el ECMO sobre fármacos lipofílicos y muy unidos a proteínas como voriconazol o fentanilo?',o:['Ninguno','Secuestro en el circuito y aumento del Vd, con riesgo de niveles bajos','Aumento del clearance renal','Más absorción oral'],a:1,e:'Los circuitos modernos secuestran menos, pero sigue siendo relevante. En antifúngicos azoles conviene TDM.',r:'Shekar K, Crit Care 2012'}
,{id:'uc6',t:'Paciente crítico',q:'Paciente gran quemado. ¿Qué cambio farmacocinético esperas en la fase hipermetabólica (después de 48 h)?',o:['Clearance reducido','Clearance renal aumentado y Vd aumentado: riesgo de subexposición','Sin cambios','Menor fracción libre'],a:1,e:'Se necesitan dosis más altas, infusiones prolongadas de betalactámicos y TDM.',r:'Blanchet B, Clin Pharmacokinet 2008'}
,{id:'uc7',t:'Paciente crítico',q:'Paciente crítico en amikacina. ¿Qué dosis inicial suele recomendarse?',o:['7,5 mg/kg','15 mg/kg','25–30 mg/kg','50 mg/kg'],a:2,e:'El mayor Vd en sepsis obliga a dosis mayores para lograr Cmáx/CIM ≥8. Gentamicina o tobramicina: 7 mg/kg. Luego se ajusta el intervalo con niveles.',r:'Taccone FS, Crit Care 2010'}
,{id:'uc8',t:'Paciente crítico',q:'¿Cuánto debe durar el tratamiento de una neumonía asociada a ventilador con buena respuesta?',o:['3 días','7 días','14 días','21 días'],a:1,e:'7 días no fueron inferiores a 15, salvo una tendencia a más recurrencia con bacilos no fermentadores.',r:'IDSA/ATS NAH/NAV 2016; Chastre J, JAMA 2003'}
,{id:'uc9',t:'Paciente crítico',q:'Infección intraabdominal complicada con foco bien controlado. ¿Cuánto tratar?',o:['4 días después del control del foco','14 días','Hasta que normalice la PCR','21 días'],a:0,e:'El ensayo STOP-IT mostró que ~4 días después del control del foco equivalen a tratar hasta resolver fiebre y leucocitosis.',r:'Sawyer RG, NEJM 2015 (STOP-IT)'}
,{id:'uc10',t:'Paciente crítico',q:'¿Para qué sirve la procalcitonina en la UCI?',o:['Para decidir si iniciar antibióticos en shock','Para apoyar la suspensión precoz de antibióticos cuando cae ≥80% o bajo 0,5 ng/mL','Para diagnosticar infecciones fúngicas','Para elegir el antibiótico'],a:1,e:'El algoritmo de suspensión redujo días de antibiótico sin aumentar mortalidad. No debe retrasar el inicio en sepsis.',r:'de Jong E, Lancet Infect Dis 2016 (SAPS)'}
,{id:'uc11',t:'Paciente crítico',q:'¿Qué mostró el ensayo EMPIRICUS sobre micafungina empírica en pacientes de UCI con sepsis, colonización por Candida y falla orgánica?',o:['Redujo mucho la mortalidad','No mejoró la supervivencia libre de infección fúngica a 28 días','Aumentó la mortalidad','Fue superior a fluconazol en candidemia'],a:1,e:'El tratamiento antifúngico empírico de rutina en la UCI no se recomienda. El beta-D-glucano negativo ayuda a suspenderlo.',r:'Timsit JF, JAMA 2016 (EMPIRICUS)'}
,{id:'uc12',t:'Paciente crítico',q:'Shock séptico con alto riesgo de gramnegativos multirresistentes. ¿Qué sugiere la Surviving Sepsis Campaign?',o:['Monoterapia siempre','Dos antimicrobianos con cobertura de gramnegativos al inicio, y luego desescalar con el cultivo','Tres antimicrobianos por 14 días','Esperar el antibiograma'],a:1,e:'La doble cobertura empírica aumenta la probabilidad de acertar. Una vez conocido el agente y su sensibilidad, se pasa a monoterapia.',r:'Surviving Sepsis Campaign 2021'}
,{id:'uc13',t:'Paciente crítico',q:'¿Qué indican los consensos sobre la monitorización de betalactámicos en el paciente crítico?',o:['No sirve','Se recomienda TDM en críticos, sobre todo con ARC, TRRC, ECMO, obesidad, quemados o patógenos con CIM alta','Solo para penicilinas','Solo en pediatría'],a:1,e:'El consenso de 2020 (ESICM, ESCMID, IATDMCT, ISAC) recomienda TDM de betalactámicos en críticos, con meta de 100% fT>CIM.',r:'Abdul-Aziz MH, Intensive Care Med 2020'}
,{id:'uc14',t:'Paciente crítico',q:'¿Qué riesgo tiene una concentración muy alta de betalactámicos en el crítico (por ejemplo, valle de cefepime >20 mg/L o de meropenem >45 mg/L)?',o:['Ninguno','Neurotoxicidad (encefalopatía, convulsiones)','Hipoglicemia','Ototoxicidad'],a:1,e:'El TDM sirve en ambos sentidos: evita la subexposición y también la toxicidad, sobre todo en insuficiencia renal.',r:'Imani S, J Antimicrob Chemother 2017'}
,{id:'on1',t:'Oncología',q:'¿Qué índice se usa para identificar neutropenia febril de bajo riesgo, apta para manejo ambulatorio?',o:['CURB-65','MASCC (≥21 puntos)','SOFA','Pitt'],a:1,e:'MASCC ≥21: bajo riesgo. En tumores sólidos aparentemente estables se usa también CISNE. Opción oral: amoxicilina-clavulánico + ciprofloxacino.',r:'IDSA/ASCO 2018'}
,{id:'on2',t:'Oncología',q:'¿Qué pacientes oncológicos reciben profilaxis con levofloxacino?',o:['Todos los que reciben quimioterapia','Alto riesgo: neutropenia profunda (<100) esperada por más de 7 días, como inducción de LMA o TPH','Ninguno','Solo tumores sólidos'],a:1,e:'Reduce bacteriemias y fiebre, pero selecciona resistencia. Muchos centros la ajustan según su epidemiología local.',r:'IDSA/ASCO 2018; ECIL'}
,{id:'on3',t:'Oncología',q:'Paciente con LMA en inducción. ¿Qué profilaxis antifúngica tiene mejor evidencia?',o:['Fluconazol','Posaconazol','Nistatina','Ninguna'],a:1,e:'Posaconazol redujo infección fúngica invasora y mortalidad frente a fluconazol o itraconazol en LMA/SMD.',r:'Cornely OA, NEJM 2007'}
,{id:'on4',t:'Oncología',q:'¿Cuándo se indica profilaxis de Pneumocystis en oncología?',o:['A todos los pacientes con quimioterapia','Prednisona ≥20 mg/día por 4 semanas o más, LLA, fludarabina, alemtuzumab, temozolomida con radioterapia, entre otros','Solo en VIH','Nunca en tumores sólidos'],a:1,e:'De elección TMP-SMX. Alternativas: atovacuona, dapsona (descartar déficit de G6PD) o pentamidina inhalada.',r:'NCCN Prevention and Treatment of Cancer-Related Infections'}
,{id:'on5',t:'Oncología',q:'Paciente con linfoma que va a recibir rituximab tiene HBsAg negativo y anti-HBc positivo. ¿Qué haces?',o:['Nada','Profilaxis antiviral (entecavir o tenofovir) o monitorización estrecha de ADN viral, según riesgo; con anti-CD20 se prefiere profilaxis','Vacunar y seguir','Contraindicar el rituximab'],a:1,e:'Los anti-CD20 tienen alto riesgo de reactivación incluso con HBsAg negativo. Profilaxis durante el tratamiento y al menos 12 meses después.',r:'AGA 2015; EASL 2017'}
,{id:'on6',t:'Oncología',q:'Paciente en bortezomib. ¿Qué profilaxis necesita?',o:['Fluconazol','Aciclovir o valaciclovir para prevenir herpes zóster','Levofloxacino','Ninguna'],a:1,e:'Los inhibidores de proteasoma aumentan mucho el riesgo de zóster. También se usa con daratumumab y en otros contextos de alto riesgo.',r:'NCCN'}
,{id:'on7',t:'Oncología',q:'Paciente en venetoclax que inicia posaconazol. ¿Qué haces?',o:['Nada','Reducir la dosis de venetoclax al menos 75% (inhibidor potente de CYP3A)','Duplicar venetoclax','Suspender posaconazol'],a:1,e:'Los azoles aumentan mucho los niveles de venetoclax, ibrutinib y otros inhibidores de quinasa. Coordinar con hematología.',r:'Ficha técnica Venclexta'}
,{id:'on8',t:'Oncología',q:'¿Qué combinación aumenta la neurotoxicidad en pacientes con leucemia linfoblástica?',o:['Vincristina + azoles (voriconazol, posaconazol, itraconazol)','Vincristina + equinocandinas','Metotrexato + fluconazol','Ciclofosfamida + aciclovir'],a:0,e:'Los azoles inhiben el CYP3A4 que elimina vincristina, con neuropatía grave e íleo. En esos pacientes se prefiere una equinocandina o anfotericina.',r:'Moriyama B, Ann Pharmacother 2012'}
,{id:'on9',t:'Oncología',q:'¿Qué antimicrobianos retrasan la eliminación del metotrexato en dosis altas?',o:['Vancomicina y linezolid','TMP-SMX, penicilinas (piperacilina) y los IBP','Fluconazol','Aciclovir oral'],a:1,e:'Compiten por la secreción tubular o desplazan de proteínas. Se debe evitarlos durante el metotrexato en dosis altas.',r:'Ficha técnica metotrexato'}
,{id:'on10',t:'Oncología',q:'Neutropenia febril sin foco, tratada empíricamente. A las 72 h el paciente está afebril y estable, sin documentación microbiológica, pero sigue neutropénico. ¿Qué dice el ensayo How Long?',o:['Mantener hasta recuperar neutrófilos','Se puede suspender el antibiótico empírico tras 72 h afebril y estable, aunque siga neutropénico','Escalar a carbapenémico','Agregar vancomicina'],a:1,e:'ECIL-4 permite suspender en esas condiciones con vigilancia. Reduce la exposición antibiótica sin aumentar la mortalidad.',r:'Aguilar-Guisado M, Lancet Haematol 2017 (How Long)'}
,{id:'on11',t:'Oncología',q:'Paciente con neutropenia, dolor en fosa ilíaca derecha y engrosamiento del ciego en la TAC. ¿Qué cobertura necesita?',o:['Ceftriaxona sola','Betalactámico antipseudomónico con cobertura anaeróbica (piperacilina-tazobactam o carbapenémico)','Vancomicina oral','Fluconazol'],a:1,e:'Tiflitis (enterocolitis neutropénica). Cefepime necesita agregar metronidazol. Considerar C. difficile y evaluación quirúrgica.',r:'IDSA/ASCO 2018'}
,{id:'on12',t:'Oncología',q:'Paciente con fiebre e hipotensión a los 3 días de recibir CAR-T. ¿Qué tienes que tener en cuenta?',o:['Es seguro un síndrome de liberación de citoquinas, no requiere antibióticos','El síndrome de liberación de citoquinas se parece a la sepsis: iniciar antibióticos empíricos si está neutropénico o hay duda','Siempre es infección fúngica','Suspender todo'],a:1,e:'Ambos pueden coexistir. Después del CAR-T también hay hipogammaglobulinemia prolongada (considerar IgIV) y profilaxis de herpes y Pneumocystis.',r:'Hill JA, Blood 2020'}
,{id:'tp1',t:'Trasplante hematopoyético',q:'¿Qué infecciones predominan antes del injerto (días 0 a ~30) en el TPH alogénico?',o:['CMV y Aspergillus','Bacterias (gramnegativos, cocáceas grampositivas por mucositis y catéter), Candida y HSV','Bacterias encapsuladas y VZV','Toxoplasma'],a:1,e:'Entre el injerto y el día 100 predominan CMV, Aspergillus y Pneumocystis. Después del día 100 (sobre todo con EICH crónica): encapsuladas, VZV y hongos.',r:'Tomblyn M, BBMT 2009'}
,{id:'tp2',t:'Trasplante hematopoyético',q:'¿Hasta cuándo se da letermovir como profilaxis en un TPH alogénico CMV-seropositivo?',o:['Hasta el injerto','Hasta el día 100, y hasta el día 200 en receptores de alto riesgo','Por 2 semanas','De por vida'],a:1,e:'Letermovir no es mielotóxico, a diferencia de ganciclovir. Igual se monitoriza la carga viral de CMV.',r:'Marty FM, NEJM 2017; Russo D, Lancet Haematol 2024'}
,{id:'tp3',t:'Trasplante hematopoyético',q:'¿Por cuánto tiempo se da profilaxis contra VZV con aciclovir o valaciclovir en TPH alogénico?',o:['Hasta el injerto','Al menos 1 año, y más mientras dure la inmunosupresión','1 mes','No se da'],a:1,e:'El riesgo de zóster es muy alto en el primer año. También cubre HSV desde el condicionamiento.',r:'Tomblyn M, BBMT 2009'}
,{id:'tp4',t:'Trasplante hematopoyético',q:'¿Cuándo suele iniciarse la profilaxis de Pneumocystis con TMP-SMX en TPH?',o:['Desde el día −7','Después del injerto, por su mielotoxicidad','Al día 365','No se usa'],a:1,e:'Antes del injerto algunos centros la dan unos días durante el condicionamiento. Alternativas si no tolera: atovacuona, dapsona o pentamidina.',r:'Tomblyn M, BBMT 2009'}
,{id:'tp5',t:'Trasplante hematopoyético',q:'Paciente con TPH alogénico y EICH que recibe corticoides en dosis altas. ¿Qué profilaxis antifúngica corresponde?',o:['Fluconazol','Posaconazol (cubre mohos)','Ninguna','Nistatina'],a:1,e:'El ensayo de Ullmann (NEJM 2007) mostró menos aspergilosis con posaconazol que con fluconazol en EICH.',r:'Ullmann AJ, NEJM 2007'}
,{id:'tp6',t:'Trasplante hematopoyético',q:'Paciente en tacrolimus que inicia voriconazol. ¿Qué haces con el tacrolimus?',o:['Nada','Reducir la dosis a ~1/3 y monitorizar niveles','Duplicarlo','Suspenderlo'],a:1,e:'Posaconazol obliga a una reducción similar. Con sirolimus, voriconazol está contraindicado por aumento extremo de niveles. Isavuconazol tiene una interacción más moderada.',r:'Ficha técnica Vfend; Noxafil'}
,{id:'tp7',t:'Trasplante hematopoyético',q:'¿Qué interacción hay entre letermovir y voriconazol?',o:['Ninguna','Letermovir reduce los niveles de voriconazol (induce CYP2C9/2C19)','Voriconazol reduce letermovir','Aumentan ambos'],a:1,e:'Si se combinan, conviene TDM de voriconazol o preferir posaconazol. Con ciclosporina, letermovir se reduce a 240 mg.',r:'Ficha técnica Prevymis'}
,{id:'tp8',t:'Trasplante hematopoyético',q:'CMV en un paciente antes del injerto que necesita tratamiento anticipado. ¿Qué antiviral prefieres?',o:['Ganciclovir','Foscarnet, para no agravar la mielosupresión','Aciclovir','Letermovir'],a:1,e:'Ganciclovir y valganciclovir son mielotóxicos y pueden retrasar el injerto. Foscarnet requiere hidratación y control de electrolitos.',r:'Ljungman P, Lancet Infect Dis 2019 (ECIL-7)'}
,{id:'tp9',t:'Trasplante hematopoyético',q:'Paciente con TPH alogénico y EICH crónica. ¿Qué profilaxis antibacteriana se recomienda?',o:['Ninguna','Contra bacterias encapsuladas (por ejemplo, penicilina o amoxicilina), además de vacunación','Levofloxacino de por vida','Vancomicina oral'],a:1,e:'La EICH crónica produce asplenia funcional e hipogammaglobulinemia, con riesgo de neumococo grave.',r:'Tomblyn M, BBMT 2009'}
,{id:'tp10',t:'Trasplante hematopoyético',q:'¿Cuándo pueden administrarse vacunas vivas después de un TPH?',o:['A los 3 meses','Al menos 24 meses post-TPH, sin EICH activa ni inmunosupresión (regla 2-1-8)','Nunca','Al mes'],a:1,e:'2 años desde el TPH, 1 año sin inmunosupresión y 8 meses desde la última IgIV. Las vacunas inactivadas se reinician a los 3–6 meses.',r:'Rubin LG, CID 2014 (IDSA vaccination)'}
,{id:'tp11',t:'Trasplante hematopoyético',q:'Cistitis hemorrágica después del día 30 de un TPH alogénico. ¿Qué virus sospechas primero?',o:['CMV','Poliomavirus BK','VZV','Influenza'],a:1,e:'BK es la causa más frecuente de cistitis hemorrágica tardía. Adenovirus es otra causa. Si es precoz (primeros días), pensar en ciclofosfamida.',r:'Cesaro S, J Antimicrob Chemother 2018 (ECIL-6)'}
,{id:'tp12',t:'Trasplante hematopoyético',q:'Encefalitis con compromiso límbico en las primeras semanas post TPH de sangre de cordón. ¿Qué virus sospechas?',o:['HSV-1','HHV-6','JC','Enterovirus'],a:1,e:'HHV-6 es típico en receptores de cordón. Se trata con foscarnet o ganciclovir.',r:'Ward KN, Haematologica 2019 (ECIL-7)'}
,{id:'tp13',t:'Trasplante hematopoyético',q:'Receptor de TPH proveniente de zona endémica, con eosinofilia. ¿Qué parásito debe descartarse antes de la inmunosupresión?',o:['Giardia','Strongyloides stercoralis (riesgo de hiperinfección)','Toxoplasma','Plasmodium'],a:1,e:'Serología y, si es positiva o hay alta sospecha, ivermectina antes del trasplante.',r:'Tomblyn M, BBMT 2009'}
,{id:'tp14',t:'Trasplante hematopoyético',q:'Receptor seropositivo para Toxoplasma en TPH alogénico. ¿Qué se recomienda?',o:['Nada','Profilaxis (TMP-SMX la cubre) o monitorización por PCR si no puede recibirla','Pirimetamina de por vida','Ganciclovir'],a:1,e:'La reactivación de Toxoplasma post-TPH es grave y suele ocurrir en los primeros meses.',r:'Martino R, BMT 2023 (ECIL)'}
,{id:'pr1',t:'Profilaxis médica',q:'¿Qué pacientes necesitan profilaxis de endocarditis en procedimientos dentales?',o:['Todos los que tienen un soplo','Solo alto riesgo: válvula protésica, endocarditis previa, ciertas cardiopatías congénitas y trasplante cardíaco con valvulopatía','Todos los portadores de marcapasos','Nadie'],a:1,e:'Amoxicilina 2 g VO 30–60 min antes. En alergia, azitromicina 500 mg o doxiciclina 100 mg; la AHA 2021 ya no recomienda clindamicina.',r:'Wilson WR, Circulation 2021 (AHA)'}
,{id:'pr2',t:'Profilaxis médica',q:'Paciente cirrótico con hemorragia digestiva alta. ¿Qué profilaxis indicas?',o:['Ninguna','Ceftriaxona 1 g/día por un máximo de 7 días','Vancomicina','Metronidazol'],a:1,e:'Reduce infecciones y mortalidad. Las quinolonas orales pueden usarse en cirrosis menos avanzada y baja resistencia.',r:'Baveno VII 2022'}
,{id:'pr3',t:'Profilaxis médica',q:'Contacto cercano de un caso de meningitis meningocócica. ¿Qué profilaxis es adecuada en adultos?',o:['Amoxicilina 7 días','Ciprofloxacino 500 mg dosis única (o rifampicina 600 mg c/12 h por 2 días, o ceftriaxona 250 mg IM)','Vacuna solamente','Ninguna'],a:1,e:'Se indica idealmente dentro de 24 h. En embarazo se prefiere ceftriaxona.',r:'CDC Meningococcal Disease'}
,{id:'pr4',t:'Profilaxis médica',q:'Paciente que inicia eculizumab o ravulizumab. ¿Qué es obligatorio?',o:['Nada','Vacunación antimeningocócica (ACWY y B) y profilaxis antibiótica según indicación','Profilaxis de Pneumocystis','Aciclovir'],a:1,e:'El bloqueo del complemento terminal aumenta ~1.000–2.000 veces el riesgo de enfermedad meningocócica, incluso vacunado.',r:'CDC MMWR 2017'}
,{id:'pr5',t:'Profilaxis médica',q:'Paciente esplenectomizado. ¿Qué medidas se recomiendan?',o:['Ninguna','Vacunas (neumococo, meningococo, Haemophilus) y antibiótico de reserva para fiebre; profilaxis diaria en niños y en algunos adultos','Fluconazol diario','Solo vacuna de influenza'],a:1,e:'Riesgo de sepsis fulminante por encapsulados. Se educa al paciente para tomar amoxicilina-clavulánico ante fiebre y consultar de inmediato.',r:'Rubin LG, NEJM 2014'}
,{id:'pr6',t:'Profilaxis médica',q:'Peritonitis bacteriana espontánea previa. ¿Qué profilaxis secundaria se usa?',o:['Ninguna','Norfloxacino o ciprofloxacino (o TMP-SMX) de forma prolongada','Rifaximina sola','Metronidazol'],a:1,e:'Se mantiene mientras persista la ascitis. La resistencia a quinolonas obliga a considerar alternativas según la epidemiología local.',r:'EASL 2018'}
,{id:'pr7',t:'Profilaxis médica',q:'Paciente con fiebre reumática previa sin carditis. ¿Qué profilaxis secundaria?',o:['Amoxicilina por 10 días','Penicilina benzatina 1.200.000 UI IM cada 4 semanas (cada 3 en alta incidencia), por 5 años o hasta los 21 años','Azitromicina semanal','Ninguna'],a:1,e:'Con carditis la duración se extiende (10 años o hasta los 40 años si hay valvulopatía residual).',r:'AHA 2009'}
,{id:'pr8',t:'Profilaxis médica',q:'Contacto domiciliario de un caso de tos convulsiva con un lactante en casa. ¿Qué profilaxis?',o:['Amoxicilina','Azitromicina por 5 días','Ciprofloxacino','No se indica'],a:1,e:'Azitromicina 500 mg el día 1 y 250 mg los días 2 a 5 en adultos. Alternativa: TMP-SMX. En menores de 1 mes se prefiere azitromicina.',r:'CDC Pertussis 2005'}
,{id:'pr9',t:'Profilaxis médica',q:'Mordedura de perro en la mano. ¿Qué profilaxis antibiótica?',o:['Ninguna','Amoxicilina-clavulánico por 3–5 días','Cefalexina','Ciprofloxacino'],a:1,e:'Cubre Pasteurella, Capnocytophaga, estreptococos, S. aureus y anaerobios. En alergia: doxiciclina o TMP-SMX + clindamicina o metronidazol. Evaluar rabia y tétanos.',r:'IDSA SSTI 2014'}
,{id:'pr10',t:'Profilaxis médica',q:'Mujer con ITU recurrente relacionada con la actividad sexual. ¿Qué opción tiene respaldo?',o:['Ciprofloxacino diario por años','Nitrofurantoína 50–100 mg o cefalexina en dosis única poscoital','Amoxicilina diaria','Nada'],a:1,e:'También existen medidas no antibióticas: estrógenos vaginales en posmenopausia y metenamina. Evitar quinolonas para profilaxis.',r:'AUA/CUA/SUFU 2022'}

,{id:'iv1',t:'IV a oral',q:'¿Qué pacientes incluyó el ensayo POET?',o:['Endocarditis derecha en usuarios de drogas IV','Endocarditis izquierda estable por estreptococos, E. faecalis, S. aureus o estafilococos coagulasa negativos, tras ≥10 días de terapia IV','Cualquier endocarditis, incluido SAMR y hongos','Endocarditis protésica precoz con absceso'],a:1,e:'Además, la ecocardiografía transesofágica antes de aleatorizar no debía mostrar absceso ni lesión con indicación quirúrgica. Si hubo cirugía valvular, se exigían ≥7 días de IV después de ella.',r:'Iversen K, NEJM 2019 (POET)'}
,{id:'iv2',t:'IV a oral',q:'¿Cómo se diseñaron los esquemas orales en POET?',o:['Un solo antibiótico de alta biodisponibilidad','Dos antibióticos orales de distinta familia, mecanismo y vía de metabolización, con medición de niveles plasmáticos','Amoxicilina sola en dosis altas','El mismo fármaco IV pasado a oral'],a:1,e:'La combinación evita una monoterapia de hecho si un fármaco se absorbe mal o se metaboliza rápido. Los esquemas se basaron en PK/PD y en las CIM de EUCAST; por ejemplo, amoxicilina con rifampicina o moxifloxacino, o linezolid con rifampicina.',r:'Iversen K, NEJM 2019 (POET)'}
,{id:'iv3',t:'IV a oral',q:'¿Cuál fue el resultado principal de POET a 6 meses?',o:['Oral fue inferior','Desenlace compuesto en 9,0% con oral vs 12,1% con IV: no inferior (margen de 10 puntos)','No hubo diferencia en estadía','IV tuvo menos mortalidad significativa'],a:1,e:'El compuesto incluyó mortalidad, cirugía cardíaca no planificada, embolias y recaída de bacteriemia. Diferencia 3,1 puntos (IC 95% −3,4 a 9,6).',r:'Iversen K, NEJM 2019 (POET)'}
,{id:'iv4',t:'IV a oral',q:'En POET, ¿cuánto duró la hospitalización después de la aleatorización?',o:['Igual en ambos grupos','Mediana de 3 días con oral vs 19 días con IV','10 vs 12 días','No se midió'],a:1,e:'El 80% del grupo oral se trató total o parcialmente ambulatorio, con controles 2–3 veces por semana.',r:'Iversen K, NEJM 2019 (POET)'}
,{id:'iv5',t:'IV a oral',q:'¿Cuál de estos pacientes con endocarditis NO habría sido candidato a POET?',o:['Estreptococo viridans, 14 días de IV, afebril, PCR en descenso','Absceso perivalvular en la ecocardiografía transesofágica','E. faecalis, 12 días de IV, operado hace 10 días','SAMS, 11 días de IV, hemocultivos negativos'],a:1,e:'También se excluyeron fiebre, marcadores inflamatorios altos, obesidad con IMC >40, absorción digestiva dudosa e inmunosupresión.',r:'Iversen K, NEJM 2019 (POET)'}
,{id:'iv6',t:'IV a oral',q:'¿Qué limitación importante tiene POET para tu práctica?',o:['Fue muy pequeño, con 40 pacientes','No incluyó ningún SAMR, y se hizo en Dinamarca con controles ambulatorios frecuentes y medición de niveles','Solo incluyó prótesis','Usó placebo'],a:1,e:'Además fue abierto y la mayoría tenía estreptococos. Extrapolarlo exige un sistema de seguimiento y TDM similar.',r:'Iversen K, NEJM 2019 (POET)'}
,{id:'iv7',t:'IV a oral',q:'¿Qué mostró el seguimiento a 5 años de POET?',o:['Más mortalidad con oral','El desenlace compuesto fue menor con tratamiento oral parcial (26,4% vs 38,2%)','Sin datos a largo plazo','Más recaídas con oral'],a:1,e:'El beneficio a largo plazo reforzó que el paso a oral en pacientes estables es seguro.',r:'Pries-Heje MM, NEJM 2022'}
,{id:'iv8',t:'IV a oral',q:'¿Qué evaluó el ensayo OVIVA?',o:['Duración de antibióticos en osteomielitis','Terapia oral vs IV durante las primeras 6 semanas de infecciones osteoarticulares complejas, iniciando dentro de 7 días post cirugía','Rifampicina vs placebo','Antibióticos locales'],a:1,e:'1.054 adultos en 26 centros del Reino Unido: osteomielitis, artritis séptica, infección protésica, de material de osteosíntesis y espondilodiscitis.',r:'Li HK, NEJM 2019 (OVIVA)'}
,{id:'iv9',t:'IV a oral',q:'¿Cuál fue el resultado principal de OVIVA al año?',o:['Oral inferior','Falla definitiva en 13,2% con oral vs 14,6% con IV: no inferior (margen de 7,5 puntos)','IV superior en prótesis','Sin diferencias en nada'],a:1,e:'Diferencia −1,4 puntos (IC 90% −4,9 a 2,2). Los análisis por protocolo y de sensibilidad fueron concordantes.',r:'Li HK, NEJM 2019 (OVIVA)'}
,{id:'iv10',t:'IV a oral',q:'¿Qué ventaja de seguridad mostró la vía oral en OVIVA?',o:['Menos C. difficile significativo','Menos complicaciones del catéter: 1,0% vs 9,4%','Menos mortalidad','Menos alergias'],a:1,e:'También menos discontinuación precoz de la estrategia (12,8% vs 18,9%) y menor estadía hospitalaria (11 vs 14 días).',r:'Li HK, NEJM 2019 (OVIVA)'}
,{id:'iv11',t:'IV a oral',q:'En OVIVA, ¿cuáles fueron los antibióticos orales planificados con más frecuencia (sin contar rifampicina)?',o:['Betalactámicos orales','Quinolonas','Linezolid','Tetraciclinas'],a:1,e:'Los elegía un infectólogo según sensibilidad, biodisponibilidad, alergias e interacciones. La rifampicina adyuvante estaba permitida en ambos grupos y no cambió el resultado.',r:'Li HK, NEJM 2019 (OVIVA)'}
,{id:'iv12',t:'IV a oral',q:'¿Qué proporción de pacientes de OVIVA tenía infección asociada a material de osteosíntesis o prótesis?',o:['Ninguno','~61%','5%','100%'],a:1,e:'El beneficio se mantuvo con retención de implante y en prótesis. Los organismos más frecuentes fueron S. aureus (38%) y estafilococos coagulasa negativos (27%).',r:'Li HK, NEJM 2019 (OVIVA)'}
,{id:'iv13',t:'IV a oral',q:'¿Qué pacientes podían entrar al ensayo SABATO?',o:['Toda bacteriemia por S. aureus','Bacteriemia por S. aureus de bajo riesgo: 5–7 días de IV adecuada, hemocultivos de control negativos a las 24–96 h y sin signos de complicación','Solo SAMR','Endocarditis por S. aureus'],a:1,e:'Exclusiones: foco profundo, shock séptico, bacteriemia >72 h, fiebre en los 2 días previos, catéter no retirado en 4 días, prótesis valvular, usuarios de drogas IV e inmunosupresión grave.',r:'Kaasch AJ, Lancet Infect Dis 2024 (SABATO)'}
,{id:'iv14',t:'IV a oral',q:'¿Qué esquema oral se usó primero en SABATO?',o:['Amoxicilina-clavulánico','TMP-SMX 160/800 mg c/12 h; si no era posible, clindamicina 600 mg c/8 h (SAMS) o linezolid 600 mg c/12 h (SAMR)','Ciprofloxacino + rifampicina','Cefadroxilo'],a:1,e:'Completaban 14 días totales de tratamiento. El 58% recibió TMP-SMX.',r:'Kaasch AJ, Lancet Infect Dis 2024 (SABATO)'}
,{id:'iv15',t:'IV a oral',q:'¿Cuál fue el resultado principal de SABATO?',o:['Oral inferior','Complicaciones a 90 días en 13% con oral vs 12% con IV: no inferior (margen de 10 puntos)','Oral redujo la mortalidad','No se pudo concluir'],a:1,e:'Diferencia 0,7 puntos (IC 95% −7,8 a 9,1). Estadía: 12 vs 16 días. Menos complicaciones de la vía IV (9% vs 17%, no significativo).',r:'Kaasch AJ, Lancet Infect Dis 2024 (SABATO)'}
,{id:'iv16',t:'IV a oral',q:'De 5.063 pacientes con bacteriemia por S. aureus evaluados en SABATO, ¿cuántos fueron aleatorizados?',o:['~4.000','213 (~4%)','1.000','50%'],a:1,e:'El bajo riesgo es un subgrupo pequeño. Clasificarlo bien es lo más difícil: ecocardiograma, hemocultivos de control y retiro del foco.',r:'Kaasch AJ, Lancet Infect Dis 2024 (SABATO)'}
,{id:'iv17',t:'IV a oral',q:'¿Qué señal de alerta reportó SABATO en el grupo oral?',o:['Ninguna','Las 2 muertes atribuibles a S. aureus ocurrieron en el grupo oral (infección diseminada por catéter); la mortalidad a 90 días fue numéricamente mayor (no significativa)','Más SAMR resistente','Más C. difficile'],a:1,e:'Refuerza la necesidad de seguimiento estrecho después del paso a oral y de reevaluar si reaparecen fiebre o síntomas.',r:'Kaasch AJ, Lancet Infect Dis 2024 (SABATO)'}
,{id:'iv18',t:'IV a oral',q:'¿Cuál de estos antimicrobianos tiene biodisponibilidad oral cercana al 100%?',o:['Amoxicilina','Cefuroxima axetil','Linezolid','Vancomicina oral'],a:2,e:'También ~90–100%: quinolonas, TMP-SMX, metronidazol, rifampicina, fluconazol, doxiciclina y clindamicina. Los betalactámicos orales tienen menor biodisponibilidad y suelen necesitar dosis altas.',r:'Cyriac JM, J Pharmacol Pharmacother 2014'}
,{id:'iv19',t:'IV a oral',q:'En un ensayo de no inferioridad, ¿cuándo se concluye que el tratamiento nuevo no es inferior?',o:['Cuando p <0,05 a favor del nuevo','Cuando el límite del intervalo de confianza que favorece al estándar no cruza el margen predefinido','Cuando las tasas son idénticas','Cuando el IC incluye cero'],a:1,e:'En POET el límite superior fue 9,6 con margen 10; en OVIVA, 2,2 con margen 7,5. Que el IC incluya cero no impide concluir no inferioridad.',r:'CONSORT para no inferioridad, JAMA 2012'}
,{id:'iv20',t:'IV a oral',q:'¿Por qué en no inferioridad importa revisar también el análisis por protocolo?',o:['No importa','Porque los cruces y abandonos en el análisis por intención de tratar acercan los grupos y favorecen concluir no inferioridad','Porque siempre da distinto','Porque reemplaza al ITT'],a:1,e:'Si ITT y por protocolo concuerdan, como en POET, OVIVA y SABATO, la conclusión es más sólida.',r:'Piaggio G, JAMA 2012'}

,{id:'g1',t:'Resistencia BGN',q:'¿Cómo define la revisión la resistencia "difícil de tratar" (DTR)?',o:['Resistencia a 3 o más familias','Resistencia a todos los betalactámicos tradicionales (incluidos carbapenémicos) y a las fluoroquinolonas','Resistencia a colistina','Resistencia a todos los antibióticos'],a:1,e:'Es más útil que MDR o XDR porque identifica a quienes solo les quedan los fármacos nuevos. Se aplica sobre todo a P. aeruginosa.',r:'Tamma PD, NEJM 2026'}
,{id:'g2',t:'Resistencia BGN',q:'¿Por qué es difícil una definición de resistencia basada en el mecanismo?',o:['Porque no existen mecanismos conocidos','Porque los determinantes varían por especie: las BLEE son comunes en E. coli y raras en P. aeruginosa, y la actividad intrínseca también cambia','Porque todos los BGN tienen los mismos genes','Porque solo importa el fenotipo'],a:1,e:'Por eso también los puntos de corte cambian según el organismo. Por ejemplo, meropenem es sensible con CIM ≤1 en E. coli y ≤2 en P. aeruginosa (CLSI).',r:'Tamma PD, NEJM 2026'}
,{id:'g3',t:'Resistencia BGN',q:'P. aeruginosa resistente a meropenem. ¿Qué proporción sigue sensible a cefepime o piperacilina-tazobactam?',o:['Ninguna','Aproximadamente la mitad','99%','10%'],a:1,e:'Ser resistente al fármaco de mayor espectro no implica resistencia a los de menor espectro. Por eso se debe mirar el antibiograma completo antes de usar un fármaco nuevo.',r:'Tamma PD, NEJM 2026'}
,{id:'g4',t:'Resistencia BGN',q:'¿Cuáles son las 4 vías principales de resistencia en bacilos gramnegativos?',o:['Mutación, transducción, conjugación y transformación','Menor permeabilidad (porinas), eflujo activo, modificación del blanco e inactivación enzimática','Biofilm, cápsula, esporas y flagelos','Solo betalactamasas'],a:1,e:'Además hay respuestas adaptativas: estrés global, reprogramación metabólica, persistencia y biofilm.',r:'Tamma PD, NEJM 2026'}
,{id:'g5',t:'Resistencia BGN',q:'¿Qué hace la pérdida de la porina OmpK36 en K. pneumoniae?',o:['Solo afecta a la colistina','Reduce la entrada de varias cefalosporinas, carbapenémicos y combinaciones betalactámico-inhibidor','Aumenta la sensibilidad','Solo afecta a las quinolonas'],a:1,e:'En P. aeruginosa, en cambio, la alteración de OprD restringe específicamente a los carbapenémicos (más al imipenem).',r:'Tamma PD, NEJM 2026'}
,{id:'g6',t:'Resistencia BGN',q:'¿Por qué el cefiderocol puede entrar aunque falten las porinas, y cómo puede perder actividad?',o:['Atraviesa la membrana por difusión; pierde actividad por betalactamasas','Usa los transportadores de hierro (sideróforo); mutaciones en receptores dependientes de TonB reducen su entrada','Entra por bombas de eflujo; pierde actividad por porinas','No pierde actividad nunca'],a:1,e:'Incluso esta estrategia de "caballo de Troya" es vulnerable a la adaptación bacteriana.',r:'Tamma PD, NEJM 2026'}
,{id:'g7',t:'Resistencia BGN',q:'¿Qué bomba de eflujo de P. aeruginosa afecta a piperacilina-tazobactam, cefepime, meropenem y fluoroquinolonas?',o:['AcrAB-TolC','MexAB-OprM','AdeABC','TetA'],a:1,e:'AcrAB-TolC es de E. coli (ampicilina, cefazolina, quinolonas, tetraciclinas). AdeABC es de Acinetobacter (aminoglucósidos, quinolonas, tetraciclinas).',r:'Tamma PD, NEJM 2026'}
,{id:'g8',t:'Resistencia BGN',q:'Las modificaciones de PBP3 en Enterobacterales y P. aeruginosa afectan a varios betalactámicos. ¿Qué estrategia sugieren los datos in vitro?',o:['Subir la dosis de un solo betalactámico','Combinar dos betalactámicos para inhibir varias PBP de forma complementaria','Usar solo aminoglucósidos','Usar tetraciclinas'],a:1,e:'Afectan a ceftazidima, cefepime, aztreonam, cefiderocol, ceftazidima-avibactam y ceftolozano-tazobactam.',r:'Tamma PD, NEJM 2026'}
,{id:'g9',t:'Resistencia BGN',q:'¿Qué familia representa más del 95% de las BLEE?',o:['TEM','SHV','CTX-M','OXA'],a:2,e:'El clon de E. coli ST131 explica gran parte de la diseminación comunitaria. E. coli y K. pneumoniae suman más del 90% de los aislados BLEE.',r:'Tamma PD, NEJM 2026'}
,{id:'g10',t:'Resistencia BGN',q:'¿Qué proporción de viajeros a zonas endémicas vuelve colonizada por Enterobacterales BLEE?',o:['<1%','20–35% (hasta 70% después de viajar al sur de Asia)','100%','5%'],a:1,e:'La colonización suele resolverse, pero ~10% sigue colonizado a los 12 meses. Relevante para la historia de viajes al elegir tratamiento empírico.',r:'Tamma PD, NEJM 2026'}
,{id:'g11',t:'Resistencia BGN',q:'¿Qué ensayo llevó a preferir carbapenémicos para infección invasiva por Enterobacterales BLEE?',o:['STOP-IT','MERINO: se detuvo antes por más mortalidad con piperacilina-tazobactam','ATTACK','CREDIBLE-CR'],a:1,e:'Una vez estable, se puede pasar a fluoroquinolona o TMP-SMX según sensibilidad, sitio y efectos adversos.',r:'Tamma PD, NEJM 2026'}
,{id:'g12',t:'Resistencia BGN',q:'Según la revisión, ¿qué fármacos se prefieren para cistitis no complicada por Enterobacterales BLEE?',o:['Ertapenem o meropenem','Nitrofurantoína o TMP-SMX','Ceftriaxona','Piperacilina-tazobactam'],a:1,e:'La Tabla 2 también incluye aminoglucósido IV en dosis única, pivmecilinam, gepotidacina y sulopenem-probenecid.',r:'Tamma PD, NEJM 2026'}
,{id:'g13',t:'Resistencia BGN',q:'¿Qué dice la revisión sobre la duración del tratamiento en infecciones resistentes?',o:['Siempre más larga','La resistencia por sí sola no justifica tratar más: la duración debe ser la misma que con el organismo sensible','Mínimo 21 días','Depende del antibiótico'],a:1,e:'Junto con el control del foco y la optimización de dosis, es una de las principales medidas para frenar la resistencia.',r:'Tamma PD, NEJM 2026'}
,{id:'g14',t:'Resistencia BGN',q:'¿Qué carbapenemasa explica ~80% de los Enterobacterales productores de carbapenemasa en EE. UU. y también es muy prevalente en Sudamérica?',o:['NDM','KPC','OXA-48','IMP'],a:1,e:'Se diseminó por expansión clonal (ST258) y por plásmidos con blaKPC. Primera descripción: Carolina del Norte, 1996.',r:'Tamma PD, NEJM 2026'}
,{id:'g15',t:'Resistencia BGN',q:'¿Qué diferencia epidemiológica tiene NDM respecto de KPC?',o:['NDM se disemina solo por un clon','NDM tiene mayor diversidad de linajes, porque se difunde sobre todo por transferencia horizontal de genes','NDM no existe en Enterobacterales','No hay diferencias'],a:1,e:'NDM es dependiente de zinc. En EE. UU. aumentó ~461% entre 2019 y 2023, con K. pneumoniae como principal especie.',r:'Tamma PD, NEJM 2026'}
,{id:'g16',t:'Resistencia BGN',q:'Brote de 2022–2023 en EE. UU. por lágrimas artificiales contaminadas. ¿Qué microorganismo y enzima?',o:['K. pneumoniae KPC','P. aeruginosa productora de VIM','E. coli NDM','Acinetobacter OXA-23'],a:1,e:'81 infecciones en 18 estados; 22% terminó en enucleación y 7% murió.',r:'Tamma PD, NEJM 2026'}
,{id:'g17',t:'Resistencia BGN',q:'¿Por qué las infecciones por productores de IMP tienen menor mortalidad que las por NDM o VIM?',o:['Porque IMP no hidroliza carbapenémicos','Retienen más sensibilidad a fármacos tradicionales, requieren alta expresión para dar resistencia (costo de fitness) y sobreviven peor con poco zinc','Porque solo están en la comunidad','Porque son grampositivos'],a:1,e:'Todas son metalo-betalactamasas, pero no se comportan igual en la clínica.',r:'Tamma PD, NEJM 2026'}
,{id:'g18',t:'Resistencia BGN',q:'¿Qué betalactámico nuevo tiene actividad esperada SOLO contra Enterobacterales BLEE, no contra carbapenemasas ni P. aeruginosa DTR?',o:['Cefiderocol','Cefepime-enmetazobactam','Ceftazidima-avibactam','Cefepime-zidebactam'],a:1,e:'Enmetazobactam es un inhibidor de betalactamasas de clase A tipo BLEE. Es una alternativa que ahorra carbapenémicos en ITU complicada por BLEE.',r:'Tamma PD, NEJM 2026'}
,{id:'g19',t:'Resistencia BGN',q:'¿Qué dos betalactámicos de la matriz tienen actividad esperada contra TODOS los grupos (BLEE, KPC, MBL, OXA-48, P. aeruginosa DTR y CRAB)?',o:['Ceftazidima-avibactam y meropenem-vaborbactam','Cefiderocol y cefepime-zidebactam','Imipenem-relebactam y aztreonam-avibactam','Ceftolozano-tazobactam y sulbactam-durlobactam'],a:1,e:'Por eso la revisión recomienda reservarlos para cuando la resistencia o la toxicidad impiden usar otros betalactámicos.',r:'Tamma PD, NEJM 2026'}
,{id:'g20',t:'Resistencia BGN',q:'¿Qué esquemas preferidos indica la revisión para Enterobacterales productores de NDM?',o:['Ceftazidima-avibactam sola','Aztreonam-avibactam, cefepime-zidebactam o cefiderocol','Meropenem-vaborbactam','Imipenem-relebactam'],a:1,e:'Si no hay aztreonam-avibactam: ceftazidima-avibactam 2,5 g c/8 h + aztreonam 2 g c/8 h, ambos en 3 h y administrados simultáneamente.',r:'Tamma PD, NEJM 2026'}
,{id:'g21',t:'Resistencia BGN',q:'¿Qué tratamiento prefiere la revisión para Enterobacterales productores de OXA-48?',o:['Meropenem-vaborbactam','Ceftazidima-avibactam','Imipenem-relebactam','Ertapenem'],a:1,e:'Vaborbactam y relebactam no inhiben OXA-48. Alternativas: aztreonam-avibactam, cefepime-zidebactam y cefiderocol.',r:'Tamma PD, NEJM 2026'}
,{id:'g22',t:'Resistencia BGN',q:'¿Por qué las tetraciclinas nuevas (tigeciclina, eravaciclina) no son buena opción para bacteriemia o ITU por CRE?',o:['Porque no cubren CRE','Porque su enorme distribución tisular deja bajas concentraciones en suero y orina','Porque son nefrotóxicas','Porque son de uso oral'],a:1,e:'Mantienen actividad in vitro sin importar la carbapenemasa, pero su perfil PK limita su uso clínico.',r:'Tamma PD, NEJM 2026'}
,{id:'g23',t:'Resistencia BGN',q:'¿Qué dos agentes son los únicos con actividad contra P. aeruginosa productora de VIM?',o:['Ceftazidima-avibactam y ceftolozano-tazobactam','Cefepime-zidebactam y cefiderocol','Imipenem-relebactam y meropenem-vaborbactam','Colistina y amikacina'],a:1,e:'Como VIM es rara en EE. UU., la revisión dice que no se necesita cubrirla salvo confirmación o fuerte sospecha. En Latinoamérica y el sur de Europa ha aumentado.',r:'Tamma PD, NEJM 2026'}
,{id:'g24',t:'Resistencia BGN',q:'P. aeruginosa DTR en tratamiento con ceftolozano-tazobactam. ¿Qué precaución da la revisión?',o:['Ninguna','Emerge resistencia durante el tratamiento en al menos 20% de los casos: estudiar sensibilidad en aislados posteriores','Siempre combinar con colistina','Cambiar a la semana'],a:1,e:'Ocurre con ceftolozano-tazobactam y ceftazidima-avibactam. La combinación con quinolonas, aminoglucósidos o polimixinas, o los inhalados adyuvantes en NAV, no mostró beneficio en supervivencia.',r:'Tamma PD, NEJM 2026'}
,{id:'g25',t:'Resistencia BGN',q:'¿Qué dosis de sulbactam se necesita si se usa ampicilina-sulbactam para CRAB (por no tener sulbactam-durlobactam)?',o:['1,5 g/día','Al menos 9 g/día de sulbactam (por ejemplo, 27 g/día de ampicilina-sulbactam), combinado con otro agente activo','3 g/día','Sulbactam no sirve para Acinetobacter'],a:1,e:'El segundo agente puede ser minociclina, polimixina B, tigeciclina en dosis altas o cefiderocol. Lo preferido es sulbactam-durlobactam + imipenem o meropenem.',r:'Tamma PD, NEJM 2026'}
,{id:'g26',t:'Resistencia BGN',q:'¿Qué proporción de Acinetobacter baumannii resistente a carbapenémicos produce enzimas OXA (por ejemplo, OXA-23)?',o:['~10%','Más del 90%','50%','Ninguno'],a:1,e:'Por eso los inhibidores de clase A (avibactam, vaborbactam, relebactam) no rescatan a los carbapenémicos en CRAB. Durlobactam sí inhibe las OXA de Acinetobacter.',r:'Tamma PD, NEJM 2026'}
,{id:'g27',t:'Resistencia BGN',q:'¿Qué alternativa no antibiótica tiene más avance según la revisión?',o:['Vacunas universales','Terapia con bacteriófagos','Probióticos','Antiinflamatorios'],a:1,e:'Los fagos son específicos de especie y activos tanto contra cepas sensibles como resistentes. También se estudian anticuerpos, lisinas y antivirulencia.',r:'Tamma PD, NEJM 2026'}

,{id:'ct1',t:'C/T vs CZA',q:'¿Qué diseño tuvo el estudio CACTUS?',o:['Ensayo aleatorizado doble ciego','Observacional retrospectivo y pareado en 28 hospitales de EE. UU. (2016–2023)','Estudio in vitro','Metaanálisis'],a:1,e:'Pareó 1:1 por centro, tipo de infección, sepsis o shock y tiempo al inicio del fármaco (≤72 h o >72 h). Al no ser aleatorizado, puede tener confusión residual.',r:'Shields RK, Lancet Infect Dis 2025 (CACTUS)'}
,{id:'ct2',t:'C/T vs CZA',q:'¿Qué pacientes incluyó CACTUS?',o:['Cistitis por Pseudomonas','420 adultos (210 por grupo) con neumonía (83%) o bacteriemia (17%) por P. aeruginosa multirresistente, tratados >48 h','Solo fibrosis quística','Infecciones de piel'],a:1,e:'Pacientes graves: 80% en UCI, 70% en ventilación mecánica y 40% con vasopresores. Excluyó fibrosis quística, focos que requieren tratamientos largos (osteomielitis, endocarditis, empiema) y aislados no sensibles al fármaco recibido.',r:'Shields RK, Lancet Infect Dis 2025 (CACTUS)'}
,{id:'ct3',t:'C/T vs CZA',q:'¿Cuál fue el resultado principal de CACTUS?',o:['Sin diferencias','Éxito clínico a 30 días de 61% con ceftolozano-tazobactam vs 52% con ceftazidima-avibactam (OR ajustado 2,07)','Ceftazidima-avibactam fue superior','Más mortalidad con ceftolozano-tazobactam'],a:1,e:'El éxito clínico combinaba sobrevida, resolución de síntomas, completar el tratamiento sin cambios y ausencia de recurrencia por P. aeruginosa.',r:'Shields RK, Lancet Infect Dis 2025 (CACTUS)'}
,{id:'ct4',t:'C/T vs CZA',q:'En CACTUS, ¿en qué subgrupo se concentró la ventaja de ceftolozano-tazobactam?',o:['Bacteriemia','Neumonía: 63% vs 51% de éxito (OR ajustado 2,34)','Infección urinaria','No hubo subgrupos'],a:1,e:'En bacteriemia no hubo diferencia (51% vs 57%). La ventaja en neumonía se explicó sobre todo por menos recurrencias.',r:'Shields RK, Lancet Infect Dis 2025 (CACTUS)'}
,{id:'ct5',t:'C/T vs CZA',q:'¿Qué pasó con la mortalidad en CACTUS?',o:['Menor con ceftolozano-tazobactam','Sin diferencias a 30 días (23% vs 24%) ni a 90 días (38% vs 37%)','Mayor con ceftolozano-tazobactam','No se midió'],a:1,e:'La mortalidad fue alta en ambos grupos, reflejo de lo grave que era la población.',r:'Shields RK, Lancet Infect Dis 2025 (CACTUS)'}
,{id:'ct6',t:'C/T vs CZA',q:'¿Con qué frecuencia apareció resistencia durante o después del tratamiento en CACTUS?',o:['<5%','~22–23% con ambos fármacos','Solo con ceftazidima-avibactam','Nunca'],a:1,e:'Coincide con la advertencia de la revisión del NEJM: repetir la sensibilidad en aislados posteriores.',r:'Shields RK, Lancet Infect Dis 2025 (CACTUS)'}
,{id:'ct7',t:'C/T vs CZA',q:'¿Qué error de dosificación fue más frecuente con ceftolozano-tazobactam en CACTUS?',o:['Dosis excesivas','Usar 1,5 g c/8 h en neumonía, cuando la dosis para neumonía es 3 g c/8 h','No dar dosis de carga','Infundir en bolo'],a:1,e:'La dosis subóptima fue más frecuente con ceftolozano-tazobactam (20% vs 7%) y aun así tuvo mejor desenlace. Es un punto de intervención PROA muy concreto.',r:'Shields RK, Lancet Infect Dis 2025 (CACTUS)'}
,{id:'ct8',t:'C/T vs CZA',q:'¿Qué ventajas farmacológicas de ceftolozano-tazobactam frente a Pseudomonas plantea CACTUS?',o:['Ninguna','Más estabilidad frente a AmpC, menos afectado por bombas de eflujo, mejor unión a PBP y concentraciones en ELF >4 mg/L durante todo el intervalo','Cubre metalo-betalactamasas','Se da una vez al día'],a:1,e:'En cambio, ceftazidima-avibactam llega al ELF en ~30% de su concentración sérica, lo que podría importar en neumonía.',r:'Shields RK, Lancet Infect Dis 2025 (CACTUS)'}
,{id:'ct9',t:'C/T vs CZA',q:'¿Qué mostraron REPROVE y ASPECT-NP en el subgrupo con P. aeruginosa?',o:['Ambos superiores a meropenem','Curación numéricamente menor con ceftazidima-avibactam vs meropenem (64% vs 77%); con ceftolozano-tazobactam fue similar a meropenem (57% vs 60%)','No incluyeron Pseudomonas','Ceftazidima-avibactam fue claramente superior'],a:1,e:'Son subgrupos pequeños sin significancia, pero alimentaron la hipótesis que CACTUS quiso probar.',r:'Shields RK, Lancet Infect Dis 2025 (CACTUS)'}
,{id:'ct10',t:'C/T vs CZA',q:'¿Qué limitación debes considerar al leer CACTUS?',o:['Ninguna','Es observacional, sin aleatorización, y fue financiado por el fabricante de ceftolozano-tazobactam','Muestra de 20 pacientes','Solo pediatría'],a:1,e:'El pareo y el ajuste reducen el sesgo, pero no eliminan la confusión no medida.',r:'Shields RK, Lancet Infect Dis 2025 (CACTUS)'}
