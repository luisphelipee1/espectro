<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b2a86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Espectro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}</style>
</head><body>
<title>Espectro ID Pharm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app de una columna para teléfono, contenido arriba y barra de pestañas fija abajo. Paleta de tinción de Gram: cristal violeta + safranina. */
:root{
  --bg:#f5f3f9; --surface:#ffffff; --surface2:#efebf6; --ink:#1d1530; --muted:#6a6280; --line:#e2dcec;
  --violet:#5b2a86; --violet-soft:#ece3f6; --safranin:#d0456a; --safranin-soft:#fbe6ec;
  --good:#1d8a5a; --good-soft:#e2f4ea; --bad:#c43a3a; --bad-soft:#fbe7e7; --gold:#b9831a;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#120d1b; --surface:#1d1628; --surface2:#271e35; --ink:#efeaf7; --muted:#a69ebb; --line:#30263f;
  --violet:#b68ce8; --violet-soft:#2c2140; --safranin:#f07b9a; --safranin-soft:#3a1d29;
  --good:#4fc48b; --good-soft:#163024; --bad:#f06b6b; --bad-soft:#3a1a1c; --gold:#efbf5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120d1b; --surface:#1d1628; --surface2:#271e35; --ink:#efeaf7; --muted:#a69ebb; --line:#30263f;
  --violet:#b68ce8; --violet-soft:#2c2140; --safranin:#f07b9a; --safranin-soft:#3a1d29;
  --good:#4fc48b; --good-soft:#163024; --bad:#f06b6b; --bad-soft:#3a1a1c; --gold:#efbf5c; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
.modal[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--safranin);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--violet) 0 38%,transparent 39%),radial-gradient(circle at 70% 65%,var(--safranin) 0 30%,transparent 31%);border:2px solid var(--line);display:inline-block}
.chips{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.9rem}
.chip svg{width:16px;height:16px}

/* hero rank */
.rank{background:var(--violet);color:#fff;border-radius:22px;padding:20px;position:relative;overflow:hidden}
:root[data-theme="dark"] .rank{background:#3b2160}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rank{background:#3b2160}}
.rank::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,rgba(255,255,255,.18) 0 6px,transparent 7px),radial-gradient(circle at 60% 30%,rgba(255,255,255,.14) 0 4px,transparent 5px),radial-gradient(circle at 30% 65%,rgba(240,123,154,.55) 0 9px,transparent 10px),radial-gradient(circle at 70% 70%,rgba(255,255,255,.12) 0 5px,transparent 6px),radial-gradient(circle,rgba(255,255,255,.08) 0 60%,transparent 61%);
  border:2px solid rgba(255,255,255,.18)}
.rank .eyebrow{color:rgba(255,255,255,.75)}
.rank h1{color:#fff;margin:4px 0 2px;max-width:80%}
.rank small{opacity:.85}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:14px}
.bar > span{display:block;height:100%;background:#f7a8bd;border-radius:99px;transition:width .6s ease}
.rank .meta{display:flex;justify-content:space-between;margin-top:6px;font-size:.85rem;opacity:.9}

/* daily plate */
.daily{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.plate{width:74px;height:74px;position:relative}
.plate svg{width:100%;height:100%;transform:rotate(-90deg)}
.plate b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:1.05rem}

/* mode tiles */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;min-height:118px;transition:transform .15s}
.mode:active{transform:scale(.97)}
.mode .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--violet-soft);color:var(--violet)}
.mode.alt .ic{background:var(--safranin-soft);color:var(--safranin)}
.mode .ic svg{width:20px;height:20px}
.mode p{font-size:.85rem;color:var(--muted)}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.72rem;line-height:1.2;color:var(--muted)}
.badge .seal{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:2px dashed var(--line);color:var(--muted)}
.badge.on{color:var(--ink)}
.badge.on .seal{background:var(--safranin-soft);border:2px solid var(--safranin);color:var(--safranin)}
.badge .seal svg{width:24px;height:24px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{font-family:var(--f-display);font-size:1.3rem;display:block}
.stat span{font-size:.75rem;color:var(--muted)}

/* quiz */
.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.back svg{width:18px;height:18px}
.progress{flex:1;height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress span{display:block;height:100%;background:var(--violet);transition:width .3s}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--violet);background:var(--violet-soft);padding:3px 9px;border-radius:99px}
.qtext{font-family:var(--f-display);font-size:1.25rem;font-weight:700;line-height:1.3;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);display:flex;gap:12px;align-items:flex-start;transition:border-color .15s,background .15s}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--surface2);font-weight:700;font-size:.85rem}
.opt:hover:not([disabled]){border-color:var(--violet)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .k{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.explain{border-radius:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-left-width:5px}
.explain.ok{border-left-color:var(--good)}
.explain.no{border-left-color:var(--bad)}
.explain h3{margin-bottom:4px}
.ref{margin-top:8px;font-size:.8rem;color:var(--muted)}
.btn{border:none;border-radius:14px;padding:14px 18px;font-weight:700;background:var(--violet);color:var(--bg);font-size:1rem;width:100%}
:root .btn{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#120d1b}}
:root[data-theme="dark"] .btn{color:#120d1b}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn-row{display:flex;gap:10px}

/* swipe */
.deck{position:relative;height:340px;touch-action:none;user-select:none}
.card{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 30px -18px rgba(40,10,70,.45);will-change:transform}
.card.under{transform:scale(.95) translateY(12px);opacity:.6}
.card .stmt{font-family:var(--f-display);font-size:1.35rem;font-weight:700;line-height:1.3;text-wrap:pretty}
.stamp{position:absolute;top:22px;padding:4px 12px;border:3px solid;border-radius:10px;font-family:var(--f-display);font-weight:800;font-size:1.2rem;opacity:0;letter-spacing:.04em}
.stamp.v{right:20px;color:var(--good);transform:rotate(10deg)}
.stamp.f{left:20px;color:var(--bad);transform:rotate(-10deg)}
.hint{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.swbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swb{padding:14px;border-radius:14px;font-weight:700;border:2px solid;background:var(--surface);display:flex;align-items:center;justify-content:center;gap:8px}
.swb.f{color:var(--bad);border-color:var(--bad)}
.swb.v{color:var(--good);border-color:var(--good)}
.swb svg{width:18px;height:18px}

/* cases */
.caselist{display:flex;flex-direction:column;gap:10px}
.caseitem{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.caseitem p{font-size:.85rem;color:var(--muted);grid-column:1}
.caseitem .st{grid-row:1 / span 2;grid-column:2;font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.caseitem .st.done{background:var(--good-soft);color:var(--good)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:.95rem}
.chart .vit{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:.82rem}
.chart .vit span{font-family:var(--f-mono)}

/* fichas */
.search{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.drug{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.drug > button{width:100%;text-align:left;background:none;border:none;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.drug > button small{color:var(--muted);display:block;font-size:.8rem}
.drug > button svg{width:18px;height:18px;flex:none;transition:transform .2s;color:var(--muted)}
.drug.open > button svg{transform:rotate(180deg)}
.drug dl{margin:0;padding:0 16px 16px;display:grid;gap:10px}
.drug dt{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--violet);font-weight:700}
.drug dd{margin:2px 0 0;font-size:.92rem}
.drug dd.dose{font-family:var(--f-mono);font-size:.85rem;background:var(--surface2);padding:8px 10px;border-radius:10px;line-height:1.55}
.foot{font-size:.78rem;color:var(--muted);text-align:center;margin-top:8px}

.topics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.topic{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.topic span{font-size:.78rem;color:var(--muted)}
.topic.locked{opacity:.55;cursor:not-allowed;border-style:dashed}
.topic.done{border-color:var(--good)}
.topic.done span{color:var(--good)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:.85rem;font-weight:700;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--violet);border-color:var(--violet);color:var(--surface)}
.abg{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.abg-h{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;background:var(--surface2)}
.abg-h b{font-size:.95rem;font-style:italic}
.abg-scroll{overflow-x:auto}
.abg table{width:100%;border-collapse:collapse;font-size:.88rem}
.abg th{text-align:left;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 14px;font-weight:700}
.abg td{padding:7px 14px;border-top:1px solid var(--line)}
.abg td.mono{font-size:.85rem;white-space:nowrap}
.si{display:inline-block;min-width:30px;text-align:center;padding:2px 8px;border-radius:6px;font-weight:700;font-size:.78rem}
.si-s{background:var(--good-soft);color:var(--good)}
.si-r{background:var(--bad-soft);color:var(--bad)}
.si-i{background:var(--surface2);color:var(--gold);border:1px solid var(--gold)}
.dq{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--safranin-soft);border:1px solid var(--safranin);border-radius:var(--r);padding:14px 16px}
.dq h3{margin:2px 0}
.mcard{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:4px;transition:border-color .2s}
.mcard.ok{border-color:var(--good)}.mcard.no{border-color:var(--bad)}
.vs{align-self:center;font-family:var(--f-display);font-weight:800;color:var(--safranin);margin:8px 0;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:700;min-width:0}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px}
.inp input{flex:1;min-width:0;border:none;background:none;color:var(--ink);font:500 1rem var(--f-mono);padding:10px 0}
.inp input:focus{outline:none}.inp:focus-within{border-color:var(--violet)}
.inp em{font-style:normal;font-size:.75rem;color:var(--muted);white-space:nowrap}
.res{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.res .big b{display:block;font-size:1.8rem;font-family:var(--f-display);margin:2px 0}
.res .big small{color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
.kv dt{font-size:.72rem;color:var(--muted)}.kv dd{margin:0;font-weight:700}
.calc .seg button{flex:1}
.area{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.area summary{list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.area summary::-webkit-details-marker{display:none}
.area summary:focus-visible{outline:3px solid var(--safranin);outline-offset:-3px}
.area-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--violet-soft);color:var(--violet)}
.area-ic svg{width:20px;height:20px}
.area-t{display:flex;flex-direction:column;min-width:0}
.area-t b{font-family:var(--f-display);font-size:1.02rem}
.area-t small{color:var(--muted);font-size:.78rem}
.area-ring{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--safranin) calc(var(--p)*1%),var(--surface2) 0)}
.area-ring span{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:.68rem;font-weight:700}
.area[open] summary{border-bottom:1px solid var(--line)}
.area .topics{padding:12px 14px}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:center;z-index:5}
.tabbar nav{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
.tab{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.7rem;color:var(--muted);font-weight:700}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--violet)}

/* toast + modal */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:20;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(18,13,27,.55);display:grid;place-items:center;z-index:30;padding:20px}
.modal .box{background:var(--surface);border-radius:22px;padding:24px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.modal .seal{width:84px;height:84px;border-radius:50%;background:var(--safranin-soft);border:3px solid var(--safranin);color:var(--safranin);display:grid;place-items:center}
.modal .seal svg{width:40px;height:40px}
.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app"></div>
<div class="tabbar"><nav id="tabs"></nav></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="modal" hidden></div>

<script>
/* ================= ÍCONOS ================= */
const I={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',

const Q=[
{id:'q1',t:'PK/PD',q:'¿Cuál es el índice PK/PD que mejor predice la eficacia de los betalactámicos?',o:['Cmáx/CIM','fAUC/CIM','%fT>CIM','Cmín/CIM'],a:2,e:'Los betalactámicos son tiempo-dependientes. Por eso se optimizan con infusión extendida o continua, no subiendo el pico.',r:'Roberts JA et al., Lancet Infect Dis 2014'},
{id:'q2',t:'PK/PD',q:'Los aminoglucósidos se dosifican una vez al día porque su eficacia depende principalmente de:',o:['%fT>CIM','Cmáx/CIM','Concentración en valle alta','Unión a proteínas'],a:1,e:'Son concentración-dependientes y tienen efecto post-antibiótico prolongado. El intervalo extendido maximiza Cmáx/CIM y deja un valle bajo que reduce la nefrotoxicidad.',r:'Nicolau DP, AAC 1995 (método Hartford)'},
{id:'q3',t:'Vancomicina',q:'Para infección grave por SAMR, ¿qué meta de AUC24/CIM recomienda el consenso de vancomicina?',o:['200–300','400–600','600–800','Valle 15–20 mg/L como única meta'],a:1,e:'AUC 400–600 mg·h/L (asumiendo CIM 1) mantiene eficacia y reduce nefrotoxicidad frente a guiarse solo por valles de 15–20.',r:'Consenso ASHP/IDSA/PIDS/SIDP 2020'},
{id:'q4',t:'S. aureus',q:'Bacteremia por SAMS confirmada. ¿Cuál es el tratamiento definitivo de elección?',o:['Vancomicina','Cefazolina o cloxacilina','Ceftriaxona','Linezolid'],a:1,e:'Los betalactámicos antiestafilocócicos son superiores a vancomicina para SAMS. Cuando llega la susceptibilidad, se cambia.',r:'IDSA SAMR 2011; Mermel/McDanel CID 2015'},
{id:'q5',t:'BLEE',q:'Bacteremia por E. coli productora de BLEE. ¿Qué tratamiento definitivo tiene mejor respaldo?',o:['Piperacilina-tazobactam','Carbapenémico','Ceftriaxona en dosis altas','Cefepime'],a:1,e:'El ensayo MERINO mostró mayor mortalidad a 30 días con piperacilina-tazobactam frente a meropenem en bacteremia por E. coli/K. pneumoniae resistentes a ceftriaxona.',r:'Harris PNA, JAMA 2018 (MERINO); IDSA AMR Guidance 2024'},
{id:'q6',t:'Carbapenemasas',q:'Enterobacteral productor de NDM (metalo-betalactamasa). ¿Qué esquema es apropiado?',o:['Ceftazidima-avibactam sola','Meropenem-vaborbactam','Ceftazidima-avibactam + aztreonam','Ertapenem + meropenem'],a:2,e:'Avibactam no inhibe metalo-betalactamasas. Aztreonam resiste a la MBL, y avibactam lo protege de las BLEE/AmpC que suelen coexistir. Cefiderocol es otra alternativa.',r:'IDSA AMR Guidance 2024'},
{id:'q7',t:'Linezolid',q:'¿Qué toxicidad hematológica es la más típica del linezolid en tratamientos prolongados (>14 días)?',o:['Anemia hemolítica','Trombocitopenia','Eosinofilia','Leucocitosis'],a:1,e:'La mielosupresión, sobre todo trombocitopenia, aumenta con la duración y con insuficiencia renal. Controlar hemograma semanal.',r:'Ficha técnica Zyvox; Hanai Y, J Infect Chemother 2016'},
{id:'q8',t:'Daptomicina',q:'¿Por qué la daptomicina no se usa en neumonía?',o:['No penetra al pulmón','Es inactivada por el surfactante pulmonar','Causa neumonitis siempre','No cubre neumococo'],a:1,e:'El surfactante secuestra e inactiva la daptomicina. Sí sirve para neumonía embólica hematógena por S. aureus (por vía vascular), pero no para neumonía aspirativa o adquirida.',r:'Silverman JA, JID 2005'},
{id:'q9',t:'Tigeciclina',q:'¿Por qué la tigeciclina es mala opción para bacteremia?',o:['No cubre gramnegativos','Concentraciones séricas muy bajas por su gran volumen de distribución','Es nefrotóxica','Se inactiva en sangre'],a:1,e:'Su enorme Vd deja niveles plasmáticos bajos. La FDA además advirtió mayor mortalidad global en metaanálisis.',r:'FDA Drug Safety Communication 2013'},
{id:'q10',t:'ITU',q:'Cistitis aguda no complicada en mujer. ¿Cuál es una primera línea adecuada?',o:['Ciprofloxacino 7 días','Nitrofurantoína 100 mg c/12 h por 5 días','Ceftriaxona IM','Amoxicilina 7 días'],a:1,e:'Nitrofurantoína 5 días, fosfomicina 3 g dosis única o TMP-SMX 3 días (si resistencia local <20%). Las quinolonas se reservan.',r:'IDSA/ESCMID 2010'},
{id:'q11',t:'Aminoglucósidos',q:'¿Cuál es una dosis típica de gentamicina en intervalo extendido?',o:['1 mg/kg c/8 h','5–7 mg/kg c/24 h','15 mg/kg c/24 h','20 mg/kg c/48 h'],a:1,e:'5–7 mg/kg c/24 h, ajustando el intervalo según niveles y función renal. Amikacina: 15–20 mg/kg c/24 h.',r:'Nicolau DP, AAC 1995'},
{id:'q12',t:'Interacciones',q:'Paciente epiléptico en ácido valproico que inicia meropenem. ¿Qué esperas?',o:['Toxicidad por valproato','Caída marcada de los niveles de valproato','Sin interacción','Prolongación del QT'],a:1,e:'Los carbapenémicos reducen drásticamente los niveles de valproato en horas, con riesgo de crisis. Aumentar la dosis no lo compensa: cambiar antibiótico o antiepiléptico.',r:'Mancl EE, Ann Pharmacother 2013'},
{id:'q13',t:'Toxicidad',q:'¿Cuál es el principal factor de riesgo de neurotoxicidad por cefepime?',o:['Edad joven','Insuficiencia renal sin ajuste de dosis','Uso oral','Hipokalemia'],a:1,e:'Encefalopatía, mioclonías y estatus no convulsivo, sobre todo con dosis no ajustadas a la función renal.',r:'Payne LE, Crit Care 2017'},
{id:'q14',t:'C. difficile',q:'Primer episodio de C. difficile. ¿Cuál es el tratamiento preferido según IDSA/SHEA 2021?',o:['Metronidazol oral','Fidaxomicina (vancomicina oral como alternativa)','Vancomicina IV','Rifaximina'],a:1,e:'Fidaxomicina 200 mg c/12 h por 10 días reduce recurrencias. Alternativa: vancomicina oral 125 mg c/6 h por 10 días. Metronidazol solo si no hay acceso a las anteriores en episodio no grave.',r:'IDSA/SHEA 2021 Focused Update'},
{id:'q15',t:'Resistencia intrínseca',q:'Stenotrophomonas maltophilia es intrínsecamente resistente a:',o:['TMP-SMX','Carbapenémicos','Minociclina','Levofloxacino'],a:1,e:'Produce la metalo-betalactamasa L1, que hidroliza carbapenémicos. Según IDSA 2026, el preferido en infección invasiva es cefiderocol; TMP-SMX, levofloxacino y minociclina se usan como parte de una combinación.',r:'IDSA AMR Guidance 2024'},
{id:'q16',t:'Endocarditis',q:'Endocarditis por E. faecalis sensible a ampicilina. ¿Qué combinación evita la nefrotoxicidad de gentamicina?',o:['Ampicilina + ceftriaxona','Vancomicina + gentamicina','Cefazolina + rifampicina','Daptomicina sola'],a:0,e:'La ceftriaxona satura otras PBP y genera sinergia con ampicilina. Eficacia similar a ampicilina-gentamicina con mucha menos nefrotoxicidad.',r:'AHA 2015; Fernández-Hidalgo, CID 2013'},
{id:'q17',t:'Espectro',q:'¿Cuál de estos NO tiene actividad confiable contra Bacteroides fragilis?',o:['Metronidazol','Piperacilina-tazobactam','Ceftriaxona','Meropenem'],a:2,e:'Ceftriaxona no cubre anaerobios del grupo B. fragilis. En infección intraabdominal se combina con metronidazol.',r:'IDSA/SIS intraabdominal 2010'},
{id:'q18',t:'Espectro',q:'¿Qué carbapenémico NO cubre Pseudomonas aeruginosa?',o:['Meropenem','Imipenem','Ertapenem','Doripenem'],a:2,e:'Ertapenem tampoco cubre Acinetobacter ni enterococo. Útil para BLEE en paciente estable sin riesgo de Pseudomonas.',r:'Ficha técnica Invanz'},
{id:'q19',t:'Duración',q:'Bacteremia por gramnegativo no complicada con buena respuesta clínica. ¿Duración total?',o:['3 días','7 días','14 días','21 días'],a:1,e:'7 días fue no inferior a 14 días en ensayos aleatorizados, incluido el gran ensayo BALANCE.',r:'Yahav D, CID 2019; BALANCE, NEJM 2025'},
{id:'q20',t:'Duración',q:'Neumonía adquirida en la comunidad con estabilidad clínica. ¿Duración mínima recomendada?',o:['3 días','5 días','10 días','14 días'],a:1,e:'Mínimo 5 días y hasta lograr estabilidad clínica. Se extiende en SAMR, Pseudomonas o complicaciones.',r:'ATS/IDSA NAC 2019'},
{id:'q21',t:'Candida',q:'Candidemia en paciente hospitalizado. ¿Tratamiento inicial recomendado?',o:['Fluconazol en todos','Equinocandina','Voriconazol','Anfotericina B deoxicolato'],a:1,e:'Equinocandina inicial, desescalar a fluconazol si la especie es sensible y hay estabilidad. Retirar CVC, fondo de ojo y tratar 14 días desde el primer hemocultivo negativo.',r:'IDSA Candida 2016'},
{id:'q22',t:'Candida',q:'¿Qué especie de Candida es intrínsecamente resistente a fluconazol?',o:['C. albicans','C. parapsilosis','C. krusei (Pichia kudriavzevii)','C. tropicalis'],a:2,e:'C. krusei es intrínsecamente resistente. C. glabrata tiene sensibilidad dosis-dependiente y C. auris suele ser resistente.',r:'IDSA Candida 2016'},
{id:'q23',t:'TDM antifúngico',q:'¿Rango de concentración valle habitualmente buscado para voriconazol?',o:['0,1–0,5 mg/L','1–5,5 mg/L','10–20 mg/L','No requiere TDM'],a:1,e:'Bajo 1 mg/L hay riesgo de fracaso; sobre 5,5 mg/L aumenta toxicidad neurológica y hepática. Variabilidad alta por CYP2C19.',r:'BSMM TDM 2014; Pascual A, CID 2008'},
{id:'q24',t:'Alergia',q:'Paciente con antecedente de rash leve a amoxicilina. Requiere profilaxis quirúrgica. ¿Opción razonable?',o:['Evitar todo betalactámico','Cefazolina','Vancomicina siempre','Clindamicina siempre'],a:1,e:'Cefazolina tiene cadena lateral única y reactividad cruzada muy baja con penicilinas. Puede usarse incluso en alergia no grave a penicilina.',r:'Khan DA, J Allergy Clin Immunol 2022'},
{id:'q25',t:'Meningitis',q:'Meningitis bacteriana en paciente de 65 años. Además de ceftriaxona y vancomicina, ¿qué agregas?',o:['Metronidazol','Ampicilina','Gentamicina','Nada más'],a:1,e:'Ampicilina para cubrir Listeria monocytogenes en mayores de 50 años, inmunosuprimidos o embarazadas. Las cefalosporinas no la cubren.',r:'IDSA meningitis 2004'},
{id:'q26',t:'Toxicidad',q:'Paciente en TMP-SMX dosis altas con potasio en ascenso. ¿Por qué ocurre?',o:['Lisis celular','Trimetoprim bloquea canales ENaC distales, como amilorida','Aporte de potasio en la solución','Hipoaldosteronismo autoinmune'],a:1,e:'Trimetoprim actúa como diurético ahorrador de potasio. Riesgo mayor con IECA/ARA-II, espironolactona o insuficiencia renal. También eleva la creatinina sin bajar la filtración.',r:'Perazella MA, Drug Saf 2000'},
{id:'q27',t:'Polimixinas',q:'Para una ITU por bacilo gramnegativo resistente, ¿qué polimixina se prefiere?',o:['Polimixina B','Colistina (colistimetato)','Da igual','Ninguna llega a la orina'],a:1,e:'El colistimetato se elimina por vía renal y se convierte a colistina en la orina. La polimixina B tiene escasa excreción urinaria; se prefiere para infecciones sistémicas no urinarias.',r:'Consenso internacional polimixinas, Pharmacotherapy 2019'},
{id:'q28',t:'Equinocandinas',q:'¿Por qué las equinocandinas no se usan para cistitis por Candida?',o:['No cubren Candida','Excreción urinaria mínima','Son muy nefrotóxicas','Solo existen por vía oral'],a:1,e:'Casi no llegan a la orina. Para cistitis sintomática se usa fluconazol o, si es resistente, anfotericina B.',r:'IDSA Candida 2016'},
{id:'q29',t:'Ajuste renal',q:'¿Cuál de estos antimicrobianos NO requiere ajuste por función renal?',o:['Cefepime','Ceftriaxona','Meropenem','Fluconazol'],a:1,e:'Ceftriaxona tiene eliminación dual biliar y renal. Tampoco requieren ajuste linezolid, doxiciclina, clindamicina, moxifloxacino ni las equinocandinas.',r:'Sanford Guide'},
{id:'q30',t:'Espectro',q:'¿Qué betalactámico cubre SAMR?',o:['Cefazolina','Ceftarolina','Piperacilina-tazobactam','Meropenem'],a:1,e:'Ceftarolina (y ceftobiprol) se unen a la PBP2a. El resto de betalactámicos no cubre SAMR.',r:'Ficha técnica Zinforo/Teflaro'}
,{id:'q31',t:'Carbapenemasas',q:'Bacteremia por Klebsiella pneumoniae productora de KPC. ¿Qué opciones son de primera línea?',o:['Ceftazidima-avibactam, meropenem-vaborbactam o imipenem-relebactam','Ceftolozano-tazobactam','Ertapenem en dosis altas','Colistina en monoterapia'],a:0,e:'Los tres inhibidores nuevos cubren KPC y superan a los esquemas con polimixinas en eficacia y toxicidad. Cefiderocol queda como alternativa.',r:'IDSA AMR Guidance 2024'}
,{id:'q32',t:'Carbapenemasas',q:'Enterobacteral productor de OXA-48. ¿Cuál es el tratamiento preferido?',o:['Meropenem-vaborbactam','Imipenem-relebactam','Ceftazidima-avibactam','Ceftolozano-tazobactam'],a:2,e:'Vaborbactam y relebactam no inhiben OXA-48. Avibactam sí. Cefiderocol es la alternativa.',r:'IDSA AMR Guidance 2024'}
,{id:'q33',t:'Nuevos antimicrobianos',q:'¿Cómo entra el cefiderocol a la bacteria gramnegativa?',o:['Por porinas exclusivamente','Unido al hierro, a través de los transportadores de sideróforos','Por difusión pasiva a través del LPS','Por bombas de eflujo invertidas'],a:1,e:'Es una cefalosporina sideróforo: se une al hierro férrico y usa los sistemas de captación de hierro, como un caballo de Troya. Así evade la pérdida de porinas y es estable frente a muchas carbapenemasas, incluidas MBL.',r:'Ficha técnica Fetcroja; Sato T, CID 2019'}
,{id:'q34',t:'Nuevos antimicrobianos',q:'Ceftolozano-tazobactam es muy activo contra Pseudomonas DTR, pero NO contra:',o:['Pseudomonas con pérdida de OprD','Enterobacterales productores de carbapenemasas (KPC, MBL)','Pseudomonas con AmpC desreprimida','E. coli no BLEE'],a:1,e:'Tazobactam no inhibe carbapenemasas. Su fortaleza es Pseudomonas resistente por mecanismos no enzimáticos (porinas, eflujo, AmpC).',r:'IDSA AMR Guidance 2024'}
,{id:'q35',t:'Acinetobacter',q:'Infección por Acinetobacter baumannii resistente a carbapenémicos (CRAB). ¿Esquema preferido según IDSA 2024?',o:['Meropenem en dosis altas solo','Sulbactam-durlobactam + imipenem-cilastatina o meropenem','Ceftazidima-avibactam','Ertapenem + tigeciclina'],a:1,e:'Durlobactam protege al sulbactam de las OXA de Acinetobacter. El carbapenémico acompañante aporta protección adicional frente a betalactamasas, según el diseño del ensayo ATTACK.',r:'Kaye KS, Lancet Infect Dis 2023 (ATTACK); IDSA AMR Guidance 2024'}
,{id:'q36',t:'Nuevos antimicrobianos',q:'En el ensayo CREDIBLE-CR, ¿en qué subgrupo se observó mayor mortalidad con cefiderocol frente a la mejor terapia disponible?',o:['Enterobacterales KPC','Acinetobacter spp.','Stenotrophomonas','Infección urinaria'],a:1,e:'El exceso de mortalidad se concentró en infecciones por Acinetobacter. Por eso IDSA lo recomienda para CRAB solo en combinación y cuando otras opciones fallan.',r:'Bassetti M, Lancet Infect Dis 2021 (CREDIBLE-CR)'}
,{id:'q37',t:'TDM betalactámicos',q:'En el paciente crítico, ¿qué meta PK/PD se busca habitualmente al monitorizar betalactámicos?',o:['40% fT>CIM','50–70% fT>CIM','100% fT>CIM (algunos centros, hasta 4×CIM)','Cmáx 10 veces la CIM'],a:2,e:'En críticos se apunta a mantener la concentración libre sobre la CIM durante todo el intervalo. Metas más altas (>4×CIM) aumentan el riesgo de neurotoxicidad.',r:'Abdul-Aziz MH, Intensive Care Med 2020'}
,{id:'q38',t:'TDM betalactámicos',q:'Paciente de 25 años, politraumatizado, con aclaramiento de creatinina medido de 180 mL/min. ¿Qué riesgo tiene con meropenem en dosis estándar?',o:['Neurotoxicidad','Subexposición por clearance renal aumentado','Ninguno','Acumulación del fármaco'],a:1,e:'El clearance renal aumentado (≥130 mL/min/1,73 m²) acelera la eliminación de betalactámicos y deja concentraciones bajo la CIM. Se manejan con dosis mayores, infusión extendida o continua y TDM.',r:'Udy AA, Chest 2012'}
,{id:'q39',t:'Infusión prolongada',q:'¿Qué mostró el ensayo BLING III (2024) sobre infusión continua de betalactámicos en sepsis?',o:['Aumento de mortalidad','Menor mortalidad a 90 días sin significancia estadística, con mejor curación clínica','Ninguna diferencia en ningún desenlace','Más nefrotoxicidad'],a:1,e:'La diferencia en mortalidad no fue significativa, pero hubo mayor curación clínica. Un metaanálisis publicado en paralelo sí asoció la infusión prolongada a menor mortalidad.',r:'Dulhunty JM, JAMA 2024 (BLING III); Abdul-Aziz MH, JAMA 2024'}
,{id:'q40',t:'PK en críticos',q:'Paciente crítico con albúmina de 1,8 g/dL en ceftriaxona. ¿Qué efecto esperas?',o:['Mayor concentración total y toxicidad','Mayor fracción libre, con más clearance y volumen de distribución, y riesgo de subexposición','Ningún efecto','Menor fracción libre'],a:1,e:'En fármacos muy unidos a proteínas, la hipoalbuminemia aumenta la fracción libre, que se distribuye y elimina más rápido. Las concentraciones pueden caer bajo la CIM al final del intervalo.',r:'Ulldemolins M, Clin Pharmacokinet 2011'}
,{id:'q41',t:'Obesidad',q:'Paciente con obesidad mórbida. ¿Qué peso se usa para dosificar aminoglucósidos?',o:['Peso real','Peso ideal','Peso ajustado','Superficie corporal'],a:2,e:'Peso ajustado: peso ideal + 0,4 × (peso real − peso ideal). La carga de vancomicina, en cambio, se calcula con peso real.',r:'Bauer LA, Applied Clinical Pharmacokinetics'}
,{id:'q42',t:'Vancomicina',q:'¿Qué método recomienda el consenso 2020 para estimar el AUC de vancomicina?',o:['Solo un valle','Software bayesiano, idealmente con 1–2 niveles (o dos niveles con ecuaciones de primer orden)','Fórmula fija por peso sin niveles','Nivel aleatorio único sin modelo'],a:1,e:'El bayesiano permite estimar AUC con pocos niveles, incluso antes del estado estacionario. La alternativa es pico y valle con ecuaciones de farmacocinética.',r:'Consenso ASHP/IDSA/PIDS/SIDP 2020'}
,{id:'q43',t:'Nuevos antimicrobianos',q:'¿Para qué tipo de microorganismo está pensado aztreonam-avibactam?',o:['SAMR','Enterobacterales productores de metalo-betalactamasas','Candida auris','Anaerobios'],a:1,e:'Combina en un solo producto la estrategia de aztreonam + ceftazidima-avibactam: aztreonam resiste a la MBL y avibactam lo protege de BLEE, AmpC y KPC.',r:'Carmeli Y, Lancet Infect Dis 2025 (REVISIT); EMA 2024'}
,{id:'q44',t:'Nuevos antimicrobianos',q:'Paciente en cefiderocol con aclaramiento de creatinina de 140 mL/min. ¿Qué ajuste indica la ficha técnica?',o:['Ninguno','Aumentar a 2 g c/6 h','Reducir a 1 g c/8 h','Infusión en bolo'],a:1,e:'Con clearance ≥120 mL/min se aumenta a 2 g c/6 h en infusión de 3 h. También se ajusta a la baja en insuficiencia renal.',r:'Ficha técnica Fetcroja'}
,{id:'q45',t:'Nuevos antimicrobianos',q:'¿Cuál es la dosis estándar de meropenem-vaborbactam?',o:['1 g c/8 h en 30 min','4 g (2 g/2 g) c/8 h en infusión de 3 h','2 g c/24 h','500 mg c/6 h'],a:1,e:'Se infunde en 3 horas para optimizar %fT>CIM. Requiere ajuste renal.',r:'Ficha técnica Vabomere/Vaborem'}

,{id:'q46',t:'Antivirales',q:'Encefalitis herpética con función renal normal. ¿Dosis de aciclovir?',o:['5 mg/kg c/8 h IV','10 mg/kg c/8 h IV por 14–21 días','800 mg VO 5 veces al día','10 mg/kg c/24 h IV'],a:1,e:'10 mg/kg c/8 h IV por 14–21 días. Iniciar empíricamente ante la sospecha, sin esperar la PCR del LCR.',r:'IDSA encefalitis 2008'}
,{id:'q47',t:'Antivirales',q:'Paciente obeso con encefalitis herpética. ¿Qué peso usas para dosificar aciclovir IV?',o:['Peso real','Peso ideal (algunos centros usan peso ajustado)','Superficie corporal','Dosis fija de 1 g'],a:1,e:'Aciclovir es hidrosoluble. Con peso real se sobredosifica y aumenta el riesgo de nefrotoxicidad y neurotoxicidad. Muchos centros usan peso ajustado en obesidad mórbida para no subdosificar.',r:'Turner RB, Ann Pharmacother 2016'}
,{id:'q48',t:'Antivirales',q:'¿Cuál es el mecanismo principal de la nefrotoxicidad por aciclovir IV y cómo se previene?',o:['Necrosis tubular por radicales libres; N-acetilcisteína','Nefropatía por cristales; hidratación e infusión en al menos 1 hora','Nefritis intersticial alérgica; corticoides','Vasoconstricción renal; dopamina'],a:1,e:'Aciclovir precipita en los túbulos cuando la concentración urinaria es alta. Hidratar, infundir lento y ajustar a la función renal.',r:'Perazella MA, Am J Med Sci 2003'}
,{id:'q49',t:'Antivirales',q:'Herpes zóster en adulto inmunocompetente. ¿Dosis de valaciclovir?',o:['500 mg c/12 h por 3 días','1 g c/8 h por 7 días','2 g dosis única','1 g c/24 h por 14 días'],a:1,e:'Valaciclovir 1 g c/8 h por 7 días. Alternativa: aciclovir 800 mg VO 5 veces al día por 7 días. Iniciar idealmente dentro de 72 h.',r:'Dworkin RH, CID 2007'}
,{id:'q50',t:'Antivirales',q:'Enfermedad por CMV en paciente trasplantado, función renal normal. ¿Dosis de inducción de ganciclovir?',o:['5 mg/kg c/12 h IV','5 mg/kg c/24 h IV','10 mg/kg c/8 h IV','2,5 mg/kg c/48 h IV'],a:0,e:'Inducción 5 mg/kg c/12 h; mantención 5 mg/kg c/24 h. Ajustar siempre a la función renal.',r:'Kotton CN, Transplantation 2018 (consenso CMV)'}
,{id:'q51',t:'Antivirales',q:'Profilaxis de CMV con valganciclovir en trasplante renal, ClCr ≥60. ¿Dosis?',o:['450 mg c/48 h','900 mg c/24 h','900 mg c/12 h','1.800 mg c/24 h'],a:1,e:'Profilaxis: 900 mg c/24 h. Tratamiento (inducción): 900 mg c/12 h. Se toma con alimentos y se ajusta a la función renal.',r:'Ficha técnica Valcyte; Kotton CN 2018'}
,{id:'q52',t:'Antivirales',q:'¿Cuál es la toxicidad limitante más frecuente de ganciclovir y valganciclovir?',o:['Nefrotoxicidad','Mielosupresión, sobre todo neutropenia','Hepatotoxicidad','Prolongación del QT'],a:1,e:'La neutropenia es la causa más frecuente de suspensión. Controlar hemograma al menos semanal.',r:'Ficha técnica Cymevene'}
,{id:'q53',t:'Antivirales',q:'Paciente en foscarnet con parestesias periorales. ¿Qué buscas?',o:['Hiperkalemia','Hipocalcemia iónica e hipomagnesemia','Hiperglicemia','Hiponatremia'],a:1,e:'Foscarnet quela calcio ionizado y causa pérdida renal de magnesio, potasio y fósforo. Además es nefrotóxico: hidratar antes de cada dosis.',r:'Ficha técnica Foscavir'}
,{id:'q54',t:'Antivirales',q:'Profilaxis de CMV con letermovir en TPH. El paciente también recibe ciclosporina. ¿Dosis?',o:['480 mg c/24 h','240 mg c/24 h','960 mg c/24 h','480 mg c/12 h'],a:1,e:'Ciclosporina aumenta los niveles de letermovir: se reduce de 480 a 240 mg/día. Letermovir solo sirve como profilaxis, no para tratar enfermedad establecida.',r:'Ficha técnica Prevymis'}
,{id:'q55',t:'Antivirales',q:'Influenza en paciente con ClCr de 40 mL/min. ¿Dosis de oseltamivir?',o:['75 mg c/12 h','30 mg c/12 h','30 mg c/24 h','150 mg c/12 h'],a:1,e:'ClCr 30–60: 30 mg c/12 h. ClCr 10–30: 30 mg c/24 h. Hemodiálisis: 30 mg después de cada sesión. Duración: 5 días.',r:'CDC Influenza Antiviral Guidance'}
,{id:'q56',t:'Antivirales',q:'CMV refractario. ¿Con qué antiviral NO debe combinarse maribavir?',o:['Letermovir','Ganciclovir/valganciclovir','Aciclovir','Ninguno'],a:1,e:'Maribavir inhibe la quinasa UL97, que activa al ganciclovir: son antagónicos. Dosis: 400 mg c/12 h VO.',r:'Avery RK, CID 2022 (SOLSTICE)'}
,{id:'q57',t:'Antifúngicos',q:'¿Cuál es el esquema de carga de isavuconazol?',o:['200 mg c/8 h por 6 dosis, luego 200 mg c/24 h','400 mg c/12 h por 2 dosis, luego 200 mg c/12 h','6 mg/kg c/12 h por 2 dosis','100 mg c/24 h sin carga'],a:0,e:'Carga 200 mg c/8 h por 48 h (6 dosis), luego 200 mg c/24 h, IV o VO. No requiere ajuste renal y la forma IV no contiene ciclodextrina.',r:'Ficha técnica Cresemba'}
,{id:'q58',t:'Antifúngicos',q:'Posaconazol en tabletas de liberación retardada. ¿Dosis?',o:['200 mg c/8 h','300 mg c/12 h el día 1, luego 300 mg c/24 h','400 mg c/24 h sin carga','800 mg dosis única'],a:1,e:'Igual en profilaxis y tratamiento. La suspensión oral se dosifica distinto (200 mg c/8 h en profilaxis) y necesita comida grasa: no son intercambiables mg a mg.',r:'Ficha técnica Noxafil'}
,{id:'q59',t:'Antifúngicos',q:'¿Qué concentración valle de posaconazol se busca en profilaxis?',o:['>0,7 mg/L','>5 mg/L','1–5,5 mg/L','No se monitoriza'],a:0,e:'Profilaxis: >0,7 mg/L. Tratamiento: >1 mg/L (algunos centros >1,25).',r:'Ashbee HR, J Antimicrob Chemother 2014 (BSMM)'}
,{id:'q60',t:'Antifúngicos',q:'Mucormicosis rino-orbitaria. ¿Dosis de anfotericina B liposomal?',o:['0,5 mg/kg/día','1 mg/kg/día','5–10 mg/kg/día','3 mg/kg semanal'],a:2,e:'5–10 mg/kg/día (10 mg/kg si hay compromiso del SNC), junto con desbridamiento quirúrgico. Voriconazol no cubre mucorales.',r:'Cornely OA, Lancet Infect Dis 2019 (ECMM/MSG)'}
,{id:'q61',t:'Antifúngicos',q:'Meningitis criptocócica. ¿Cuál es el esquema clásico de inducción?',o:['Fluconazol 400 mg solo','Anfotericina B liposomal 3–4 mg/kg/día + flucitosina 25 mg/kg c/6 h','Caspofungina','Voriconazol + fluconazol'],a:1,e:'Inducción mínima de 2 semanas, luego consolidación con fluconazol. Las equinocandinas no tienen actividad contra Cryptococcus. La OMS 2022 propone además un esquema de dosis única alta de L-AmB en VIH.',r:'IDSA criptococosis 2010; OMS 2022'}
,{id:'q62',t:'Antifúngicos',q:'Paciente en voriconazol IV con ClCr de 35 mL/min. ¿Qué preocupa?',o:['Acumulación del vehículo ciclodextrina (SBECD)','Acumulación de voriconazol','Hipoglicemia','Ninguna preocupación'],a:0,e:'El voriconazol se metaboliza en el hígado, pero el vehículo IV se elimina por el riñón. Con ClCr <50 se prefiere la vía oral si es posible.',r:'Ficha técnica Vfend'}
,{id:'q63',t:'Antifúngicos',q:'¿Qué efecto tiene el isavuconazol sobre el intervalo QT?',o:['Lo prolonga como los otros azoles','Lo acorta','No tiene efecto','Solo lo prolonga por vía IV'],a:1,e:'A diferencia de los demás azoles, acorta el QT. Está contraindicado en el síndrome de QT corto familiar.',r:'Ficha técnica Cresemba'}
,{id:'q64',t:'Antifúngicos',q:'¿En qué paciente evitarías itraconazol?',o:['Insuficiencia cardíaca con fracción de eyección reducida','Hipertensión controlada','Diabetes','Asma'],a:0,e:'Itraconazol tiene efecto inotrópico negativo. Además, las cápsulas necesitan pH ácido y comida para absorberse; los IBP las reducen.',r:'Ficha técnica Sporanox'}
,{id:'q65',t:'Antifúngicos',q:'Candidemia por C. albicans sensible, ya desescalando. ¿Dosis de fluconazol para un adulto de 70 kg con función renal normal?',o:['Carga 800 mg, luego 400 mg c/24 h','150 mg dosis única','100 mg c/24 h','200 mg c/12 h sin carga'],a:0,e:'Carga de 12 mg/kg y mantención de 6 mg/kg/día. Tras la carga, reducir 50% si ClCr ≤50.',r:'IDSA Candida 2016'}

,{id:'m1',t:'Micro · básico',q:'¿De qué color se ven las bacterias grampositivas en la tinción de Gram?',o:['Rosado o rojo','Violeta','Verde','No se tiñen'],a:1,e:'Su pared gruesa de peptidoglicano retiene el complejo cristal violeta-yodo tras la decoloración. Las gramnegativas pierden el violeta y toman la safranina (rosado).',r:'Murray, Microbiología Médica'}
,{id:'m2',t:'Micro · básico',q:'Cocáceas grampositivas en racimos en un hemocultivo sugieren:',o:['Streptococcus','Staphylococcus','Enterococcus','Neisseria'],a:1,e:'Racimos: Staphylococcus. Cadenas o pares: Streptococcus y Enterococcus.',r:'Murray, Microbiología Médica'}
,{id:'m3',t:'Micro · básico',q:'¿Qué prueba diferencia Staphylococcus de Streptococcus?',o:['Coagulasa','Catalasa','Oxidasa','Optoquina'],a:1,e:'Staphylococcus es catalasa positivo; Streptococcus y Enterococcus son catalasa negativos.',r:'Murray, Microbiología Médica'}
,{id:'m4',t:'Micro · básico',q:'¿Qué prueba separa S. aureus de los estafilococos coagulasa negativos?',o:['Catalasa','Coagulasa','Bilis-esculina','Ureasa'],a:1,e:'S. aureus es coagulasa positivo. S. epidermidis, S. haemolyticus y otros son coagulasa negativos (SCN). S. lugdunensis es SCN pero se comporta como S. aureus.',r:'Murray, Microbiología Médica'}
,{id:'m5',t:'Micro · básico',q:'Diplococos gramnegativos en el LCR de un joven con petequias. ¿Qué sospechas?',o:['Streptococcus pneumoniae','Neisseria meningitidis','Listeria monocytogenes','Haemophilus influenzae'],a:1,e:'Diplococos gramnegativos con forma de riñón. Neumococo se ve como diplococo grampositivo lanceolado; Listeria como bacilo grampositivo.',r:'IDSA meningitis 2004'}
,{id:'m6',t:'Micro · básico',q:'¿Cuál de estos es un bacilo gramnegativo no fermentador?',o:['Escherichia coli','Klebsiella pneumoniae','Pseudomonas aeruginosa','Proteus mirabilis'],a:2,e:'Pseudomonas, Acinetobacter, Stenotrophomonas y Burkholderia no fermentan glucosa. E. coli, Klebsiella y Proteus son Enterobacterales (fermentadores).',r:'Murray, Microbiología Médica'}
,{id:'m7',t:'Micro · básico',q:'¿Qué resultado de oxidasa esperas en Pseudomonas aeruginosa?',o:['Positiva','Negativa','Variable según la cepa','No se puede medir'],a:0,e:'Pseudomonas es oxidasa positiva. Los Enterobacterales son oxidasa negativos, y Stenotrophomonas y Acinetobacter también.',r:'Murray, Microbiología Médica'}
,{id:'m8',t:'Micro · básico',q:'Streptococcus pyogenes produce en agar sangre una hemólisis:',o:['Alfa (verdosa)','Beta (completa)','Gamma (ausente)','No crece en agar sangre'],a:1,e:'Grupo A de Lancefield, beta-hemolítico. Neumococo y estreptococos del grupo viridans son alfa-hemolíticos.',r:'Murray, Microbiología Médica'}
,{id:'m9',t:'Micro · básico',q:'Diplococo grampositivo alfa-hemolítico, sensible a optoquina y soluble en bilis. ¿Cuál es?',o:['Enterococcus faecalis','Streptococcus pneumoniae','Streptococcus viridans','Staphylococcus aureus'],a:1,e:'La optoquina y la solubilidad en bilis separan al neumococo del grupo viridans.',r:'Murray, Microbiología Médica'}
,{id:'m10',t:'Micro · básico',q:'Bacilo grampositivo que crece a 4 °C y causa meningitis en embarazadas y mayores. ¿Cuál es?',o:['Bacillus cereus','Listeria monocytogenes','Corynebacterium','Clostridium perfringens'],a:1,e:'Listeria se multiplica en refrigeración (quesos blandos, cecinas) y tiene resistencia intrínseca a cefalosporinas: se trata con ampicilina.',r:'IDSA meningitis 2004'}
,{id:'m11',t:'Micro · básico',q:'¿Por qué los betalactámicos no sirven contra Mycoplasma pneumoniae?',o:['Produce betalactamasas','No tiene pared celular','Tiene bombas de eflujo','Es intracelular estricto'],a:1,e:'Sin peptidoglicano no hay blanco para betalactámicos. Se trata con macrólidos, doxiciclina o quinolonas.',r:'Murray, Microbiología Médica'}
,{id:'m12',t:'Micro · básico',q:'¿Por qué el alcohol gel no basta con pacientes con C. difficile?',o:['C. difficile es un virus','No elimina las esporas','Inactiva la vancomicina','Causa resistencia'],a:1,e:'C. difficile es un bacilo grampositivo anaerobio esporulado. Las esporas resisten el alcohol: lavado con agua y jabón y limpieza con productos esporicidas.',r:'IDSA/SHEA 2017'}
,{id:'m13',t:'Micro · básico',q:'Un E. coli en agar MacConkey forma colonias rosadas porque:',o:['Fermenta la lactosa','Produce pigmento','Es oxidasa positivo','Hidroliza la urea'],a:0,e:'MacConkey es selectivo para gramnegativos y diferencial por lactosa. Rosado: fermentador (E. coli, Klebsiella). Incoloro: no fermentador (Pseudomonas, Proteus, Salmonella).',r:'Murray, Microbiología Médica'}
,{id:'m14',t:'Micro · intermedio',q:'¿Qué es la CIM?',o:['La concentración que mata el 99,9% del inóculo','La menor concentración que inhibe el crecimiento visible in vitro','La concentración plasmática máxima','La dosis mínima eficaz en el paciente'],a:1,e:'La concentración que mata el 99,9% es la CBM (concentración bactericida mínima). La CIM se compara con el punto de corte para clasificar S, I o R.',r:'CLSI M100; EUCAST'}
,{id:'m15',t:'Micro · intermedio',q:'En EUCAST, ¿qué significa hoy la categoría "I"?',o:['Intermedio, no usar','Sensible si se incrementa la exposición (dosis alta o infusión prolongada)','Indeterminado, repetir el test','Inducible'],a:1,e:'Desde 2019, "I" indica que el fármaco sirve con dosis altas o una forma de administración que aumente la exposición. Por eso importa la tabla de dosis de EUCAST.',r:'EUCAST 2019'}
,{id:'m16',t:'Micro · intermedio',q:'¿Cuál es el mecanismo de resistencia del SAMR?',o:['Betalactamasa de espectro extendido','Gen mecA que codifica PBP2a, de baja afinidad por betalactámicos','Pérdida de porinas','Bombas de eflujo'],a:1,e:'PBP2a sigue construyendo la pared aunque haya betalactámicos. Ceftarolina y ceftobiprol sí se unen a PBP2a.',r:'Murray, Microbiología Médica'}
,{id:'m17',t:'Micro · intermedio',q:'¿Cuál es el mecanismo de resistencia de Enterococcus a vancomicina (vanA)?',o:['Hidrólisis de vancomicina','Cambio del blanco D-Ala-D-Ala por D-Ala-D-Lac','Eflujo de vancomicina','Engrosamiento de la pared'],a:1,e:'Vancomicina pierde afinidad por el precursor modificado. vanA confiere resistencia a vancomicina y teicoplanina; vanB solo a vancomicina.',r:'Murray, Microbiología Médica'}
,{id:'m18',t:'Micro · intermedio',q:'Bacteremia grave por Enterobacter cloacae sensible a ceftriaxona. ¿Qué betalactámico prefieres?',o:['Ceftriaxona','Cefepime','Ampicilina','Cefazolina'],a:1,e:'E. cloacae, Klebsiella aerogenes y Citrobacter freundii tienen AmpC cromosómica inducible. Ceftriaxona puede seleccionar mutantes desreprimidos; cefepime es estable frente a AmpC.',r:'IDSA AMR Guidance 2024'}
,{id:'m19',t:'Micro · intermedio',q:'Un E. coli resistente a ceftriaxona y también a cefoxitina, sin sinergia con clavulánico. ¿Qué mecanismo sugiere?',o:['BLEE','AmpC (plasmídica o hiperproducida)','KPC','Pérdida de OprD'],a:1,e:'Las BLEE no hidrolizan cefamicinas (cefoxitina) y se inhiben con clavulánico. La resistencia a cefoxitina sin efecto del clavulánico orienta a AmpC.',r:'Jacoby GA, Clin Microbiol Rev 2009'}
,{id:'m20',t:'Micro · intermedio',q:'S. aureus resistente a eritromicina y sensible a clindamicina. ¿Qué prueba pides antes de usar clindamicina?',o:['Test de coagulasa','D-test','Prueba de catalasa','E-test de vancomicina'],a:1,e:'El D-test detecta resistencia inducible a clindamicina (gen erm). Si es positivo, la clindamicina puede fallar.',r:'CLSI M100'}
,{id:'m21',t:'Micro · intermedio',q:'S. epidermidis en 1 de 2 sets de hemocultivos, paciente sin catéter ni prótesis y estable. ¿Interpretación más probable?',o:['Bacteremia verdadera','Contaminación','Endocarditis','Sepsis por catéter'],a:1,e:'Un SCN en un solo set suele ser contaminante. Distinto es S. aureus o levaduras, que nunca se consideran contaminantes.',r:'Hall KK, Clin Microbiol Rev 2006'}
,{id:'m22',t:'Micro · intermedio',q:'¿Qué factores de crecimiento necesita Haemophilus influenzae?',o:['Ninguno','Factor X (hemina) y factor V (NAD)','Vitamina K','Hierro y cisteína'],a:1,e:'Por eso crece en agar chocolate y no en agar sangre simple (salvo junto a S. aureus: satelitismo).',r:'Murray, Microbiología Médica'}
,{id:'m23',t:'Micro · intermedio',q:'¿Por qué Enterococcus es intrínsecamente resistente a cefalosporinas?',o:['Produce BLEE','Tiene PBP de baja afinidad (PBP5)','No tiene pared celular','Por bombas de eflujo'],a:1,e:'Las PBP de Enterococcus no se unen bien a las cefalosporinas. Por eso la profilaxis con cefazolina o el uso de ceftriaxona pueden seleccionar enterococos.',r:'Murray, Microbiología Médica'}
,{id:'m24',t:'Micro · intermedio',q:'¿Qué indica la resistencia de alto nivel a gentamicina (HLAR) en Enterococcus?',o:['Se puede usar gentamicina en dosis altas','Se pierde la sinergia betalactámico + gentamicina','Hay resistencia a ampicilina','Indica vanA'],a:1,e:'Enterococcus tiene resistencia intrínseca de bajo nivel a aminoglucósidos que se supera con un agente de pared. Con HLAR esa sinergia desaparece; en endocarditis por E. faecalis se usa ampicilina + ceftriaxona.',r:'AHA 2015'}
,{id:'m25',t:'Micro · intermedio',q:'¿Qué significa encontrar levaduras en un hemocultivo?',o:['Probable contaminante, repetir','Candidemia hasta demostrar lo contrario: iniciar antifúngico','Colonización de la piel','Error de laboratorio'],a:1,e:'Las levaduras en sangre nunca se consideran contaminantes. Iniciar equinocandina, retirar CVC y hacer fondo de ojo.',r:'IDSA Candida 2016'}
,{id:'m26',t:'Micro · avanzado',q:'Según la clasificación de Ambler, NDM es una carbapenemasa de clase:',o:['A (serina)','B (metalo-betalactamasa, dependiente de zinc)','C (AmpC)','D (OXA)'],a:1,e:'Clase A: KPC y BLEE. Clase B: NDM, VIM, IMP (zinc). Clase C: AmpC. Clase D: OXA-48. Los inhibidores nuevos (avibactam, vaborbactam, relebactam) no inhiben clase B.',r:'Bush K, AAC 2010'}
,{id:'m27',t:'Micro · avanzado',q:'Un Enterobacteral da mCIM positivo y eCIM positivo (el EDTA restaura la actividad del meropenem). ¿Qué sugiere?',o:['Serina-carbapenemasa (KPC)','Metalo-betalactamasa','BLEE','Pérdida de porinas sin carbapenemasa'],a:1,e:'El EDTA quela el zinc que necesitan las MBL. Si el EDTA restaura la actividad, la carbapenemasa es MBL.',r:'CLSI M100'}
,{id:'m28',t:'Micro · avanzado',q:'¿Cuál es el mecanismo más frecuente de resistencia a imipenem en Pseudomonas aeruginosa?',o:['KPC','Pérdida o disminución de la porina OprD','Gen mecA','Alteración ribosomal'],a:1,e:'OprD es la puerta de entrada de los carbapenémicos. Su pérdida, con o sin AmpC y eflujo, explica la mayoría de las Pseudomonas resistentes a carbapenémicos sin carbapenemasa.',r:'Lister PD, Clin Microbiol Rev 2009'}
,{id:'m29',t:'Micro · avanzado',q:'¿Cuál es el mecanismo de resistencia de S. aureus con sensibilidad intermedia a vancomicina (VISA)?',o:['Adquisición de vanA','Engrosamiento de la pared, que atrapa la vancomicina','Betalactamasa','Pérdida de porinas'],a:1,e:'La pared engrosada con más blancos D-Ala-D-Ala libres secuestra la vancomicina. Suele acompañarse de menor sensibilidad a daptomicina.',r:'Howden BP, Clin Microbiol Rev 2010'}
,{id:'m30',t:'Micro · avanzado',q:'¿A qué se asocia el "efecto inóculo" de cefazolina en bacteremia por SAMS?',o:['Gen mecA','Betalactamasa BlaZ tipo A, que hidroliza cefazolina con inóculos altos','Pérdida de PBP1','Gen vanA'],a:1,e:'Con inóculos altos (endocarditis, abscesos) la CIM de cefazolina sube en cepas con BlaZ tipo A. Es una de las razones del debate cefazolina vs cloxacilina en infecciones de alto inóculo.',r:'Miller WR, CID 2018'}
,{id:'m31',t:'Micro · avanzado',q:'¿Qué gen plasmídico confiere resistencia transferible a colistina?',o:['mecA','mcr-1','blaKPC','ermB'],a:1,e:'mcr modifica el lípido A y reduce la unión de polimixinas. Al estar en plásmidos, puede diseminarse entre especies.',r:'Liu YY, Lancet Infect Dis 2016'}
,{id:'m32',t:'Micro · avanzado',q:'¿Cuál de estos bacilos gramnegativos es intrínsecamente resistente a polimixinas?',o:['Pseudomonas aeruginosa','Acinetobacter baumannii','Complejo Burkholderia cepacia','Klebsiella pneumoniae'],a:2,e:'Burkholderia, Proteus, Providencia, Morganella y Serratia son intrínsecamente resistentes a colistina.',r:'EUCAST Expected Resistant Phenotypes'}
,{id:'m33',t:'Micro · avanzado',q:'Un panel molecular rápido en un hemocultivo positivo detecta K. pneumoniae con CTX-M. ¿Qué haces?',o:['Mantener ceftriaxona','Pasar a carbapenémico (CTX-M es BLEE)','Agregar vancomicina','Esperar 72 h'],a:1,e:'CTX-M es la BLEE más frecuente. Ajustar con el resultado molecular adelanta el tratamiento correcto 24–48 h frente al antibiograma.',r:'Banerjee R, CID 2015'}
,{id:'m34',t:'Micro · avanzado',q:'¿Cómo identifica MALDI-TOF un microorganismo?',o:['Por secuenciación del genoma completo','Por el espectro de masas de sus proteínas, sobre todo ribosomales','Por pruebas bioquímicas automatizadas','Por PCR de 16S'],a:1,e:'Compara el perfil proteico con una base de datos. Es rápido, pero no da susceptibilidad y depende de que la base de datos esté actualizada (por ejemplo, para C. auris).',r:'Clark AE, Clin Microbiol Rev 2013'}
,{id:'m35',t:'Micro · avanzado',q:'¿Qué problema de laboratorio tiene Candida auris?',o:['No crece en medios habituales','Los sistemas bioquímicos convencionales la confunden con otras especies (como C. haemulonii)','Siempre es sensible a fluconazol','No se puede cultivar'],a:1,e:'Se identifica bien con MALDI-TOF con base de datos actualizada o con métodos moleculares. Suele ser resistente a fluconazol y persiste en superficies.',r:'CDC C. auris Identification'}
,{id:'m36',t:'Micro · avanzado',q:'En la biopsia se ven hifas anchas, cintiformes, casi sin septos y ramificadas en ángulo recto. ¿Qué sugiere?',o:['Aspergillus','Mucorales','Candida','Cryptococcus'],a:1,e:'Aspergillus muestra hifas delgadas, septadas, con ramificación en ángulo agudo (45°). Mucorales requiere anfotericina B liposomal o isavuconazol; voriconazol no sirve.',r:'Cornely OA, Lancet Infect Dis 2019'}
,{id:'m37',t:'Micro · avanzado',q:'¿Qué hongos NO detecta el beta-D-glucano?',o:['Candida y Aspergillus','Mucorales y Cryptococcus','Pneumocystis','Fusarium'],a:1,e:'Los Mucorales casi no tienen beta-glucano y Cryptococcus lo tiene cubierto por su cápsula. El galactomanano es más específico para Aspergillus.',r:'Theel ES, J Clin Microbiol 2013'}
,{id:'m38',t:'Micro · avanzado',q:'¿Qué puntos de corte usa CLSI para penicilina en S. pneumoniae?',o:['Los mismos para todas las infecciones','Distintos: meningitis (S ≤0,06 mg/L) y no meningitis (S ≤2 mg/L, IV)','Solo existe punto de corte oral','No hay puntos de corte'],a:1,e:'Una cepa con CIM 1 es resistente en meningitis, pero sensible en neumonía tratada con penicilina IV en dosis altas.',r:'CLSI M100'}

,{id:'ab1',t:'Antibiograma',ab:AB1,q:'Mira este antibiograma. ¿Qué mecanismo de resistencia sugiere?',o:['Penicilinasa (TEM-1)','BLEE','AmpC hiperproducida','Carbapenemasa'],a:1,e:'Resistente a cefalosporinas de 3ª y 4ª generación, pero sensible a cefoxitina y carbapenémicos: perfil típico de BLEE (por ejemplo, CTX-M). Con AmpC, la cefoxitina sería resistente.',r:'Jacoby GA, Clin Microbiol Rev 2009'}
,{id:'ab2',t:'Antibiograma',ab:AB1,q:'Mismo E. coli en un paciente con bacteremia. Piperacilina-tazobactam aparece sensible. ¿Qué indicas?',o:['Piperacilina-tazobactam, porque es sensible','Carbapenémico (meropenem o ertapenem)','Cefepime en dosis altas','Gentamicina sola'],a:1,e:'Que sea "sensible" in vitro no garantiza eficacia clínica. En bacteremia BLEE, el ensayo MERINO mostró más mortalidad con piperacilina-tazobactam.',r:'MERINO, JAMA 2018; IDSA AMR Guidance 2024'}
,{id:'ab3',t:'Antibiograma',ab:AB1,q:'Si este mismo E. coli causara solo una cistitis no complicada, ¿qué opción oral es preferida?',o:['Ciprofloxacino','Nitrofurantoína','TMP-SMX','Amoxicilina-clavulánico'],a:1,e:'En cistitis BLEE, IDSA prefiere nitrofurantoína (o TMP-SMX si es sensible). Ciprofloxacino y TMP-SMX están resistentes en este antibiograma.',r:'IDSA AMR Guidance 2024'}
,{id:'ab4',t:'Antibiograma',ab:AB2,q:'Enterobacter cloacae con este perfil. ¿Qué mecanismo sugiere?',o:['BLEE','AmpC cromosómica desreprimida','KPC','Pérdida de OprD'],a:1,e:'Resistencia a cefoxitina, cefalosporinas de 3ª generación y piperacilina-tazobactam, con cefepime y carbapenémicos sensibles: AmpC hiperproducida.',r:'IDSA AMR Guidance 2024'}
,{id:'ab5',t:'Antibiograma',ab:AB2,q:'Con este antibiograma, ¿qué tratamiento definitivo eliges?',o:['Ceftriaxona','Cefepime','Piperacilina-tazobactam','Amoxicilina-clavulánico'],a:1,e:'Cefepime es estable frente a AmpC y, con CIM ≤8 sin BLEE identificada, es el preferido según IDSA 2026: ahorra carbapenémicos.',r:'IDSA AMR Guidance 2024'}
,{id:'ab6',t:'Antibiograma',ab:AB2,q:'Si la CIM de cefepime hubiese sido 8 mg/L (SDD) sin BLEE identificada, ¿qué harías?',o:['Pasar siempre a carbapenémico','Cefepime en dosis alta (2 g c/8 h en infusión de 3 h) sigue siendo preferido','Ceftriaxona','Piperacilina-tazobactam'],a:1,e:'IDSA 2026 no encontró asociación entre la CIM SDD de cefepime y la producción de BLEE. Si se identifica una BLEE, ahí sí se prefiere carbapenémico.',r:'IDSA AMR Guidance 2024'}
,{id:'ab7',t:'Antibiograma',ab:AB3,q:'K. pneumoniae resistente a carbapenémicos con este perfil. ¿Qué tipo de carbapenemasa es INCOMPATIBLE con lo que ves?',o:['KPC','Metalo-betalactamasa (NDM, VIM)','Ninguna se puede descartar','Ninguna, es pérdida de porinas'],a:1,e:'Las MBL no se inhiben con avibactam, vaborbactam ni relebactam: con una MBL las tres combinaciones serían resistentes. Este patrón es típico de KPC. El método molecular lo confirma.',r:'IDSA AMR Guidance 2024'}
,{id:'ab8',t:'Antibiograma',ab:AB4,q:'Ahora todo es resistente salvo cefiderocol, incluidos los inhibidores nuevos. ¿Qué mecanismo es más probable?',o:['KPC','Metalo-betalactamasa (por ejemplo, NDM)','OXA-48 sola','BLEE'],a:1,e:'Resistencia a ceftazidima-avibactam, meropenem-vaborbactam e imipenem-relebactam orienta a MBL.',r:'IDSA AMR Guidance 2024'}
,{id:'ab9',t:'Antibiograma',ab:AB4,q:'Aztreonam aparece resistente. ¿Por qué igual se usa ceftazidima-avibactam + aztreonam contra NDM?',o:['No tiene sentido usarlo','Las MBL no hidrolizan aztreonam; la resistencia viene de BLEE/AmpC acompañantes, que avibactam inhibe','Porque aztreonam potencia a cefiderocol','Porque avibactam inhibe la NDM'],a:1,e:'Avibactam protege al aztreonam de las serina-betalactamasas coexistentes. El laboratorio puede probar la sinergia (por ejemplo, con tiras superpuestas).',r:'IDSA AMR Guidance 2024'}
,{id:'ab10',t:'Antibiograma',ab:AB5,q:'Pseudomonas resistente a imipenem, pero sensible a meropenem y al resto de betalactámicos. ¿Mecanismo más probable?',o:['Carbapenemasa','Pérdida de la porina OprD','Hiperproducción de AmpC','Bomba MexAB-OprM'],a:1,e:'La pérdida aislada de OprD afecta sobre todo al imipenem y deja intactos los demás betalactámicos.',r:'Lister PD, Clin Microbiol Rev 2009'}
,{id:'ab11',t:'Antibiograma',ab:AB5,q:'¿Qué tratamiento indicas para esta neumonía por Pseudomonas?',o:['Imipenem en dosis altas','Cefepime 2 g c/8 h en infusión extendida','Ceftolozano-tazobactam obligatoriamente','Colistina'],a:1,e:'Si sigue sensible a betalactámicos clásicos, IDSA recomienda usarlos en dosis altas e infusión extendida, guardando los nuevos para cepas DTR.',r:'IDSA AMR Guidance 2024'}
,{id:'ab12',t:'Antibiograma',ab:AB6,q:'¿Cómo se clasifica esta Pseudomonas?',o:['MDR simple','DTR (resistencia difícil de tratar)','Pan-resistente','Sensible'],a:1,e:'DTR: no sensible a piperacilina-tazobactam, ceftazidima, cefepime, aztreonam, meropenem, imipenem, ciprofloxacino y levofloxacino. No es pan-resistente porque los nuevos sí son activos.',r:'Kadri SS, CID 2018; IDSA AMR Guidance 2024'}
,{id:'ab13',t:'Antibiograma',ab:AB6,q:'¿Qué opciones son de primera línea para esta Pseudomonas DTR?',o:['Ceftolozano-tazobactam, ceftazidima-avibactam o imipenem-relebactam','Colistina + meropenem','Amikacina sola','Tigeciclina'],a:0,e:'Cefiderocol queda como alternativa. Las polimixinas son de última opción por toxicidad y peor eficacia.',r:'IDSA AMR Guidance 2024'}
,{id:'ab14',t:'Antibiograma',ab:AB7,q:'¿Para qué sirve el screening con cefoxitina en S. aureus?',o:['Detectar BLEE','Es un marcador sustituto de mecA (SAMR)','Medir la CIM de vancomicina','Detectar resistencia a clindamicina'],a:1,e:'La cefoxitina induce mejor la expresión de mecA y detecta SAMR con más sensibilidad que la oxacilina. Si es positivo, se informa resistente a todos los betalactámicos (salvo ceftarolina).',r:'CLSI M100'}
,{id:'ab15',t:'Antibiograma',ab:AB7,q:'Clindamicina aparece sensible con CIM ≤0,5, pero el D-test es positivo. ¿Qué haces?',o:['Usar clindamicina sin problema','Considerarla resistente: hay resistencia inducible (erm)','Usarla en dosis doble','Repetir el antibiograma'],a:1,e:'Con D-test positivo, la clindamicina se informa como resistente por riesgo de falla clínica.',r:'CLSI M100'}
,{id:'ab16',t:'Antibiograma',ab:AB7,q:'Este SAMR es de una bacteremia. ¿Qué opción es de primera línea?',o:['Doxiciclina','TMP-SMX','Vancomicina guiada por AUC o daptomicina','Clindamicina'],a:2,e:'Doxiciclina y TMP-SMX sirven para infección de piel y partes blandas, no como primera línea en bacteremia.',r:'IDSA SAMR 2011'}
,{id:'ab17',t:'Antibiograma',ab:AB8,q:'Resistencia a vancomicina y a teicoplanina en E. faecium. ¿Qué genotipo sugiere?',o:['vanA','vanB','mecA','erm'],a:0,e:'vanA da resistencia a ambos glicopéptidos. vanB suele dejar la teicoplanina sensible.',r:'Murray, Microbiología Médica'}
,{id:'ab18',t:'Antibiograma',ab:AB8,q:'Daptomicina aparece como SDD (CIM 2). ¿Qué significa para este E. faecium?',o:['Que no se puede usar','Que solo sirve con dosis altas: 8–12 mg/kg/día','Que se usa 4 mg/kg','Que hay que combinarla con vancomicina'],a:1,e:'CLSI clasifica la daptomicina en E. faecium como SDD con CIM ≤4, asumiendo dosis altas. Linezolid es la otra opción.',r:'CLSI M100'}
,{id:'ab19',t:'Antibiograma',ab:AB9,q:'Endocarditis por E. faecalis con resistencia de alto nivel a gentamicina. ¿Qué esquema eliges?',o:['Ampicilina + gentamicina','Ampicilina + ceftriaxona','Vancomicina sola','Ceftriaxona sola'],a:1,e:'Con HLAR se pierde la sinergia con gentamicina. Ampicilina + ceftriaxona es eficaz y evita la nefrotoxicidad.',r:'AHA 2015'}
,{id:'ab20',t:'Antibiograma',ab:AB10,q:'Meningitis por neumococo con estas CIM. ¿Qué tratamiento corresponde?',o:['Penicilina en dosis altas','Ceftriaxona 2 g c/12 h + vancomicina','Levofloxacino solo','Ceftriaxona 1 g c/24 h'],a:1,e:'Penicilina es resistente con puntos de corte meníngeos, y ceftriaxona solo intermedia. Se usa ceftriaxona en dosis meníngeas más vancomicina.',r:'IDSA meningitis 2004; CLSI M100'}
,{id:'ab21',t:'Antibiograma',ab:AB10,q:'¿Por qué la misma CIM de penicilina (1 mg/L) es R en meningitis y S en neumonía?',o:['Error del laboratorio','Los puntos de corte consideran la concentración alcanzable en el sitio: en LCR es muy baja','Porque cambia la bacteria','Porque en neumonía se usa vía oral'],a:1,e:'La interpretación integra CIM, farmacocinética y sitio de infección. Por eso CLSI tiene puntos de corte distintos según el sitio.',r:'CLSI M100'}
,{id:'ab22',t:'Antibiograma',ab:AB11,q:'C. glabrata con fluconazol SDD. ¿Qué tratamiento inicial prefieres para la candidemia?',o:['Fluconazol 400 mg/día','Equinocandina','Voriconazol','Flucitosina sola'],a:1,e:'SDD significa que el fluconazol solo podría servir con dosis altas (800 mg/día). En candidemia por C. glabrata se prefiere equinocandina.',r:'IDSA Candida 2016'}
,{id:'ab23',t:'Antibiograma',ab:AB12,q:'E. coli resistente a ampicilina, pero sensible a amoxicilina-clavulánico y cefazolina. ¿Qué mecanismo sugiere?',o:['BLEE','Penicilinasa de amplio espectro (TEM-1)','AmpC','Carbapenemasa'],a:1,e:'La penicilinasa hidroliza ampicilina, pero se inhibe con clavulánico y no afecta a las cefalosporinas. Es el mecanismo más común en E. coli.',r:'Murray, Microbiología Médica'}
,{id:'ab24',t:'Antibiograma',ab:AB12,q:'¿Para qué sirve informar la cefazolina en un urocultivo de cistitis?',o:['Para tratar con cefazolina IV','Como marcador sustituto de cefalosporinas orales (cefalexina, cefadroxilo) en ITU no complicada','No sirve','Para detectar BLEE'],a:1,e:'CLSI permite usar la cefazolina como sustituto para predecir la actividad de cefalosporinas orales en ITU no complicada por E. coli, Klebsiella y P. mirabilis.',r:'CLSI M100'}
,{id:'ab25',t:'Antibiograma',ab:AB13,q:'Proteus mirabilis con imipenem intermedio y meropenem sensible. ¿Qué piensas?',o:['Carbapenemasa','Es un comportamiento intrínseco de Proteus frente a imipenem','Error técnico','Pérdida de OprD'],a:1,e:'Proteus, Morganella y Providencia tienen CIM de imipenem naturalmente más altas por baja afinidad de sus PBP. No indica carbapenemasa. Nitrofurantoína y colistina R también son intrínsecas.',r:'EUCAST Expected Resistant Phenotypes'}
,{id:'ab26',t:'Antibiograma',q:'Un antibiograma muestra CIM de ceftriaxona 1 y de meropenem 0,25. ¿Es correcto elegir meropenem porque su CIM es menor?',o:['Sí, siempre se elige la CIM más baja','No: cada fármaco tiene su propio punto de corte y su farmacocinética; las CIM no se comparan entre fármacos','Sí, si la diferencia es mayor de 2 diluciones','Solo en hemocultivos'],a:1,e:'Lo que importa es la distancia de la CIM a su punto de corte y si el fármaco llega al sitio. Elegir por "CIM más baja" lleva a usar antibióticos de espectro innecesariamente amplio.',r:'CLSI M100; EUCAST'}
,{id:'ab27',t:'Antibiograma',q:'Una CIM de meropenem de 2 mg/L en Pseudomonas, con punto de corte S ≤2. ¿Cómo se interpreta?',o:['Resistente','Sensible','Intermedio','No interpretable'],a:1,e:'Una CIM igual al punto de corte se clasifica en esa categoría. En el límite conviene usar dosis altas e infusión extendida.',r:'CLSI M100'}
,{id:'ab28',t:'Antibiograma',q:'S. aureus con penicilina sensible (CIM ≤0,12). ¿Qué necesitas antes de tratar con penicilina?',o:['Nada más','Confirmar que no produce betalactamasa (prueba de nitrocefina o zona de borde)','Un D-test','Repetir el screening de cefoxitina'],a:1,e:'Algunas cepas con blaZ dan CIM baja. CLSI exige una prueba de betalactamasa negativa para informarla como sensible a penicilina.',r:'CLSI M100'}
,{id:'ab29',t:'Antibiograma',q:'El laboratorio informa los carbapenémicos solo cuando el bacilo gramnegativo es resistente a cefalosporinas. ¿Cómo se llama esta estrategia?',o:['Informe en cascada (selectivo)','Antibiograma acumulado','Test de sinergia','Regla experta de resistencia intrínseca'],a:0,e:'El informe en cascada es una herramienta PROA: muestra primero los fármacos de menor espectro y reduce el uso de los de amplio espectro.',r:'IDSA/SHEA Stewardship 2016'}
,{id:'ab30',t:'Antibiograma',q:'¿Para qué sirve el antibiograma acumulado institucional?',o:['Para tratar al paciente individual en vez de su cultivo','Para orientar la terapia empírica local según la sensibilidad de los aislados del último año','Para detectar brotes en horas','Para reemplazar al antibiograma individual'],a:1,e:'Resume el porcentaje de sensibilidad por microorganismo, usando solo el primer aislado por paciente (CLSI M39). Se usa para elegir esquemas empíricos y protocolos.',r:'CLSI M39'}

,{id:'p1',t:'Profilaxis y alergia',q:'¿Cuándo debe administrarse la cefazolina profiláctica?',o:['Al cerrar la herida','Dentro de los 60 minutos previos a la incisión','La noche anterior','24 h antes de la cirugía'],a:1,e:'Dentro de 60 min antes de la incisión. Vancomicina y quinolonas, por su infusión más larga, se inician 60–120 min antes.',r:'ASHP/IDSA/SIS/SHEA 2013'}
,{id:'p2',t:'Profilaxis y alergia',q:'Cirugía que se prolonga. ¿Cada cuánto se redosifica la cefazolina intraoperatoria?',o:['Cada 1 h','Cada 4 h, o si el sangrado supera 1.500 mL','Cada 8 h','No se redosifica'],a:1,e:'Se redosifica cada dos vidas medias (cefazolina: 4 h) o con sangrado >1.500 mL.',r:'ASHP/IDSA/SIS/SHEA 2013'}
,{id:'p3',t:'Profilaxis y alergia',q:'Paciente de 130 kg. ¿Dosis de cefazolina profiláctica?',o:['1 g','2 g','3 g','30 mg/kg sin tope'],a:2,e:'2 g en adultos y 3 g si pesa ≥120 kg.',r:'ASHP/IDSA/SIS/SHEA 2013'}
,{id:'p4',t:'Profilaxis y alergia',q:'¿Cuánto debe durar la profilaxis en cirugía limpia o limpia-contaminada?',o:['Hasta retirar los drenajes','Dosis única o máximo 24 h','5 días','7 días'],a:1,e:'Prolongarla no reduce la infección de sitio quirúrgico y aumenta la resistencia, C. difficile y la nefrotoxicidad. Los drenajes no justifican extenderla.',r:'CDC 2017; OMS 2016'}
,{id:'p5',t:'Profilaxis y alergia',q:'Cirugía colorrectal electiva. ¿Qué profilaxis es adecuada?',o:['Cefazolina sola','Cefazolina + metronidazol','Vancomicina sola','Ciprofloxacino solo'],a:1,e:'Hay que cubrir enterobacterias y anaerobios: cefazolina + metronidazol (alternativas: cefoxitina o ertapenem), además de la preparación oral si el protocolo la incluye.',r:'ASHP/IDSA/SIS/SHEA 2013'}
,{id:'p6',t:'Profilaxis y alergia',q:'Cirugía cardíaca en paciente colonizado por SAMR. ¿Qué profilaxis?',o:['Vancomicina en reemplazo de cefazolina','Cefazolina + vancomicina','Cefazolina sola','Clindamicina'],a:1,e:'Vancomicina es menos eficaz que cefazolina contra SAMS y no cubre gramnegativos, por eso se agrega en vez de reemplazar. Dosis: 15 mg/kg, iniciando 60–120 min antes.',r:'ASHP/IDSA/SIS/SHEA 2013'}
,{id:'p7',t:'Profilaxis y alergia',q:'¿Cuáles son los componentes del puntaje PEN-FAST?',o:['Edad, sexo y peso','Reacción hace ≤5 años, anafilaxia/angioedema o reacción cutánea grave, y necesidad de tratamiento','IgE total y eosinófilos','Número de dosis recibidas'],a:1,e:'≤5 años (2 puntos), anafilaxia/angioedema o SCAR (2 puntos), requirió tratamiento (1 punto). Menos de 3 puntos: bajo riesgo.',r:'Trubiano JA, JAMA Intern Med 2020'}
,{id:'p8',t:'Profilaxis y alergia',q:'Alergia a penicilina con PEN-FAST de 1 punto. ¿Qué estrategia tiene respaldo?',o:['Evitar betalactámicos de por vida','Prueba de provocación oral directa con amoxicilina','Solo test cutáneo','Desensibilización'],a:1,e:'El ensayo PALACE mostró que la provocación oral directa no es inferior al test cutáneo previo en pacientes de bajo riesgo.',r:'Copaescu AM, JAMA Intern Med 2023 (PALACE)'}
,{id:'p9',t:'Profilaxis y alergia',q:'Antecedente de síndrome de Stevens-Johnson por amoxicilina. ¿Qué haces?',o:['Provocación oral directa','Evitar el fármaco culpable y no hacer provocación','Test cutáneo y luego provocación','Desensibilizar'],a:1,e:'Las reacciones cutáneas graves (SJS/NET, DRESS) contraindican la provocación y la desensibilización. Derivar a alergología.',r:'Khan DA, J Allergy Clin Immunol 2022'}
,{id:'p10',t:'Profilaxis y alergia',q:'¿De qué depende principalmente la reactividad cruzada entre penicilinas y cefalosporinas?',o:['Del anillo betalactámico','De la similitud de la cadena lateral R1','De la vía de administración','Del peso molecular'],a:1,e:'Por ejemplo, amoxicilina comparte cadena lateral con cefadroxilo y cefalexina. Cefazolina tiene una cadena lateral única.',r:'Khan DA, J Allergy Clin Immunol 2022'}
,{id:'p11',t:'Profilaxis y alergia',q:'¿Con qué betalactámico comparte cadena lateral el aztreonam?',o:['Cefazolina','Ceftazidima','Meropenem','Amoxicilina'],a:1,e:'Precaución con aztreonam en pacientes alérgicos a ceftazidima (y cefiderocol, que comparte una cadena similar).',r:'Khan DA, J Allergy Clin Immunol 2022'}
,{id:'p12',t:'Profilaxis y alergia',q:'Alergia no grave a penicilina. ¿Se puede usar un carbapenémico?',o:['Nunca','Sí: la reactividad cruzada es menor al 1%','Solo con premedicación','Solo con desensibilización'],a:1,e:'Puede usarse sin test previo en reacciones no graves. Las etiquetas de alergia mal fundadas aumentan el uso de vancomicina y quinolonas.',r:'Khan DA, J Allergy Clin Immunol 2022'}

,{id:'t1',t:'TARV',q:'¿Cuál es un esquema de inicio recomendado para la mayoría de las personas con VIH?',o:['Efavirenz/TDF/FTC','Bictegravir/FTC/TAF','Lopinavir/ritonavir + AZT/3TC','Raltegravir en monoterapia'],a:1,e:'Los esquemas basados en inhibidores de integrasa de segunda generación son la primera línea: BIC/FTC/TAF, o dolutegravir + TDF o TAF + FTC o 3TC.',r:'DHHS Adult ARV Guidelines; IAS-USA 2024'}
,{id:'t2',t:'TARV',q:'¿En qué paciente NO usarías dolutegravir/lamivudina (biterapia) al inicio?',o:['Carga viral de 30.000 copias/mL','Coinfección con hepatitis B','Mujer en edad fértil','CD4 de 450'],a:1,e:'Tampoco con carga viral >500.000 copias/mL, ni antes de tener el genotipo y la serología de VHB. En VHB hacen falta dos fármacos activos: TDF o TAF + FTC o 3TC.',r:'DHHS Adult ARV Guidelines'}
,{id:'t3',t:'TARV',q:'¿Qué examen es obligatorio antes de indicar abacavir?',o:['HLA-B*5701','Genotipo de CYP2C19','Carga viral de VHC','Densitometría'],a:0,e:'HLA-B*5701 positivo predice reacción de hipersensibilidad potencialmente fatal. Si es positivo, abacavir está contraindicado de por vida.',r:'Mallal S, NEJM 2008 (PREDICT-1)'}
,{id:'t4',t:'TARV',q:'Paciente en dolutegravir que toma carbonato de calcio y sulfato ferroso. ¿Qué indicas?',o:['Nada, no interactúan','Dolutegravir 2 h antes o 6 h después de los cationes, o juntos con comida','Suspender el calcio de por vida','Duplicar el dolutegravir'],a:1,e:'Los cationes polivalentes (Ca, Fe, Mg, Al, Zn) quelan a los inhibidores de integrasa y reducen su absorción. Aplica también a bictegravir y a antiácidos.',r:'Ficha técnica Tivicay; DHHS'}
,{id:'t5',t:'TARV',q:'Paciente con VIH en TARV con bictegravir que debe iniciar tratamiento para tuberculosis con rifampicina. ¿Qué haces?',o:['Mantener bictegravir','Cambiar a dolutegravir 50 mg c/12 h + TDF/FTC','Agregar ritonavir','Suspender el TARV hasta terminar la TB'],a:1,e:'Rifampicina induce fuertemente UGT1A1 y CYP3A. Bictegravir está contraindicado. Dolutegravir se usa duplicado (50 mg c/12 h) hasta 2 semanas después de terminar la rifampicina. TAF con rifampicina no se recomienda; se prefiere TDF.',r:'DHHS Adult ARV Guidelines'}
,{id:'t6',t:'TARV',q:'A las 4 semanas de iniciar dolutegravir, la creatinina subió de 0,9 a 1,05 mg/dL. ¿Qué significa?',o:['Nefrotoxicidad, suspender','Inhibición de la secreción tubular de creatinina (OCT2), sin caída real de la filtración','Rabdomiólisis','Error de laboratorio'],a:1,e:'Dolutegravir, bictegravir, cobicistat y rilpivirina inhiben OCT2 o MATE1 y suben la creatinina 0,1–0,15 mg/dL sin daño renal. Un alza mayor o progresiva sí debe estudiarse.',r:'Ficha técnica Tivicay'}
,{id:'t7',t:'TARV',q:'Paciente diabético en metformina que inicia dolutegravir. ¿Qué precaución tomas?',o:['Ninguna','Vigilar y limitar la dosis de metformina: dolutegravir aumenta sus niveles','Suspender metformina','Duplicar metformina'],a:1,e:'Dolutegravir inhibe OCT2 y MATE1, por donde se elimina la metformina. Algunos sugieren no superar 1.000 mg/día.',r:'Ficha técnica Tivicay'}
