,{g:'arv',n:'Darunavir/cobicistat',c:'IP potenciado',esp:'VIH-1. Alta barrera genética.',d:'800/150 mg c/24 h con comida. Con mutaciones a darunavir: darunavir 600 mg + ritonavir 100 mg c/12 h.',aj:'No.',pk:'—',ojo:'Inhibición potente de CYP3A4: corticoides inhalados (fluticasona), simvastatina, amiodarona, DOAC. Contiene sulfonamida.'}
,{g:'arv',n:'Cabotegravir + rilpivirina inyectable',c:'INSTI + ITINN de acción prolongada',esp:'VIH-1, como mantención en pacientes suprimidos.',d:'Mensual: 600/900 mg IM el mes 1, luego 400/600 mg cada mes. Bimensual: 600/900 mg IM en los meses 1 y 2, luego cada 2 meses.',aj:'No.',pk:'—',ojo:'No cubre VHB. Contraindicado con rifampicina. Respetar la ventana de ±7 días; los atrasos aumentan el riesgo de resistencia.'}
,{g:'arv',n:'Lenacapavir',c:'Inhibidor de cápside',esp:'VIH-1 multirresistente (tratamiento) y PrEP.',d:'Subcutáneo cada 6 meses, tras una carga oral (el esquema exacto varía según la indicación; revisar ficha técnica).',aj:'No.',pk:'—',ojo:'Nódulos en el sitio de inyección. Inductores potentes de CYP3A contraindicados.'}
,{g:'arv',n:'Efavirenz',c:'ITINN',esp:'VIH-1. Hoy es alternativa, no primera línea.',d:'600 mg c/24 h al acostarse, en ayunas.',aj:'No.',pk:'—',ojo:'Efectos neuropsiquiátricos (sueños vívidos, mareo, depresión). Inductor de CYP3A4. Baja barrera genética.'}

,{g:'tb',n:'Isoniazida (H)',c:'Antituberculoso de primera línea',esp:'M. tuberculosis, M. kansasii. Bactericida temprano.',d:'5 mg/kg/día (máx. 300 mg). Más piridoxina 25–50 mg en pacientes de riesgo.',aj:'No.',pk:'Cmáx/CIM',ojo:'Hepatotoxicidad (más en edad avanzada, alcohol, acetiladores lentos), neuropatía periférica. Inhibe fenitoína.'}
,{g:'tb',n:'Rifampicina (R)',c:'Rifamicina',esp:'M. tuberculosis, MAC, M. kansasii, S. aureus (en combinación).',d:'10 mg/kg/día (máx. 600 mg), en ayunas.',aj:'No.',pk:'fAUC/CIM',ojo:'Inductor muy potente: warfarina, DOAC, anticonceptivos, tacrolimus, azoles, TARV. Fluidos naranja. Hepatotoxicidad, trombocitopenia.'}
,{g:'tb',n:'Pirazinamida (Z)',c:'Antituberculoso de primera línea',esp:'M. tuberculosis (actúa en medio ácido). M. bovis es intrínsecamente resistente.',d:'25 mg/kg/día (rango 20–30).',aj:'Sí: 25–35 mg/kg 3 veces por semana con ClCr <30 o en diálisis.',pk:'fAUC/CIM',ojo:'Hepatotoxicidad, hiperuricemia, artralgias.'}
,{g:'tb',n:'Etambutol (E)',c:'Antituberculoso de primera línea',esp:'M. tuberculosis, MAC, M. kansasii.',d:'TB: 15 mg/kg/día (rango 15–20). MAC intermitente: 25 mg/kg 3 veces por semana.',aj:'Sí: 15–25 mg/kg 3 veces por semana con ClCr <30 o en diálisis.',pk:'Cmáx/CIM',ojo:'Neuritis óptica: agudeza visual y test de colores basal y mensual.'}
,{g:'tb',n:'HRZE combinado',c:'Dosis fija combinada (75/150/400/275 mg)',esp:'Fase intensiva de TB sensible.',d:'Por peso: 30–37 kg → 2 comp.; 38–54 kg → 3; 55–70 kg → 4; ≥71 kg → 5. Fase de continuación con HR (75/150) en las mismas bandas.',aj:'No usar en insuficiencia renal grave (separar componentes).',pk:'—',ojo:'Revisa la norma del programa nacional para la presentación disponible.'}
,{g:'tb',n:'Rifapentina',c:'Rifamicina de vida media larga',esp:'Infección latente (3HP, 1HP) y esquema de 4 meses (2HPZM/2HPM).',d:'3HP: 900 mg + isoniazida 900 mg una vez por semana por 12 semanas (≥50 kg). Esquema de 4 meses: 1.200 mg diarios.',aj:'No.',pk:'—',ojo:'Reacción tipo gripal o de hipersensibilidad en 3HP. Mismas interacciones que rifampicina.'}
,{g:'tb',n:'Rifabutina',c:'Rifamicina',esp:'M. tuberculosis, MAC.',d:'5 mg/kg/día (300 mg). Con IP potenciado: 150 mg/día.',aj:'Reducir 50% si ClCr <30.',pk:'—',ojo:'Menos inductora que rifampicina. Uveítis y neutropenia con niveles altos (claritromicina, ritonavir).'}
,{g:'tb',n:'Bedaquilina',c:'Diarilquinolina (inhibe ATP sintasa)',esp:'M. tuberculosis RR, MDR y XDR. Algunas MNT.',d:'400 mg diarios por 2 semanas, luego 200 mg 3 veces por semana (o 200 mg diarios por 8 semanas y luego 100 mg diarios). Con comida.',aj:'No.',pk:'—',ojo:'Prolongación del QT. Hepatotoxicidad. Vida media de meses. Rifampicina la reduce.'}
,{g:'tb',n:'Pretomanid',c:'Nitroimidazol',esp:'M. tuberculosis, solo en BPaL o BPaLM.',d:'200 mg diarios por 26 semanas, con comida.',aj:'No.',pk:'—',ojo:'Hepatotoxicidad, neuropatía (por linezolid). No usar en monoterapia.'}
,{g:'tb',n:'Moxifloxacino / levofloxacino (TB)',c:'Fluoroquinolonas',esp:'TB RR o MDR, monorresistencia a isoniazida, esquema puente por hepatotoxicidad.',d:'Moxifloxacino 400 mg/día. Levofloxacino 750–1.000 mg/día (15–20 mg/kg).',aj:'Levofloxacino sí; moxifloxacino no.',pk:'fAUC/CIM',ojo:'QT, tendinopatía, disglucemia. Quelación con cationes.'}
,{g:'tb',n:'Azitromicina / claritromicina (MNT)',c:'Macrólidos',esp:'MAC, M. abscessus subsp. massiliense, M. marinum, M. kansasii.',d:'MAC no cavitario: azitromicina 500–600 mg 3 veces por semana. Cavitario: 250–500 mg diarios. Claritromicina: 500 mg c/12 h.',aj:'Claritromicina sí (ClCr <30).',pk:'—',ojo:'Nunca en monoterapia. QT, ototoxicidad. Claritromicina inhibe CYP3A4; rifampicina reduce sus niveles.'}
,{g:'tb',n:'Amikacina liposomal inhalada',c:'Aminoglucósido inhalado',esp:'MAC pulmonar refractario (cultivo positivo tras 6 meses de esquema estándar).',d:'590 mg inhalados una vez al día, agregada al esquema de base.',aj:'No.',pk:'—',ojo:'Disfonía, tos, broncoespasmo. Vigilar audición y función renal.'}
,{g:'tb',n:'Clofazimina',c:'Riminofenazina',esp:'TB MDR, MAC y M. abscessus (fármaco acompañante), lepra.',d:'100 mg/día con comida.',aj:'No.',pk:'—',ojo:'Coloración rojiza o café de piel y fluidos, QT, molestias digestivas.'}

,{g:'pkpd',n:'Betalactámicos',c:'Tiempo-dependientes',esp:'Índice: %fT>CIM.',d:'Meta clásica: penicilinas ~50%, cefalosporinas ~60–70%, carbapenémicos ~40%. Paciente crítico: 100% fT>CIM (algunos centros hasta 4×CIM).',aj:'Optimizar con infusión extendida o continua, dosis más frecuentes y TDM.',pk:'Hidrofílicos · Vd ~0,2–0,3 L/kg · eliminación renal',ojo:'Efecto post-antibiótico mínimo en gramnegativos (salvo carbapenémicos). Neurotoxicidad con niveles altos.'}
,{g:'pkpd',n:'Aminoglucósidos',c:'Concentración-dependientes',esp:'Índice: Cmáx/CIM (también AUC/CIM).',d:'Meta: Cmáx/CIM ≥8–10. Crítico: gentamicina 7 mg/kg, amikacina 25–30 mg/kg.',aj:'Intervalo extendido según niveles (Hartford o bayesiano).',pk:'Hidrofílicos · Vd ~0,25 L/kg (mayor en sepsis) · renal',ojo:'Efecto post-antibiótico prolongado. Valle bajo reduce nefrotoxicidad. Mala penetración pulmonar.'}
,{g:'pkpd',n:'Fluoroquinolonas',c:'Concentración-dependientes con tiempo',esp:'Índice: fAUC/CIM (y Cmáx/CIM).',d:'Meta: gramnegativos fAUC/CIM ≥100–125; neumococo ~30–50.',aj:'Dosis altas una vez al día (levofloxacino 750 mg).',pk:'Lipofílicos · Vd alto · levofloxacino renal, moxifloxacino hepático',ojo:'Ventana de selección de mutantes. Excelente biodisponibilidad oral.'}
,{g:'pkpd',n:'Glicopéptidos',c:'Exposición-dependientes',esp:'Índice: AUC24/CIM.',d:'Vancomicina AUC 400–600 mg·h/L (CIM 1). Teicoplanina: valle ≥15–20 mg/L (≥20–30 en infecciones óseas o endocarditis).',aj:'Carga con peso real; mantención por bayesiano o 2 niveles.',pk:'Hidrofílicos · renal · teicoplanina muy unida a proteínas',ojo:'AUC >600 se asocia a nefrotoxicidad. Mala penetración al ELF.'}
,{g:'pkpd',n:'Oxazolidinonas y lipopéptidos',c:'Linezolid / daptomicina',esp:'Linezolid: fAUC/CIM 80–120. Daptomicina: Cmáx/CIM y AUC/CIM.',d:'TDM linezolid: valle 2–7 mg/L. Daptomicina: valle <24,3 mg/L para menos riesgo de CPK.',aj:'Linezolid sin ajuste renal pero acumula metabolitos; daptomicina c/48 h si ClCr <30.',pk:'Linezolid lipofílico · daptomicina muy unida a proteínas',ojo:'Linezolid: trombocitopenia con valle alto. Daptomicina: inactivada por surfactante.'}
,{g:'pkpd',n:'Polimixinas',c:'Exposición-dependientes',esp:'Índice: fAUC/CIM.',d:'Meta de concentración promedio en estado estacionario ~2 mg/L. Carga obligatoria.',aj:'Colistina por ClCr; polimixina B sin ajuste.',pk:'Ventana terapéutica muy estrecha',ojo:'Nefrotoxicidad dependiente de exposición. Mala penetración pulmonar sistémica.'}
,{g:'pkpd',n:'Azoles y equinocandinas',c:'Antifúngicos',esp:'Azoles: fAUC/CIM (fluconazol AUC/CIM ~100). Equinocandinas: Cmáx/CIM y AUC/CIM.',d:'TDM: voriconazol valle 1–5,5 mg/L; posaconazol >0,7 profilaxis y >1 tratamiento; itraconazol >1.',aj:'Fluconazol renal; resto hepático.',pk:'Voriconazol cinética no lineal (CYP2C19)',ojo:'Interacciones CYP3A4 con inmunosupresores y antineoplásicos.'}
,{g:'pkpd',n:'Paciente crítico: cambios PK',c:'Resumen',esp:'↑ Vd (fluidos, fuga capilar, hipoalbuminemia); ↑ clearance (ARC ≥130 mL/min); ↓ clearance (lesión renal o hepática); TRRC y ECMO.',d:'Carga completa siempre. Primeras 24–48 h sin reducir por función renal (salvo aminoglucósidos y colistina con ajuste de intervalo).',aj:'Medir ClCr en orina de 8 h. TDM de betalactámicos, vancomicina, aminoglucósidos y azoles.',pk:'Más afectados: hidrofílicos',ojo:'Subdosificar en las primeras horas aumenta la mortalidad; sobredosificar luego da neurotoxicidad.'}

,{g:'trial',n:'POET',c:'Iversen K, NEJM 2019',L:['Población','Intervención y resultado','Criterios clave','Diseño','Para tu práctica'],esp:'400 adultos con endocarditis izquierda estable (estreptococos 49%, E. faecalis 24%, S. aureus 22%, coagulasa negativos 6%). Sin SAMR. 27% prótesis valvular, 38% operados.',d:'Tras ≥10 días IV, aleatorizados a seguir IV vs pasar a oral (2 fármacos de distinta familia). Compuesto a 6 meses: 9,0% oral vs 12,1% IV. Estadía post aleatorización: 3 vs 19 días. A 5 años, compuesto menor con oral (26,4% vs 38,2%).',aj:'Afebril, PCR y leucocitos en descenso, ≥7 días post cirugía, ETE sin absceso, sin IMC >40 ni malabsorción.',pk:'Multicéntrico, abierto, de no inferioridad (margen 10 puntos), Dinamarca. Niveles plasmáticos de los fármacos orales.',ojo:'Aplica a pacientes estables con seguimiento ambulatorio frecuente y TDM. No extrapolar a SAMR ni a pacientes inestables.'}
,{g:'trial',n:'OVIVA',c:'Li HK, NEJM 2019',L:['Población','Intervención y resultado','Criterios clave','Diseño','Para tu práctica'],esp:'1.054 adultos con infección osteoarticular compleja (osteomielitis, prótesis, osteosíntesis, espondilodiscitis). 61% con material. S. aureus 38%, coagulasa negativos 27%.',d:'Oral vs IV durante las primeras 6 semanas, iniciado ≤7 días post cirugía. Falla al año: 13,2% oral vs 14,6% IV. Complicaciones de catéter: 1,0% vs 9,4%. Estadía 11 vs 14 días.',aj:'Antibiótico elegido por infectólogo según sensibilidad y biodisponibilidad. Quinolonas fueron lo más usado. Rifampicina adyuvante permitida.',pk:'26 centros del Reino Unido, abierto, no inferioridad (margen 7,5 puntos).',ojo:'Respalda pasar a oral precozmente en infecciones osteoarticulares cuando hay un esquema oral activo y biodisponible.'}
,{g:'trial',n:'SABATO',c:'Kaasch AJ, Lancet Infect Dis 2024',L:['Población','Intervención y resultado','Criterios clave','Diseño','Para tu práctica'],esp:'213 adultos con bacteriemia por S. aureus de bajo riesgo (8% SAMR). Focos: catéter periférico 44%, CVC 23%, piel y partes blandas 22%.',d:'Tras 5–7 días de IV: oral (TMP-SMX; alternativa clindamicina o linezolid) vs IV, hasta 14 días totales. Complicaciones a 90 días: 13% vs 12%. Estadía 12 vs 16 días.',aj:'Hemocultivos de control negativos a las 24–96 h; excluidos foco profundo, shock, bacteriemia >72 h, fiebre persistente, catéter no retirado, prótesis valvular, usuarios de drogas IV, inmunosupresión grave.',pk:'31 hospitales europeos, abierto, no inferioridad (margen 10 puntos). Detenido antes por reclutamiento lento.',ojo:'Solo ~4% de los evaluados era elegible. Las 2 muertes atribuibles fueron en el grupo oral: seguimiento estrecho.'}

,{n:'Cefepime-enmetazobactam',c:'Cefalosporina + inhibidor',esp:'Enterobacterales BLEE (CTX-M). No KPC, MBL, OXA-48, P. aeruginosa DTR ni CRAB.',d:'2 g/0,5 g c/8 h IV en infusión de 2 h. ITU complicada: 7 días.',aj:'Sí, renal.',pk:'%fT>CIM',ojo:'Alternativa ahorradora de carbapenémicos para BLEE. Aprobado por la FDA en 2024.'}
,{n:'Cefepime-zidebactam',c:'Cefalosporina + potenciador de betalactámico',esp:'BLEE, KPC, MBL (NDM, VIM, IMP), OXA-48, P. aeruginosa DTR (incluida VIM) y CRAB, según la matriz de la revisión.',d:'3 g c/8 h IV en infusión de 1 h.',aj:'Sí, renal.',pk:'%fT>CIM',ojo:'Aprobado por la FDA en 2026. Reservar para cuando no se puedan usar otros betalactámicos.'}
,{g:'trial',n:'Resistencia en BGN (revisión)',c:'Tamma PD, NEJM 2026',L:['Mensajes clave','Tratamiento preferido por mecanismo','Conceptos','Matriz de actividad','Para tu práctica'],esp:'Resistencia por menor permeabilidad, eflujo, cambio de blanco e inactivación enzimática. CTX-M >95% de BLEE. KPC ~80% de CPE en EE. UU. y muy prevalente en Sudamérica. Más del 90% de CRAB produce OXA.',d:'BLEE invasiva: carbapenémico. Cistitis BLEE: nitrofurantoína o TMP-SMX. KPC: ceftazidima-avibactam o meropenem-vaborbactam. NDM: aztreonam-avibactam, cefepime-zidebactam o cefiderocol. OXA-48: ceftazidima-avibactam. P. aeruginosa DTR: ceftazidima-avibactam o ceftolozano-tazobactam. CRAB: sulbactam-durlobactam + imipenem o meropenem.',aj:'DTR: resistente a todos los betalactámicos tradicionales y a quinolonas. La resistencia no alarga la duración del tratamiento.',pk:'Solo BLEE: cefepime-enmetazobactam. Todo: cefiderocol y cefepime-zidebactam. MBL: aztreonam-avibactam. CRAB: sulbactam-durlobactam.',ojo:'Identificar la enzima guía el tratamiento. Reservar cefiderocol y cefepime-zidebactam. Repetir sensibilidad en P. aeruginosa DTR por emergencia de resistencia (≥20%).'}

,{g:'trial',n:'CACTUS',c:'Shields RK, Lancet Infect Dis 2025',L:['Población','Intervención y resultado','Criterios clave','Diseño','Para tu práctica'],esp:'420 adultos (210 pares) con neumonía (83%) o bacteriemia (17%) por P. aeruginosa multirresistente. 80% en UCI, 70% ventilados, 40% con vasopresores.',d:'Ceftolozano-tazobactam vs ceftazidima-avibactam. Éxito clínico a 30 días: 61% vs 52% (OR ajustado 2,07). Neumonía: 63% vs 51% (OR 2,34). Bacteriemia: sin diferencia. Mortalidad a 30 y 90 días: sin diferencia. Resistencia emergente: 22% vs 23%.',aj:'Pareo por centro, tipo de infección, sepsis o shock y tiempo al inicio. Excluyó fibrosis quística, focos de tratamiento largo y aislados no sensibles.',pk:'Observacional retrospectivo, 28 hospitales de EE. UU., 2016–2023. Financiado por el fabricante de ceftolozano-tazobactam.',ojo:'En neumonía por Pseudomonas resistente, preferir ceftolozano-tazobactam a dosis de 3 g c/8 h. Repetir sensibilidad si hay recurrencia.'}
,{g:'trial',n:'C/T vs CZA: metaanálisis',c:'Li P, Int J Infect Dis 2026',L:['Población','Resultados','Criterios clave','Diseño','Para tu práctica'],esp:'22 estudios, 3.361 pacientes con P. aeruginosa MDR o DTR: 10 cohortes (comparación directa) y 12 ensayos (comparación indirecta vía carbapenémicos).',d:'Mortalidad ajustada: OR 1,00 (sin diferencia; los datos crudos favorecían a ceftazidima-avibactam). Respuesta clínica y erradicación: sin diferencia. Recurrencia a 30–90 días: OR 0,46 a favor de ceftolozano-tazobactam. Daño renal y resistencia emergente: sin diferencia.',aj:'Excluyó tratamientos <48 h, fibrosis quística y aislados con CIM basal >8 mg/L. Resistencia emergente: aumento ≥4 veces de la CIM en 90 días o CIM ≥8 mg/L.',pk:'Revisión sistemática con metaanálisis (PRISMA, PROSPERO), riesgo de sesgo con ROBINS-I y certeza con GRADE.',ojo:'Eficacia comparable; evidencia moderada de menos recurrencia con ceftolozano-tazobactam. Certeza moderada a muy baja: faltan ensayos directos.'}

,{g:'sx',n:'Prostatitis bacteriana aguda',c:'Síndrome clínico',L:['Agentes','Tratamiento y dosis','Duración','Farmacocinética clave','Ojo con'],esp:'E. coli (~2/3), otros Enterobacterales, Klebsiella, P. aeruginosa (asociada a la atención de salud), E. faecalis. Post biopsia: E. coli resistente a quinolonas y BLEE.',d:'Empírico grave: ceftriaxona 1–2 g/día, piperacilina-tazobactam 4,5 g c/6–8 h o carbapenémico si hay riesgo de BLEE. Oral al mejorar: ciprofloxacino 500–750 mg c/12 h, levofloxacino 500–750 mg/día o TMP-SMX 160/800 mg c/12 h.',aj:'Al menos 2 semanas (7 días fueron inferiores a 14 en hombres con ITU febril).',pk:'Capilares no fenestrados: penetran bien los liposolubles (quinolonas, TMP-SMX). Betalactámicos y nitrofurantoína penetran mal; en la fase aguda la inflamación mejora algo la penetración.',ojo:'Absceso en 3–22%: drenar si mide >2 cm. Evitar el masaje prostático. Preferir cistostomía o sonda Coudé. S. aureus sugiere siembra hematógena.'}
,{g:'sx',n:'Prostatitis bacteriana crónica',c:'Síndrome clínico',L:['Agentes','Tratamiento y dosis','Duración','Farmacocinética clave','Ojo con'],esp:'E. coli (gramnegativo más común), Enterococcus spp. (~40%), otros Enterobacterales. En jóvenes: considerar Chlamydia y M. genitalium.',d:'Primera línea: fluoroquinolona (ciprofloxacino 500–750 mg c/12 h, levofloxacino 500–750 mg/día). Alternativa: TMP-SMX 160/800 mg c/12 h. Multirresistente: fosfomicina 3 g cada 24–48 h.',aj:'4–6 semanas. Si es refractaria: repetir, extender a 12 semanas o cambiar de familia.',pk:'Sin inflamación aguda la barrera está intacta: elegir fármacos liposolubles con buena penetración.',ojo:'Diagnóstico con Meares-Stamey de 2 o 4 vasos, sin antibióticos. El PSA no sirve. Diferenciar del síndrome de dolor pélvico crónico. RTU de próstata en casos refractarios.'}

,{g:'sx',n:'Meningitis bacteriana aguda',c:'Síndrome clínico',L:['Agentes','Tratamiento empírico y dosis','Duración','Farmacocinética clave','Ojo con'],esp:'Adultos: S. pneumoniae (~70%), N. meningitidis (~10%), Listeria (~5%, >50 años o inmunosupresión celular). Neonatos: estreptococo grupo B, E. coli, Listeria. Postquirúrgica: S. aureus, bacilos gramnegativos.',d:'2–50 años: vancomicina + ceftriaxona 2 g c/12 h. >50 años o inmunosuprimido: + ampicilina 2 g c/4 h. Neonato: ampicilina + cefotaxima o gentamicina. Dexametasona 10 mg c/6 h por 4 días, con o antes de la primera dosis. Meropenem 2 g c/8 h. Penicilina G 4 MUI c/4 h. TMP-SMX 5 mg/kg c/8 h.',aj:'Meningococo y H. influenzae ~7 días. Neumococo 10–14. Estreptococo grupo B 14–21. Gramnegativos y Listeria ≥21.',pk:'Penetración al LCR limitada: dosis meníngeas altas y frecuentes. Buena penetración: ceftriaxona en dosis altas, meropenem, TMP-SMX, quinolonas, linezolid. Mala: aminoglucósidos, clindamicina, cefazolina.',ojo:'No retrasar el antibiótico por la TAC. Suspender la dexametasona si es Listeria. Evitar imipenem (convulsiones). Suspender vancomicina si el neumococo es sensible a ceftriaxona. Profilaxis a contactos de meningococo.'}

,{g:'idsa',n:'BLEE (Enterobacterales)',c:'IDSA 2026 · resumen',L:['Cistitis','ITU complicada','Fuera de la vía urinaria','No se sugiere','Ojo con'],esp:'Preferidos: aminoglucósido en dosis única (gentamicina 5 mg/kg, amikacina 15 mg/kg), gepotidacina 1,5 g c/12 h, nitrofurantoína 100 mg c/12 h, pivmecilinam 370 mg c/8 h, sulopenem-probenecid c/12 h, TMP-SMX. Alternativa: fosfomicina oral (solo E. coli).',d:'Preferidos: TMP-SMX, ciprofloxacino, levofloxacino. Si no se pueden: cefepime-enmetazobactam o carbapenémico. Alternativas: fosfomicina IV 6 g c/8 h, aminoglucósidos, piperacilina-tazobactam (no crítico, sin bacteriemia).',aj:'Ertapenem, meropenem o imipenem. En críticos o con albúmina <2,5: meropenem o imipenem. Alternativa: cefepime-enmetazobactam. Paso oral: quinolona o TMP-SMX si es estable.',pk:'Piperacilina-tazobactam y cefepime en infección invasiva (aunque sean S). Cefamicinas. Amoxicilina-clavulánico y doxiciclina en cistitis. Nitrofurantoína, fosfomicina oral y sulopenem oral en bacteriemia.',ojo:'Reservar fármacos nuevos para CRE. La duración es la misma que con sensibles.'}
,{g:'idsa',n:'AmpC (Enterobacterales)',c:'IDSA 2026 · resumen',L:['Especies de riesgo moderado','Preferido','Cistitis y paso oral','No se sugiere','Ojo con'],esp:'Enterobacter cloacae complex, Klebsiella aerogenes, Citrobacter freundii y probablemente Hafnia alvei. Serratia, Morganella y Providencia: <5%, tratar según antibiograma.',d:'Cefepime (CIM ≤8 y sin BLEE identificada), 2 g c/8 h en infusión de 3 h. Carbapenémicos también son activos.',aj:'Cistitis: nitrofurantoína o TMP-SMX (alternativas: aminoglucósido único, quinolonas, pivmecilinam, sulopenem). Paso oral en invasivas: quinolona o TMP-SMX.',pk:'Ceftriaxona, cefotaxima o ceftazidima en infección invasiva (resistencia emergente ~20%). Piperacilina-tazobactam. Ceftolozano-tazobactam. Gepotidacina sin antibiograma.',ojo:'Resistencia intrínseca: ampicilina, amoxicilina-clavulánico, ampicilina-sulbactam, cefalosporinas de 1ª generación y cefamicinas. En infecciones leves con ceftriaxona empírica, buena respuesta y foco controlado, se puede completar.'}

/* ================= ESTADO ================= */
const KEY='espectro-idpharm-v1';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let st={xp:0,streak:0,lastDay:null,todayDate:today(),todayXp:0,correct:0,answered:0,combo:0,bestCombo:0,swipes:0,casesDone:[],wrong:[],badges:[],fichas:[]};
try{const raw=localStorage.getItem(KEY);if(raw)st=Object.assign(st,JSON.parse(raw))}catch(e){}
if(st.todayDate!==today()){st.todayDate=today();st.todayXp=0}
if(st.lastDay&&st.lastDay!==today()&&st.lastDay!==yesterday())st.streak=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const GOAL=50;

function rankOf(xp){let i=0;RANKS.forEach((r,k)=>{if(xp>=r[0])i=k});return i}
function addXp(n,label){
  const before=rankOf(st.xp);
  st.xp+=n;
  if(st.todayDate!==today()){st.todayDate=today();st.todayXp=0}
  st.todayXp+=n;
  if(st.lastDay!==today()){st.streak=(st.lastDay===yesterday())?st.streak+1:1;st.lastDay=today()}
  toast('+'+n+' XP'+(label?' · '+label:''));
  checkBadges();save();
  const after=rankOf(st.xp);
  if(after>before)setTimeout(()=>showModal('trophy','Nuevo rango',RANKS[after][1],'Llegaste a '+RANKS[after][0].toLocaleString('es-CL')+' XP.'),700);
}
function record(ok,id){
  st.answered++;
  if(ok){st.correct++;st.combo++;st.bestCombo=Math.max(st.bestCombo,st.combo);if(id)st.wrong=st.wrong.filter(w=>w!==id)}
  else{st.combo=0;if(id&&!st.wrong.includes(id))st.wrong.push(id)}
  save();
}
function grant(id){if(st.badges.includes(id))return;st.badges.push(id);const b=BADGES.find(x=>x.id===id);save();setTimeout(()=>showModal(b.ic,'Medalla desbloqueada',b.n,b.d),1200)}
function checkBadges(){
  if(st.correct>=1)grant('first');
  if(st.bestCombo>=10)grant('combo10');
  if(st.streak>=3)grant('streak3');
  if(st.streak>=7)grant('streak7');
  if(st.casesDone.length>=1)grant('case1');
  if(st.casesDone.length>=C.length)grant('caseall');
  if(st.swipes>=30)grant('swipe30');
  if(st.xp>=500)grant('xp500');
  if(st.xp>=1200)grant('xp1200');
  if(st.xp>=3500)grant('top');
  if(st.fichas.length>=10)grant('fichas');
}

const $app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1600)}
function showModal(ic,eyebrow,title,desc){
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="box pop" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="seal">${I[ic]}</div><span class="eyebrow">${esc(eyebrow)}</span><h2 id="mt">${esc(title)}</h2><p class="muted">${esc(desc)}</p><button class="btn" id="mclose">Seguir</button></div>`;
  m.hidden=false;document.getElementById('mclose').focus();
  document.getElementById('mclose').onclick=()=>{m.hidden=true;if(view==='home')render()};
}
let view='home';
const TABS=[['home','Inicio','home'],['quiz','Quiz','quiz'],['swipe','Desliza','swipe'],['cases','Casos','case'],['fichas','Fichas','book']];
function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(([k,l,ic])=>`<button class="tab" data-go="${k}" ${view===k||(view==='case'&&k==='cases')?'aria-current="page"':''}>${I[ic]}<span>${l}</span></button>`).join('');
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go)}});
function go(v){view=v;render();window.scrollTo(0,0)}
function topbar(){return `<div class="topbar"><div class="brand"><i aria-hidden="true"></i>Espectro</div><div class="chips"><span class="chip" style="color:var(--safranin)" title="Racha de días">${I.flame}<span class="mono">${st.streak}</span></span><span class="chip" style="color:var(--gold)" title="XP total">${I.bolt}<span class="mono">${st.xp.toLocaleString('es-CL')}</span></span></div></div>`}

function startQuiz(review,topic){
  let pool;
  if(topic)pool=shuffle(Q.filter(q=>TOPICS[topic].tags.includes(q.t))).slice(0,10);
  else if(review)pool=shuffle(Q.filter(q=>st.wrong.includes(q.id))).slice(0,10);
  else{const w=shuffle(Q.filter(q=>st.wrong.includes(q.id))).slice(0,3);pool=w.concat(shuffle(Q.filter(q=>!w.includes(q))).slice(0,10-w.length));pool=shuffle(pool)}
  qz={list:pool,i:0,score:0,answered:false,review,topic};view="quiz";renderTabs();renderQuiz();window.scrollTo(0,0);
}
function abTable(ab){if(!ab)return '';return `<div class="abg"><div class="abg-h"><span class="eyebrow">Antibiograma</span><b>${esc(ab.org)}</b></div><div class="abg-scroll"><table><thead><tr><th>Antimicrobiano</th><th>CIM (mg/L)</th><th>Int.</th></tr></thead><tbody>${ab.rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="mono">${esc(r[1])}</td><td><span class="si si-${r[2]==='S'?'s':r[2]==='R'||r[2]==='Positivo'?'r':'i'}">${esc(r[2])}</span></td></tr>`).join('')}</tbody></table></div></div>`}
function renderQuiz(){
  if(!qz)return startQuiz(false);
  if(qz.i>=qz.list.length)return renderQuizEnd();

  const order=qz.order||(qz.order=shuffle(q.o.map((_,k)=>k)));
  $app.innerHTML=`<div class="head"><button class="back" data-go="home" aria-label="Volver al inicio">${I.back}</button><div class="progress"><span style="width:${qz.i/qz.list.length*100}%"></span></div><span class="mono muted">${qz.i+1}/${qz.list.length}</span></div>
  <div class="stack">
    <div class="row" style="justify-content:space-between"><span class="tag">${esc(q.t)}</span>${st.combo>=3?`<span class="chip" style="color:var(--gold)">${I.bolt}<span class="mono">combo ${st.combo}</span></span>`:''}</div>

    <div id="fb"></div>
  </div>`;
  $app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answerQuiz(+b.dataset.k));
}
function answerQuiz(k){
  if(qz.answered)return;qz.answered=true;

  $app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const kk=+b.dataset.k;if(kk===q.a)b.classList.add('ok');else if(kk===k)b.classList.add('no')});
  record(ok,q.id);
  if(ok){qz.score++;addXp(10+(st.combo>=5?5:0),st.combo>=5?'combo':'')}
  document.getElementById('fb').innerHTML=`<div class="explain ${ok?'ok':'no'}"><h3>${ok?'Correcto':'No era esa'}</h3><p>${esc(q.e)}</p><p class="ref">${esc(q.r)}</p></div><div style="margin-top:12px"><button class="btn" id="nx">${qz.i+1<qz.list.length?'Siguiente':'Ver resultado'}</button></div>`;

function renderQuizEnd(){
  const n=qz.list.length,s=qz.score;

  $app.innerHTML=`<div class="stack" style="padding-top:20px;text-align:center;align-items:center">

  const end=()=>{if(x0===null)return;x0=null;top.style.transition='transform .3s';if(Math.abs(dx)>90)answerSwipe(dx>0);else{top.style.transform='';sv.style.opacity=0;sf.style.opacity=0}dx=0};
  top.addEventListener('pointerup',end);top.addEventListener('pointercancel',end);
  document.querySelectorAll('.swb').forEach(b=>b.onclick=()=>answerSwipe(b.dataset.a==='1'));

function answerSwipe(saidTrue){

}

    const d=b.parentElement,dl=d.querySelector('dl'),open=dl.hidden;dl.hidden=!open;d.classList.toggle('open',open);b.setAttribute('aria-expanded',open);
    if(open&&!st.fichas.includes(b.dataset.f)){st.fichas.push(b.dataset.f);if(st.fichas.length%5===0)addXp(5,'lectura');checkBadges();save()}
  });
}


/* ================= PREGUNTA DEL DÍA ================= */
function dailyQ(){const d=today();let h=0;for(const c of d)h=(h*31+c.charCodeAt(0))>>>0;return Q[h%Q.length]}
function dailyCard(){
  const done=st.dq&&st.dq.date===today();
  return `<section class="dq"><div><span class="eyebrow">Pregunta del día · XP doble</span><h3>${done?(st.dq.ok?'Respondida correctamente':'Respondida, mañana hay otra'):'20 XP te esperan'}</h3><p class="muted" style="font-size:.88rem">${done?'Vuelve mañana para una nueva pregunta.':'Una pregunta distinta cada día. Cuenta para tu racha.'}</p></div>${done?'':'<button class="btn" style="width:auto;padding:10px 16px" id="dqgo">Responder</button>'}</section>`;
}
let dqv=false;
function renderDaily(){
  const q=dailyQ();const order=shuffle(q.o.map((_,k)=>k));
  $app.innerHTML=`<div class="head"><button class="back" data-go="home" aria-label="Volver al inicio">${I.back}</button><span class="eyebrow" style="flex:1">Pregunta del día</span></div>
  <div class="stack"><span class="tag" style="align-self:flex-start">${esc(q.t)}</span>${abTable(q.ab)}<p class="qtext">${esc(q.q)}</p>
  <div class="opts">${order.map((k,j)=>`<button class="opt" data-k="${k}"><span class="k">${'ABCD'[j]}</span><span>${esc(q.o[k])}</span></button>`).join('')}</div><div id="fb"></div></div>`;
  let ans=false;
  $app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(ans)return;ans=true;const k=+b.dataset.k,ok=k===q.a;
    $app.querySelectorAll('.opt').forEach(o=>{o.disabled=true;const kk=+o.dataset.k;if(kk===q.a)o.classList.add('ok');else if(kk===k)o.classList.add('no')});
    st.dq={date:today(),ok};record(ok,q.id);if(ok){st.dqCount=(st.dqCount||0)+1;if(st.dqCount>=7)grant('daily7');addXp(20,'pregunta del día')}else save();
    document.getElementById('fb').innerHTML=`<div class="explain ${ok?'ok':'no'}"><h3>${ok?'Correcto':'No era esa'}</h3><p>${esc(q.e)}</p><p class="ref">${esc(q.r||'')}</p></div><div style="margin-top:12px"><button class="btn" data-go="home">Volver al inicio</button></div>`;
  });
}

/* ================= CONTRARRELOJ ================= */
let mt=null;
function renderMatch(){
  if(!mt||mt.over){
    $app.innerHTML=`<div class="head"><button class="back" data-go="home" aria-label="Volver al inicio">${I.back}</button><span class="eyebrow" style="flex:1">Contrarreloj</span></div>
    <div class="stack"><h1>Bichos vs drogas</h1><p class="muted">Tienes 60 segundos. Te mostramos un antimicrobiano y un microorganismo: decide si lo cubre o no. Cada acierto suma 1 punto y 2 XP; cada error resta 3 segundos.</p>
    ${mt&&mt.over?`<div class="chart" style="text-align:center"><span class="eyebrow">Resultado</span><h1 class="mono">${mt.score}</h1><p class="muted">${mt.score>=(st.bestMatch||0)&&mt.score>0?'Nuevo récord personal':'Récord: '+(st.bestMatch||0)}</p></div>`:`<div class="chart"><span class="eyebrow">Tu récord</span><h2 class="mono">${st.bestMatch||0} aciertos</h2></div>`}
    <button class="btn" id="mstart">${mt&&mt.over?'Jugar de nuevo':'Empezar'}</button></div>`;
    document.getElementById('mstart').onclick=startMatch;return;
  }
  const [d,b]=mt.cur;
  $app.innerHTML=`<div class="head"><button class="back" id="mquit" aria-label="Salir">${I.back}</button><div class="progress"><span id="mbar" style="width:${mt.left/60*100}%;background:var(--safranin)"></span></div><span class="mono" id="mleft">${Math.ceil(mt.left)}s</span></div>
  <div class="stack"><div class="row" style="justify-content:space-between"><span class="chip" style="color:var(--gold)">${I.bolt}<span class="mono">${mt.score}</span></span><span class="muted" style="font-size:.85rem">¿Lo cubre?</span></div>
  <div class="mcard ${mt.flash||''}"><span class="eyebrow">Antimicrobiano</span><p class="qtext">${esc(d)}</p><div class="vs">contra</div><span class="eyebrow">Microorganismo</span><p class="qtext" style="font-style:italic">${esc(b)}</p></div>
  <div class="swbtns"><button class="swb f" data-m="0">${I.x}No cubre</button><button class="swb v" data-m="1">${I.check}Cubre</button></div></div>`;
  $app.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>answerMatch(+x.dataset.m));
  document.getElementById('mquit').onclick=()=>{clearInterval(mt.timer);mt=null;go('home')};
}
function nextPair(){let p;do{p=MP[Math.floor(Math.random()*MP.length)]}while(mt.cur&&p===mt.cur);mt.cur=p}
function startMatch(){
  mt={score:0,left:60,over:false,cur:null,flash:''};nextPair();
  mt.timer=setInterval(()=>{if(view!=='match'){clearInterval(mt.timer);mt=null;return}mt.left-=.1;const l=document.getElementById('mleft'),bar=document.getElementById('mbar');if(l)l.textContent=Math.max(0,Math.ceil(mt.left))+'s';if(bar)bar.style.width=Math.max(0,mt.left/60*100)+'%';if(mt.left<=0)endMatch()},100);
  renderMatch();
}
function answerMatch(v){
  if(!mt||mt.over)return;const ok=v===mt.cur[2];
  if(ok){mt.score++;mt.flash='ok'}else{mt.left-=3;mt.flash='no';toast(mt.cur[0]+(mt.cur[2]?' sí cubre ':' no cubre ')+mt.cur[1])}
  nextPair();renderMatch();
}
function endMatch(){
  clearInterval(mt.timer);mt.over=true;
  if(mt.score>(st.bestMatch||0))st.bestMatch=mt.score;
  if(mt.score>=20)grant('speed');
  if(mt.score>0)addXp(mt.score*2,'contrarreloj');else save();
  renderMatch();
}
document.addEventListener('keydown',e=>{if(view==='match'&&mt&&!mt.over){if(e.key==='ArrowRight')answerMatch(1);if(e.key==='ArrowLeft')answerMatch(0)}});

/* ================= CALCULADORAS ================= */
const num=id=>{const v=parseFloat(String(document.getElementById(id).value).replace(',','.'));return isFinite(v)?v:NaN};
const f1=(x,d=1)=>isFinite(x)?x.toLocaleString('es-CL',{maximumFractionDigits:d,minimumFractionDigits:d}):'—';
let ctab='clcr';
function renderCalc(){
  const tabs=[['clcr','ClCr y peso'],['vanco','AUC vancomicina'],['amg','Aminoglucósidos']];
  $app.innerHTML=`<div class="head"><button class="back" data-go="home" aria-label="Volver al inicio">${I.back}</button><span class="eyebrow" style="flex:1">Calculadoras</span></div>
  <div class="stack"><h1>Calculadoras</h1><div class="seg" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-ct="${k}" aria-selected="${ctab===k}">${l}</button>`).join('')}</div><div id="cbody" class="stack"></div>
  <p class="foot">Herramienta de estudio. Verifica cada cálculo y aplica el protocolo de tu institución antes de usarlo en un paciente.</p></div>`;
  $app.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>{ctab=b.dataset.ct;renderCalc()});
  const body=document.getElementById('cbody');
  const field=(id,l,v,u)=>`<label class="fld" for="${id}"><span>${l}</span><span class="inp"><input id="${id}" inputmode="decimal" value="${v}"><em>${u}</em></span></label>`;
  if(ctab==='clcr'){
    body.innerHTML=`<div class="calc"><div class="seg" role="radiogroup"><button data-sex="m" aria-selected="${(st.csex||'m')==='m'}">Hombre</button><button data-sex="f" aria-selected="${st.csex==='f'}">Mujer</button></div>
    <div class="fgrid">${field('c-age','Edad',66,'años')}${field('c-wt','Peso real',95,'kg')}${field('c-ht','Talla',172,'cm')}${field('c-cr','Creatinina',1.1,'mg/dL')}</div></div><div id="cres"></div>`;
    const calc=()=>{
      const sex=st.csex||'m',age=num('c-age'),tbw=num('c-wt'),ht=num('c-ht'),cr=num('c-cr');
      const ibwR=(sex==='m'?50:45.5)+2.3*((ht/2.54)-60);
      const ibwU=tbw<ibwR?tbw:ibwR;
      const abw=tbw>ibwR?ibwR+0.4*(tbw-ibwR):tbw;
      const cg=w=>((140-age)*w/(72*cr))*(sex==='f'?0.85:1);
      const pct=tbw/ibwR*100;
      const rec=tbw<ibwR?'Peso real (está bajo el peso ideal)':pct>120?'Peso ajustado (peso real >120% del ideal)':'Peso ideal';
      const recV=tbw<ibwR?cg(tbw):pct>120?cg(abw):cg(ibwR);
      document.getElementById('cres').innerHTML=`<div class="res"><div class="big"><span class="eyebrow">ClCr sugerido (Cockcroft-Gault)</span><b class="mono">${f1(recV,0)} mL/min</b><small>${rec}</small></div>
      <dl class="kv"><div><dt>Peso ideal (Devine)</dt><dd class="mono">${f1(ibwR)} kg</dd></div><div><dt>Peso ajustado</dt><dd class="mono">${f1(abw)} kg</dd></div><div><dt>% del peso ideal</dt><dd class="mono">${f1(pct,0)}%</dd></div><div><dt>ClCr con peso real</dt><dd class="mono">${f1(cg(tbw),0)}</dd></div><div><dt>ClCr con peso ideal</dt><dd class="mono">${f1(cg(ibwU),0)}</dd></div><div><dt>ClCr con peso ajustado</dt><dd class="mono">${f1(cg(abw),0)}</dd></div></dl>
      <p class="muted" style="font-size:.82rem">No válido con creatinina inestable (falla renal aguda) ni en clearance aumentado; ahí conviene medir el ClCr en orina de 24 h u 8 h. Algunos centros redondean la creatinina baja a 0,8–1 en adultos mayores: eso tiende a subestimar el ClCr.</p></div>`;
    };
    body.querySelectorAll('input').forEach(i=>i.oninput=calc);
    body.querySelectorAll('[data-sex]').forEach(b=>b.onclick=()=>{st.csex=b.dataset.sex;save();body.querySelectorAll('[data-sex]').forEach(x=>x.setAttribute('aria-selected',x===b));calc()});
    calc();
  } else if(ctab==='vanco'){
    body.innerHTML=`<p class="muted" style="font-size:.9rem">Método de dos niveles con ecuaciones de primer orden (Sawchuk-Zaske), en estado estacionario y dentro del mismo intervalo. Toma el primer nivel al menos 1 h después del fin de la infusión.</p>
    <div class="calc"><div class="fgrid">${field('v-dose','Dosis',1500,'mg')}${field('v-tau','Intervalo',12,'h')}${field('v-tinf','Tiempo de infusión',1.5,'h')}${field('v-c1','Nivel 1',28,'mg/L')}${field('v-t1','Hora nivel 1 (desde inicio infusión)',2.5,'h')}${field('v-c2','Nivel 2',12,'mg/L')}${field('v-t2','Hora nivel 2 (desde inicio infusión)',11.5,'h')}${field('v-target','AUC objetivo',500,'mg·h/L')}</div></div><div id="vres"></div>`;
    const calc=()=>{
      const D=num('v-dose'),tau=num('v-tau'),ti=num('v-tinf'),c1=num('v-c1'),t1=num('v-t1'),c2=num('v-c2'),t2=num('v-t2'),tg=num('v-target');
      const el=document.getElementById('vres');
      if(!(c1>c2&&c2>0&&t2>t1&&t1>=ti&&tau>=t2)){el.innerHTML='<div class="res"><p>Revisa los datos: el nivel 1 debe ser mayor que el nivel 2, ambos tomados después del fin de la infusión y dentro del intervalo.</p></div>';return}
      const ke=Math.log(c1/c2)/(t2-t1),th=Math.LN2/ke;
      const cmax=c1*Math.exp(ke*(t1-ti)),cmin=c2*Math.exp(-ke*(tau-t2));
      const auc=(ti*(cmax+cmin)/2+(cmax-cmin)/ke)*24/tau;
      const nd=D*tg/auc,daily=D*24/tau;
      const state=auc<400?['bajo','si-r','Bajo la meta: riesgo de falla']:auc>600?['alto','si-r','Sobre la meta: mayor riesgo de nefrotoxicidad']:['en meta','si-s','Dentro de la meta 400–600'];
      el.innerHTML=`<div class="res"><div class="big"><span class="eyebrow">AUC24 estimada</span><b class="mono">${f1(auc,0)} mg·h/L</b><small><span class="si ${state[1]}">${state[0]}</span> ${state[2]}</small></div>
      <dl class="kv"><div><dt>ke</dt><dd class="mono">${f1(ke,3)} h⁻¹</dd></div><div><dt>Vida media</dt><dd class="mono">${f1(th)} h</dd></div><div><dt>Cmáx (fin infusión)</dt><dd class="mono">${f1(cmax)} mg/L</dd></div><div><dt>Cmín (valle)</dt><dd class="mono">${f1(cmin)} mg/L</dd></div><div><dt>Dosis diaria actual</dt><dd class="mono">${f1(daily,0)} mg</dd></div><div><dt>Dosis para AUC ${f1(tg,0)}</dt><dd class="mono">${f1(nd,0)} mg c/${f1(tau,0)} h</dd></div></dl>
      <p class="muted" style="font-size:.82rem">La nueva dosis asume cinética lineal y el mismo intervalo; redondea a la presentación disponible y repite niveles en 24–72 h, o antes si cambia la función renal.</p></div>`;
    };
    body.querySelectorAll('input').forEach(i=>i.oninput=calc);calc();
  } else {
    body.innerHTML=`<div class="calc"><div class="seg" role="radiogroup"><button data-ag="g" aria-selected="${(st.cag||'g')==='g'}">Gentamicina / tobramicina</button><button data-ag="a" aria-selected="${st.cag==='a'}">Amikacina</button></div>
    <div class="fgrid">${field('a-mgkg','Dosis',(st.cag==='a')?15:7,'mg/kg')}${field('a-wt','Peso real',80,'kg')}${field('a-ibw','Peso ideal',70,'kg')}${field('a-cl','ClCr',75,'mL/min')}</div></div><div id="ares"></div>`;
    const calc=()=>{
      const mk=num('a-mgkg'),tbw=num('a-wt'),ibw=num('a-ibw'),cl=num('a-cl');
      const w=tbw<ibw?tbw:tbw>1.2*ibw?ibw+0.4*(tbw-ibw):tbw;
      const wl=tbw<ibw?'peso real':tbw>1.2*ibw?'peso ajustado':'peso real';
      const dose=mk*w,step=(st.cag==='a')?50:10,rd=Math.round(dose/step)*step;
      const iv=cl>=60?'c/24 h':cl>=40?'c/36 h':cl>=20?'c/48 h':'Dosis única y redosificar según niveles';
      document.getElementById('ares').innerHTML=`<div class="res"><div class="big"><span class="eyebrow">Dosis por intervalo extendido</span><b class="mono">${f1(rd,0)} mg</b><small>${f1(mk,0)} mg/kg × ${f1(w)} kg (${wl})</small></div>
      <dl class="kv"><div><dt>Intervalo inicial sugerido</dt><dd>${iv}</dd></div><div><dt>Peso usado</dt><dd class="mono">${f1(w)} kg</dd></div></dl>
      <p class="muted" style="font-size:.82rem">Intervalos según el nomograma de Hartford para 7 mg/kg de gentamicina; confirma con un nivel a las 6–14 h. Rangos habituales: gentamicina/tobramicina 5–7 mg/kg, amikacina 15–20 mg/kg. No aplica a endocarditis por grampositivos (sinergia), embarazo, quemados extensos ni diálisis.</p></div>`;
    };
    body.querySelectorAll('input').forEach(i=>i.oninput=calc);
    body.querySelectorAll('[data-ag]').forEach(b=>b.onclick=()=>{st.cag=b.dataset.ag;save();renderCalc()});
    calc();
  }
}
/* ================= RENDER ================= */
function render(){
  renderTabs();
  if(view==='home')renderHome();
  else if(view==='quiz'){if(!qz||qz.i>=qz.list.length)startQuiz(false);else renderQuiz()}
  else if(view==='swipe')renderSwipe();
  else if(view==='cases')renderCases();
  else if(view==='case')renderCase();
  else if(view==='fichas')renderFichas();
  else if(view==='daily')renderDaily();
  else if(view==='match')renderMatch();
  else if(view==='calc')renderCalc();
}
render();
</script>
